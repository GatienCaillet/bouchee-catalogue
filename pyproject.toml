[project]
name = "bouchee-catalogue"
version = "0.1.0"
description = "Référentiel d'ingrédients, validateur strict et chaîne de publication du catalogue Bouchée"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["bouchee"]
