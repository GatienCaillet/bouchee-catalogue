id: risotto
titre: Risotto au parmesan
portions: 4
temps:
  preparation: 10
  cuisson: 25
ingredients:
- 1 oignon
- 2 c. à soupe d'huile d'olive
- 300 g de riz arborio
- 1/2 verre de vin blanc sec
- 1 l de bouillon de volaille
- 1 noix de beurre
- 30 g de parmesan râpé
etapes:
- Émincer l'oignon et le faire fondre dans l'huile d'olive.
- Ajouter le riz et le remuer jusqu'à ce qu'il devienne translucide.
- Verser le vin blanc et le laisser réduire.
- Ajouter le bouillon chaud louche par louche, en attendant chaque fois qu'il soit absorbé ; compter 18 minutes.
- Hors du feu, incorporer le beurre et le parmesan, couvrir et attendre deux minutes avant de servir.
