id: gelee-de-nefles
titre: Gelée de nèfles
portions: 4
temps:
  preparation: 16
  cuisson: 20
  repos: 0
ingredients:
- 2 kg de nèfles
- du sucre cristallisé.
etapes:
- Placer les nèfles non épluchées et coupées en 4 dans un faitout, les recouvrir d'eau, et faire bouillir jusqu'à
  éclatement des fruits.
- Il faut alors les presser pour exprimer le jus et le filtrer.
- Ce jus, additionné de sucre cristallisé à raison de 750 g par litre, est mis à bouillir pendant 20 minutes environ,
  en le remuant de temps à autre, jusqu'à obtenir la prise en gelée.
- Dès la prise, mettre la gelée en pots.
