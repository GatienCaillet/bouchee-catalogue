id: trinchat
titre: Trinchat
portions: 6
temps:
  preparation: 25
  cuisson: 0
  repos: 0
ingredients:
- texte: 1 chou
  ingredients:
  - chou
  categorie: true
- 600 g de pomme de terre
- 12 tranches de ventrèche
- sel
- poivre
etapes:
- Laver le chou, le débarrasser des parties dures, le faire blanchir, l'égoutter.
- Porter trois litres d'eau à ébullition, y plonger le chou, aux premier bouillons ajouter les pommes de terre épluchées
  et coupées en morceaux, saler et poivrer.
