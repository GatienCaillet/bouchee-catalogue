id: concorde
titre: Concorde
portions: 4
temps:
  preparation: 31
  cuisson: 0
  repos: 0
ingredients:
- 9 blancs d'œuf
- 3 jaunes d'œuf
- 150 g de sucre glace
- 170 g de sucre en poudre
- 35 g de poudre de cacao amer
- 120 g de chocolat à croquer
- 75 g de beurre.
etapes:
- La cuisson de la meringue nécessitant une température précise et stable, l'usage d'un four à gaz est déconseillé
  (à moins de bien connaître son four).
- Les fonds de meringue et les doigts de fée peuvent être préparés à l'avance. Ils se conservent très bien 15 jours
  au sec, bien emballés.
