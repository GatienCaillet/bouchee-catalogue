id: puree-de-patates-douces-et-pommes-de-terre
titre: Purée de patates douces et pommes de terre
portions: 4
temps:
  preparation: 15
  cuisson: 25
  repos: 0
ingredients:
- 800 g de patates douces
- 400 g de pommes de terre
- 30 g de beurre
- 10 cl de lait
- sel, poivre
etapes:
- Éplucher les patates douces et les couper en cubes.
- Éplucher les pommes de terre et les couper en morceaux.
- Cuire les patates douces et les pommes de terre 20 à 25 minutes à l'eau bouillante salée.
- Égoutter, puis écraser au presse-purée avec le beurre et le lait chaud.
- Saler, poivrer et servir aussitôt.
decouverte:
  aliment: patate_douce
  niveau: 5
  pourquoi: La patate douce donne son goût et sa couleur à la purée.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
