id: soupe-minestrone
titre: Soupe minestrone
portions: 6
temps:
  preparation: 30
  cuisson: 30
  repos: 720
ingredients:
- 150 g de haricots blancs secs
- 100 g de chou blanc
- 2 carottes
- 150 g de haricots verts
- 150 g de petits pois
- 2 pommes de terre
- 4 tomates
- 1 oignon
- 1 gousse d'ail
- 2 l de bouillon de légumes
- 1 branche de thym
- 1 branche de romarin
- quelques feuilles de basilic
- 2 c. à soupe d'huile d'olive
- sel, poivre
- texte: 2 c. à soupe de pesto pour servir (facultatif)
  facultatif: true
etapes:
- La veille, mettre les haricots secs à tremper 12 heures.
- Émincer le chou et l'oignon ; couper en dés les tomates, les pommes de terre et les carottes ; tronçonner les
  haricots verts et hacher l'ail.
- Faire revenir l'oignon et l'ail dans l'huile, puis ajouter les autres légumes et les laisser suer quelques instants.
- Mouiller avec le bouillon, ajouter le thym, le romarin et les haricots égouttés.
- Cuire 30 minutes à l'autocuiseur, assaisonner et servir avec le basilic, et du pesto si on le souhaite.
