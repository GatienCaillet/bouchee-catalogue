id: ratatouille3
titre: Ratatouille3
portions: 4
temps:
  preparation: 34
  cuisson: 60
  repos: 0
ingredients:
- 1 aubergine
- 3 courgettes
- 1 poivron jaune
- 6 tomates
- 1 oignon
- 2 gousses d'ail
- 2 branches de thym, 1 feuille de laurier
- 10 cl d'huile d'olive, sel, poivre
etapes:
- Laver et couper tous les légumes.
- Dans un faitout, chauffer l'huile d'olive, faire blondir l'oignon haché
- Incorporer d'abord les tomates puis la totalité des légumes et des aromates
- Cuire à feu doux durant 1 heure, en remuant
