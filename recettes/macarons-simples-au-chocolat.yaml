id: macarons-simples-au-chocolat
titre: Macarons simples au chocolat
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 30
ingredients:
- 250 g de sucre glace
- 100 g d'amandes en poudre
- 25 g de noix de coco en poudre
- 20 g de cacao en poudre
- 3 blancs d'œufs
- 2 g de sel.
etapes:
- bien ferme avec le sel, et mélanger les autres ingrédients ensemble.
- Incorporer les blancs.
- Faire des petits tas sur une plaque recouverte de papier sulfurisé.
- Laisser reposer 15 min, enfourner 15 min à 160°C.
