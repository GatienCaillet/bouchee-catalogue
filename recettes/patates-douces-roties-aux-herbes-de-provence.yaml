id: patates-douces-roties-aux-herbes-de-provence
titre: Patates douces rôties aux herbes de Provence
portions: 4
temps:
  preparation: 10
  cuisson: 35
  repos: 0
ingredients:
- 800 g de patates douces
- 3 c. à soupe d'huile d'olive
- 1 c. à soupe d'herbes de Provence
- 2 gousses d'ail
- sel, poivre
etapes:
- Préchauffer le four à 210 °C.
- Éplucher les patates douces et les couper en cubes.
- Étaler les patates douces sur une plaque, arroser d'huile d'olive et ajouter les gousses d'ail entières.
- Parsemer d'herbes de Provence, saler, poivrer et bien mélanger.
- Enfourner 30 à 40 minutes en remuant à mi-cuisson, jusqu'à ce que les légumes soient dorés et tendres.
decouverte:
  aliment: patate_douce
  niveau: 4
  pourquoi: Rôties, servies en accompagnement.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
