id: meringue-francaise
titre: Meringue française
portions: 4
temps:
  preparation: 16
  cuisson: 120
  repos: 0
ingredients:
- 200 g de sucre glace
- 4 blancs d'œuf
etapes:
- Monter les blancs en neige fermement
- Mélanger le sucre glacé et les blancs en neige, en glissant les blancs sur le sucre puis en coupant les blancs
  avec une spatule et en les renversant.
- Cuire 120 min à 70°C
