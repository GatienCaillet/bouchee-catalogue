id: galettes-de-sarrasin
titre: Galettes de sarrasin
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 2 cuillères à soupe de farine de blé
- 350 g de farine de sarrasin
- 1 cuillère à soupe de farine de soja
- sel marin
- muscade
- 1 litre d'eau.
etapes:
- Mettre les farines dans un récipient. Ajouter le sel et suffisamment d'eau pour constituer une pâte épaisse. Bien
  mélanger afin d'obtenir une pâte lisse ayant la consistance un peu plus épaisse que la pâte à crêpes.
- Huiler légèrement une poêle. Verser l'équivalent d'une petite louche de pâte dans la poêle chaude et faire cuire
  de chaque côté. Bien remuer la pâte avant de la mettre dans la poêle.
- 'Garnir les galettes selon votre choix : champignons, oignons, aubergines, tomates, brocolis, etc.'
