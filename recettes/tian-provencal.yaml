id: tian-provencal
titre: Tian provençal
portions: 6
temps:
  preparation: 43
  cuisson: 25
  repos: 0
ingredients:
- 400 g de courgettes
- 200 g d'aubergines
- 2 tomates
- 2 gros oignons
- 1 ou 2 gousses d'ail (selon votre goût)
- 3 œufs
- 100 g de brousse (ou à défaut de fromage blanc)
- 100 g de gruyère ou d'emmental
- huile d'olive
- herbes de Provence
- sel, poivre
etapes:
- Peler et émincer les oignons, le mettre dans une poêle à petit feu avec un fond d'huile d'olive.
- Laver les courgettes et les aubergines (pelez les éventuellement), et les couper en dés. Ajoutez les dans la poêle
  avec les oignons. Augmenter le feu et faire revenir le tout.
- Battre les œufs avec la brousse, saler, poivrer et ajouter quelques herbes de Provence. Ajoutez y l'ail écrasé.
- Placer au fond d'un plat à gratin les légumes revenus à la poêle et les tomates coupées en dés.
- Verser ensuite la préparation à l'œuf. Râper le fromage par dessus.
- Mettre au four environ 20 minutes à 180°C. Puis passer ensuite quelques minutes en position grill pour faire dorer
  le fromage.
