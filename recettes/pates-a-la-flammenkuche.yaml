id: pates-a-la-flammenkuche
titre: Pâtes à la flammenkuche
portions: 4
temps:
  preparation: 22
  cuisson: 5
  repos: 0
ingredients:
- texte: 400 g de pâtes
  ingredients:
  - pates
  categorie: true
- 200 g de fromage blanc
- 120 g de lardons
- 2 gros oignons
etapes:
- Faire cuire les pâtes en suivant les instructions écrites sur le paquet.
- Dans une casserole, faire revenir les lardons (nul besoin d'huile, le gras des lardons suffit). Ajouter les oignons
  coupés en lamelles.
- Lorsque les oignons sont translucides, ajouter le fromage blanc. Laisser à feu doux cinq minutes.
- Servir les pâtes accompagnées de sauce.
