id: anchoiade
titre: Anchoïade
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- anchois
- huile d'olive
- crudités de saison.
etapes:
- Mettre les filets d'anchois à chauffer avec un filet d'huile d'olive en mélangeant au fouet
- si le mélange obtenu n'est pas assez homogène, on peut le lier avec un tout petit peu de farine que l'on ferra
  cuire avec.
- Présentez les crudités de saison autour de l'anchoïade.
- Œufs dur
- céleri
- choux fleur
- choux rouge
- carottes
- endives
- tomate
- poivron
- concombre.
