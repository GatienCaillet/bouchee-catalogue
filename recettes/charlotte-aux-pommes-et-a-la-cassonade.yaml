id: charlotte-aux-pommes-et-a-la-cassonade
titre: Charlotte aux pommes et à la cassonade
portions: 4
temps:
  preparation: 31
  cuisson: 30
  repos: 0
ingredients:
- 30 biscuits à la cuillère
- 6 pommes
- 100 à 150 g de cassonade
- 75 g de beurre
- 6 cuillères à soupe de sucre de canne
- 8 cuillères à soupe d' eau
- ½ cuillère à café d'extrait de vanille
etapes:
- Couper les pommes. Fondre le beurre dans une poêle et y ajouter la cassonade cuillère par cuillère. Lorsque le
  mélange mousse, ajouter les pommes, mélanger et cuire 30 min
- Mélanger le sucre de canne, l'eau et l'extrait de vanille. Y tremper un à un les biscuits avant d'en tapisser
  le moule
- Verser la moitié des pommes dans le moule, mettre une couche de biscuits, verser le reste pommes et couvrir de
  biscuits. Couvrir d'une assiette
- Mettre au frais six heure
