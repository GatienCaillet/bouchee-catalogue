id: vassilopita-d-asie-mineure
titre: Vassilopita d'Asie mineure
portions: 4
temps:
  preparation: 34
  cuisson: 30
  repos: 0
ingredients:
- 250 g de farine
- 200 g de beurre
- 200 g de sucre
- 10 dl de lait
- 2 œufs
- 100 g d'amandes
- 4 cl de cognac
- 1 sachet de levure chimique.
etapes:
- Mélanger la farine, la levure et les amandes réduites en poudre
- Battre le beurre et le sucre, ajouter le lait et le cognac
- Cuire 30 min dans un four a 200°C.
