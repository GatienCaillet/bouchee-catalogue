id: boulettes-aux-noix-de-cajou
titre: Boulettes aux noix de cajou
portions: 4
temps:
  preparation: 34
  cuisson: 20
  repos: 0
ingredients:
- 50 g de noix de cajou moulues
- 25 de chapelure de pain
- 1 oignon
- texte: 1 branche de céleri
  ingredients:
  - celeri
  categorie: true
- 1 carotte
- 2 cuillères à soupe de tamari
- 1 tasse d'eau
- thym, persil
etapes:
- Hachez finement l'oignon, ainsi que la branche de céleri. Râpez la carotte. Mélangez tous les ingrédients et façonnez
  des boulettes. Déposez chaque boulette sur une plaque à cuisson préalablement huilée.
- Faites cuire à 180°C pendant 20 min en les retournant à la mi-cuisson.
