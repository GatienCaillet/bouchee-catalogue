id: pizza-poivrons-pesto
titre: Pizza aux poivrons et au pesto
portions: 2
temps:
  preparation: 15
  cuisson: 20
ingredients:
- 250 g de pâte à pizza
- 3 poivrons
- 3 c. à soupe de pesto
- 2 c. à soupe d'huile d'olive
- 1 c. à café d'origan
etapes:
- Étaler la pâte dans un moule à pizza huilé.
- Couper les poivrons en lanières et les faire revenir dans l'huile.
- Étaler le pesto sur la pâte, répartir les poivrons et saupoudrer d'origan.
- Cuire 20 minutes à 235 °C.
