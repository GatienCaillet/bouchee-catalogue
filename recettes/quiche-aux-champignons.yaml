id: quiche-aux-champignons
titre: Quiche aux champignons
portions: 4
temps:
  preparation: 20
  cuisson: 40
  repos: 0
ingredients:
- 1 pâte brisée
- 400 g de champignons de Paris
- 1 échalote
- 3 œufs
- 20 cl de crème fraîche
- 10 cl de lait
- 1 pincée de muscade
- sel, poivre
etapes:
- Préchauffer le four à 180 °C et garnir un moule à tarte de la pâte brisée.
- Émincer les champignons et l'échalote et les faire revenir 10 minutes à la poêle.
- Battre les œufs avec la crème et le lait ; saler, poivrer et ajouter la muscade.
- Répartir la garniture sur la pâte et verser l'appareil par-dessus.
- Enfourner 35 à 40 minutes, jusqu'à ce que la quiche soit dorée et prise.
decouverte:
  aliment: champignon_de_paris
  niveau: 2
  pourquoi: Émincés et pris dans l'appareil, les champignons se font discrets.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
