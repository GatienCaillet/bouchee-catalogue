id: spaghettis-a-l-ail-et-a-l-huile-d-olive
titre: Spaghettis à l'ail et à l'huile d'olive
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de spaghettis
- 4 gousses d'ail
- 6 c. à soupe d'huile d'olive
- 1/2 botte de persil
- 1 pincée de piment d'Espelette
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Faire dorer l'ail émincé dans l'huile à feu doux, ajouter le piment, puis mélanger aux pâtes avec le persil haché.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
