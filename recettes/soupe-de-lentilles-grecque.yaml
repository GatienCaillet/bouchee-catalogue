id: soupe-de-lentilles-grecque
titre: Soupe de lentilles grecque
portions: 4
temps:
  preparation: 31
  cuisson: 45
  repos: 0
ingredients:
- 500 g de lentilles
- 3 gousses d'ail
- 5 cl d'huile d'olive
- 1 tomate
- 1 oignon
- sel, poivre
- 1,5 litre d'eau
etapes:
- Mettre les lentilles dans une casserole, couvrir d'eau, bouillir 5 minutes, égoutter
- Suer l'oignon a l'huile, ajouter les lentilles, l'eau, l'ail et la tomate
- Cuire 40 min
