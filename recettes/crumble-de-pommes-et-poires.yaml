id: crumble-de-pommes-et-poires
titre: Crumble de pommes et poires
portions: 4
temps:
  preparation: 20
  cuisson: 35
  repos: 0
ingredients:
- 500 g de pommes
- 500 g de poires
- 150 g de farine
- 100 g de beurre
- 100 g de sucre roux
- 1 c. à café de cannelle
etapes:
- Préchauffer le four à 180 °C.
- Éplucher les pommes et les poires et les couper en morceaux.
- Disposer les fruits dans un plat beurré et saupoudrer de cannelle.
- Mélanger du bout des doigts la farine, le sucre et le beurre froid en dés jusqu'à obtenir une pâte sableuse.
- Répartir sur les fruits et enfourner 35 minutes, jusqu'à ce que le dessus soit doré.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
