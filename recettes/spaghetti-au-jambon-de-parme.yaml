id: spaghetti-au-jambon-de-parme
titre: Spaghetti au jambon de Parme
portions: 4
temps:
  preparation: 28
  cuisson: 10
  repos: 0
ingredients:
- 400 g de spaghettis
- 4 tranches de jambon de Parme
- 2 tranches de jambon blanc
- 4 petits oignons
- 100 g de parmesan
- huile d'olive
etapes:
- Couper les oignons et les faire roussir avec l'huile d'olive.
- Dans une casseroles d'eau bouillante, faire cuire les spaghettis.
- Couper en dés le jambon blanc et l'ajouter aux oignons. Laisser cuire pendant cinq minutes.
- Ajouter les pâtes et le parmesan en copeaux. Mélanger, couvrir des tranches de jambon de Parme. Posez un couvercle
  et laisser cinq minutes à feu éteint. Servir.
