id: veloute-de-betteraves
titre: Velouté de betteraves
portions: 4
temps:
  preparation: 15
  cuisson: 30
  repos: 0
ingredients:
- 600 g de betteraves
- 1 oignon
- 2 c. à soupe d'huile d'olive
- 1 l de bouillon de légumes
- 10 cl de crème liquide
- sel, poivre
etapes:
- Éplucher les betteraves et les couper en cubes.
- Émincer l'oignon et le faire revenir 3 minutes dans l'huile d'olive, dans une grande casserole.
- Ajouter les betteraves, mélanger, puis verser le bouillon.
- Porter à ébullition et laisser cuire 20 à 25 minutes à feu moyen, jusqu'à ce que les légumes soient tendres.
- Ajouter la crème, mixer finement et rectifier l'assaisonnement.
decouverte:
  aliment: betterave
  niveau: 5
  pourquoi: La betterave fait tout le plat, adoucie par la crème.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
