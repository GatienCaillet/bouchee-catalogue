id: flan-aux-oeufs-au-chocolat
titre: Flan aux œufs au chocolat
portions: 4
temps:
  preparation: 25
  cuisson: 135
  repos: 0
ingredients:
- 1/2 litre de lait
- 4 œufs
- texte: 50 grammes de chocolat
  ingredients:
  - chocolat
  categorie: true
- 100 grammes de sucre
- zestes de citron selon goût
etapes:
- Fouetter les 4 œufs avec le chocolat.
- Ajouter le lait chauffé, sucre et arôme avec les zestes de citron.
- Mettre le tout dans un récipient.
- Mettre le récipient dans une cocotte à pression durant un quart d'heure.
- Laisser refroidir 2 heures environ.
