id: panettone
titre: Panettone
portions: 4
temps:
  preparation: 40
  cuisson: 80
  repos: 0
ingredients:
- 6 jaunes d'œufs
- 250 g de farine
- 150 g de raisins secs de Corinthe
- 125 g de beurre
- 80 g de sucre
- 50 g de fruits confits
- 10 g d'écorce de citron et d'orange râpées
- un sachet de levure de boulanger
- 1 sachet de sucre vanillé
- une pincée de sel.
etapes:
- Réhydrater la levure pendant 10 minutes dans une tasse d'eau tiède et attendre 15 minutes
- Incorporer et mélanger les jaunes d'œufs, le sucre vanillé, les zestes râpés du citron et de l'orange, le sel
  et le sucre
- Ajouter la moitié de la farine puis le beurre ramolli en morceaux, puis le reste de la farine
- Pétrir la pâte pendant 15 min
- Rouler la pâte en boule et laisser gonfler dans un endroit tiède (la pâte doit avoir doublé de volume)
- Pétrir en incorporant les fruits confits hachés très fins et les raisins secs
- Reformer la boule, tracer une croix sur le dessus, la mettre dans un moule cylindrique beurré et laisser lever
- Enduire le dessus de beurre fondu et le mettre au four
- Cuire à four moyen (190° C) pendant 10 min, puis baisser un peu la chaleur et faire cuire de 30 à 40 min en badigeonnant
  de beurre à mi-cuisson
- Laisser refroidir.
