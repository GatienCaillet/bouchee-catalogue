id: rotie
titre: Rôtie
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- tranches de pain
- sucre en poudre
- eau (+ glaçons)
- vin rouge
etapes:
- Faire griller les tranches de pain et les réduire en morceaux dans un saladier. Ajouter ensuite de l'eau et des
  glaçons. Verser du sucre en poudre et ajouter du vin rouge. La quantité de sucre et de vin rouge à ajouter est
  subjective. Il est pour cela conseillé de goûter la rôtie après chaque ajout d'un des deux ingrédients pour arriver
  à trouver la proportion qui convient le plus.
