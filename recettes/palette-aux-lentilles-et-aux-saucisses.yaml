id: palette-aux-lentilles-et-aux-saucisses
titre: Palette aux lentilles et aux saucisses
portions: 4
temps:
  preparation: 25
  cuisson: 300
  repos: 0
ingredients:
- 1 kg de petites lentilles vertes
- 2 carottes
- 1 petits poireaux
- 2 gousses d'ail
- 1 oignon.
etapes:
- Mettre les lentilles à tremper 4 à 5 heures dans de l'eau froide.
- 'Cuire la palette pendant 45 min à 1h00 thermostat : 5 (une fois l''eau bouillante)'
- Au bout de 30 min retirer la moitié de l'eau, puis rajouter de l'eau (pour faire disparaitre le trop plein de
  sel). Continuer à laisser mijoter.
- Retirer la palette. Ajouter les lentilles, carottes, poireaux dans la marmite, laisser mijoter 30 min a 45 min.
- Replonger la viande dans la marmite quelques minutes avant de servir.
- Vous pouvez également ajouter 15 min avant de servir vos saucisses de Montbéliard dans la marmite de légumes,
  augmentant ainsi la diversité des viandes.
- Couper la viande en tranche, les déposer délicatement sur le plat de lentilles.
- Déguster.
