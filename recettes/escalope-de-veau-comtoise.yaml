id: escalope-de-veau-comtoise
titre: Escalope de veau Comtoise
portions: 4
temps:
  preparation: 31
  cuisson: 15
  repos: 0
ingredients:
- 1 escalope de veau
- 1 tranche de jambon cru fumé
- texte: 100 g de champignons cuits
  ingredients:
  - champignon
  categorie: true
- 1 verre de vin blanc du Jura
- 1 grosse cuillère de crème fraîche
- 100 g de comté râpé
- De l'huile d'olive
etapes:
- Préchauffer votre four à 150 °C thermostat 5
- Faite revenir et dorer les escalopes de veau dans l'huile d'olive dans une grande poêle. Salez et poivrez.
- Mettre les escalopes dans un plat, puis les recouvrir de fines tranches de jambon cru fumé et du comté râpé. Faire
  fondre et dorer le fromage au four (10 min)
- Déglacer la poêle avec 1 verre de vin blanc du Jura, ajouter les champignons et 1 cuillère à soupe de crème fraîche
  et laisser cuire 5 min.
- Napper les escalopes de veau sorties du four avec la sauce au comté
- Accompagné les escalopes de veau Comtoise de tagliatelles, de pâte fraîche, ou de pomme de terre à l'eau
- Accompagner de vin blanc du Jura, de Savagnin ou de Vin Jaune ...
