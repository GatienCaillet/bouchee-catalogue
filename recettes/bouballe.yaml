id: bouballe
titre: Bouballe
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- 1 cuillère à soupe de matzemehl (farine de matza)
- 2 œufs
- 1 cuillère à soupe de fécule (peut être remplacé par du matzemehl).
etapes:
- Monter les blancs en neige.
- Ajouter les jaunes d'œufs.
- Ajouter le matzemehl et la fécule.
- Mélanger le tout.
- Faire cuire comme une omelette et retourner.
