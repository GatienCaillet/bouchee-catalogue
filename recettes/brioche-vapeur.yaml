id: brioche-vapeur
titre: Brioche vapeur
portions: 4
temps:
  preparation: 28
  cuisson: 5
  repos: 315
ingredients:
- 200 à 250 ml d'eau à température ambiante
- 2 cuillère à soupe de sucre
- 450g de farine de blé
- 1 cuillère à café de levure chimique
- une demi-cuillère à café de sel (facultatif)
- un peu d'huile de sésame pour enduire un bol
etapes:
- Mélanger la levure avec 1 cuillère à soupe de sucre dans la quantité d'eau que vous avez laissé à température
  ambiante. Laisser reposer pendant 15 minutes. Sauter cette étape si votre levure n'a pas besoin d'être activée.
- Tamiser la farine avec le sucre.
- Si vous avez activé la levure avec l'eau, ajouter la farine et le reste de sucre dans le bol. Sinon, mélanger
  la farine, le sucre et le sel avec la levure. Ajouter l'eau doucement en remuant constamment. Vous devriez obtenir
  un beau pâton. Si la pâte ne peut être rassemblée, ajouter quelques cuillères à café d'eau.
- Pétrir la pâte pendant 5 à 10 minutes. La pâte devrait devenir plus ferme et un doigt enfoncé devrait laisser
  une empreinte qui se referme lentement. La surface de la pâte devrait être lisse et légèrement brillante.
- Enduire d'une fine couche d'huile de sésame le fond d'un grand bol et y placer la pâte. Faire rouler la pâte légèrement
  dans le bol pour qu'elle soit couverte d'huile.
- Laisser la pâte reposer dans un endroit chaud pendant une à une heure et demi jusqu'à ce qu'elle double de volume.
  Il est aussi possible de la laisser au réfrigérateur pendant 2 ou 3 heures. Le repos de la pâte dans un endroit
  frais permettra d'obtenir une texture plus fine.
- Pétrir à nouveau la pâte. Si vous le souhaitez, vous pouvez laisser la pâte reposer à nouveau avant de la pétrir
  encore. Une double fermentation permet d'obtenir une texture plus fine et plus tendre.
- Étaler la pâte pour former un ovale.
- Saupoudrer la levure chimique uniformément sur la pâte et la pétrir à nouveau. Si la pâte est plus humide à cause
  de la fermentation, ajouter un petit peu de farine si nécessaire.
- Diviser la pâte en deux longs rouleaux et les découper en 6 morceaux chacun. Vous avez alors 12 pâtons.
- Rouler en boule chaque morceau de pâte. Vous pouvez cuire ces brioches directement à la vapeur pour obtenir des
  mantou.
- Aplatir une boule de pâte en un disque de 15cm. Faire en sorte que les bords soient plus fins que le centre.
- Faire un rond avec le pouce et l'index et placer la pâte par dessus.
- En utilisant deux doigts, enfoncer la pâte dans le creux sur 2,5cm.
- Mettre une cuillère de farce dans le puits ainsi formé.
- En maintenant cette position, utiliser l'autre main pour replier les bords de la pâte en formant des pliures en
  éventail.
- Pincer ensemble les extrémités pour fermer la brioche et tourner pour le sceller.
- Placer chaque brioche sur un bout de papier cuisson. Si vous placez la fermeture en haut, la brioche s'ouvrira
  comme une fleur. Si vous la placez en bas, la brioche sera lisse.
- Laisser les brioches lever pendant 1 heure. La pâte devrait être élastique au toucher
