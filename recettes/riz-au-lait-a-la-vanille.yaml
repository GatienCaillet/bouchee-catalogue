id: riz-au-lait-a-la-vanille
titre: Riz au lait à la vanille
portions: 4
temps:
  preparation: 15
  cuisson: 40
  repos: 0
ingredients:
- 150 g de riz rond
- 1 l de lait
- 100 g de sucre
- 1 gousse de vanille
etapes:
- Faire chauffer le lait avec la gousse de vanille fendue.
- Ajouter le riz et cuire 40 minutes à feu très doux en remuant souvent.
- Ajouter le sucre en fin de cuisson et laisser refroidir.
source:
  titre: Recette Bouchée
