id: tarte-saumon-epinards
titre: Tarte au saumon et aux épinards
portions: 6
temps:
  preparation: 20
  cuisson: 25
ingredients:
- 1 rouleau de pâte feuilletée
- 300 g de pavé de saumon
- 250 g d'épinards frais
- 3 œufs
- 20 cl de crème fraîche
- 1 c. à café de coriandre en poudre
- sel, poivre
etapes:
- Préchauffer le four à 220 °C.
- Plonger les épinards 2 minutes dans l'eau bouillante, les égoutter, les presser puis les hacher grossièrement.
- Couper le saumon en fines lamelles.
- Battre les œufs avec la crème, la coriandre, du sel et du poivre.
- Dérouler la pâte dans un moule, répartir le saumon et les épinards, puis verser l'appareil.
- Cuire environ 25 minutes et servir chaud.
decouverte:
  aliment: epinard
  niveau: 3
  pourquoi: Les épinards sont visibles mais enrobés par la crème et accompagnés du saumon.
  conseil: Bien égoutter les épinards cuits pour ne pas détremper la pâte.
