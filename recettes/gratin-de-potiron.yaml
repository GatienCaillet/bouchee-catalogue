id: gratin-de-potiron
titre: Gratin de potiron
portions: 4
temps:
  preparation: 28
  cuisson: 40
  repos: 0
ingredients:
- 700 grammes de potiron (pour une recette provençale choisissez de la courge musquée)
- 250 grammes de pommes de terre
- 2 œufs
- 100 grammes de gruyère ou comté
- texte: 50 grammes de beurre ou un peu d'huile (exclusivement de l'huile d'olive en Provence).
  ingredients:
  - beurre
  - huile
  categorie: true
- Sel, poivre (suivant goût)
etapes:
- Éplucher le quartier de potiron
- Enlever les graines
- Couper en dés et faire cuire à l'eau bouillante salée pendant 20 minutes
- Faire cuire les pommes de terre
- Écraser le tout
- Incorporer les 2 œufs battus, le beurre, le sel et le poivre
- Mettre dans un plat allant au four
- Saupoudrer de gruyère
- Faire gratiner pendant 20 minutes
