id: croustade-aux-pommes
titre: Croustade aux pommes
portions: 4
temps:
  preparation: 37
  cuisson: 40
  repos: 60
ingredients:
- 5 belles pommes
- 50 g de cassonade
- 3 cuillerées à soupe d'eau de vie (ou de cognac)
- 1/2 verre d'eau
- 6 feuilles de brik
- 40 g de beurre doux
- 50 g de poudre de noisette
- 20 cl de crème fraîche
- 1 jaune d'œuf
etapes:
- Éplucher 5 belles pommes, les couper en tranches fines et les laisser macérer avec 1/2 verre d'eau et l'eau de
  vie avec 25 g de cassonade pendant une heure.
- Égoutter et garder le jus.
- Beurrer un moule à manqué et badigeonner 4 feuilles de brick de beurre fondu et les disposer dans le moule en
  laissant les bords dépasser de 1 cm.
- Saupoudrer de poudre de noisette (50 g).
- Disposer les tranches de pommes au fond du plat.
- Mélanger le jus de macération récupéré et la crème fraîche (20 cl) et un jaune d'œuf.
- Verser sur les pommes.
- Enfourner à 180°C pendant 10 minutes.
- Froisser les deux dernières bricks après les avoir découpées en bandes de 2 cm.
- Faire fondre le beurre (40 g) dans une petite casserole et ajouter (25 g) la cassonade.
- Verser le tout sur la croustade.
- Remettre au four pendant 30 min.
- Servir tiède, et éventuellement avec une boule de glace.
