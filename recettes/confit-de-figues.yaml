id: confit-de-figues
titre: Confit de figues
portions: 4
temps:
  preparation: 28
  cuisson: 30
  repos: 0
ingredients:
- 250 g de figues fraîches
- 100 g de sucre
- un peu de sel
- 50 g de beurre
- sucre vanillé
- 4 œufs.
etapes:
- Faire cuire au bain-marie le beurre et les figues
- Mélanger le sucre et les œufs, puis mélanger avec les figues
- Faire cuire la préparation au four pendant 30 minutes
- Servir frais.
