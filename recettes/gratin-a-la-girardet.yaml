id: gratin-a-la-girardet
titre: Gratin à la Girardet
portions: 4
temps:
  preparation: 28
  cuisson: 5
  repos: 0
ingredients:
- 2 dl de lait
- sel, poivre, muscade rapée
- 1 gousse d'ail
- 400 g de pommes de terre à chair ferme
- 1 dl de crème double
- 20 g de beurre
etapes:
- laver, peler et émincer les pommes de terre (3 mm d'épaisseur)
- Verser le lait dans une casserole
- assaisonner avec le sel, le poivre et la muscade
- hacher la gousse d'ail ajouter et mélanger
- ajouter les pommes de terre et cuire 4-5 minutes
- ajouter 1/2 dl de crème double, donner un bouillon et retirer du feu
- beurrer un plat à gratin et y verser les pommes de terre et le liquide de cuisson (la couche de pommes de terre
  n'excède pas 2 cm d'épaisseur)
- verser le reste de crème double et parsemer de beurre
