id: salade-de-pommes-et-pois-chiches
titre: Salade de pommes et pois chiches
portions: 4
temps:
  preparation: 31
  cuisson: 0
  repos: 0
ingredients:
- 50 g de pois chiche
- 3 oignons
- 2 pommes
- texte: 15 g de céleri
  ingredients:
  - celeri
  categorie: true
- 15 ml de jus de citron
- 15 ml d'huile d'olive
- Ciboulette, basilic, sel, poivre
etapes:
- 'Dans un saladier, mélanger : pois chiches cuits à l''eau, les pommes coupées en dés, les oignons émincés et le
  cèleri haché'
- Mélanger, le jus de citron, l'huile d'olive, la ciboulette haché, le basilic haché, le sel et le poivre
- Verser sur les pois chiches
- Laisser macérer au réfrigérateur
