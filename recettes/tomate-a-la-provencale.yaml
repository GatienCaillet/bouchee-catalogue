id: tomate-a-la-provencale
titre: Tomate à la provençale
portions: 4
temps:
  preparation: 28
  cuisson: 25
  repos: 0
ingredients:
- 8 tomates
- 8 gousses d'ail
- 3 c.c de persil haché
- 3 c.s. de chapelure
- huile d'olive
- sel, poivre noir
etapes:
- Laver les tomates, enlever le trognon et les couper en deux dans le sens de la largeur.
- Les faire dorer à l'huile d'olive dans une poêle, à feu doux 5 à 10 minutes, des deux côtés.
- Disposer dans un plat les demi tomates.
- Préparer un hachis avec l'ail, le persil et la chapelure. Répartir sur les demi tomates, saler et poivrer. Arroser
  avec un filet d'huile d'olive le tout.
- Enfourner 20 à 30 minutes, four préchauffé à 200/220 °C. Les tomates doivent être molles à cœur.
