id: fondue-bacchus
titre: Fondue Bacchus
portions: 4
temps:
  preparation: 34
  cuisson: 15
  repos: 0
ingredients:
- 6 dl de vin blanc
- 2 dl de vin rouge
- 2 dl de bouillon de légumes
- 2 gros oignons rouges
- persil ou persil plat
- clous de girofles
- poivre (blanc, noir, rose et vert)
- ail en poudre
etapes:
- Couper les oignons en quartier et y planter les clous de girofle.
- Couper grossièrement le persil.
- Mettre le vin blanc, le bouillon et le vin rouge dans le caquelon.
- Ajouter les quartiers d'oignons, le persil, une vingtaine de grains de poivre de toutes les couleurs et une pincée
  d'ail en poudre.
- Porter le tout à ébullition.
- Laisser mijoter à feu doux environ 15 min.
