id: tarte-au-riz
titre: Tarte au riz
portions: 4
temps:
  preparation: 31
  cuisson: 300
  repos: 0
ingredients:
- 2 l de lait
- 350 g de sucre
- une pincée de sel
- 300 g de riz (de qualité et non des préparations industrielles, ni le riz long grain)
- ½ gousse de vanille
- 1 bâton de cannelle
- 4 œufs
etapes:
- Précuire le lait avec la vanille, la cannelle, le sel et la moitié du sucre, dès la cuisson ajouter le riz. De
  préférence la cuisson se fait dans un bain-marie.
- Faire cuire le tout pendant environ une heure en remuant souvent sur feu doux.
- Avant la finition du riz ajoutez le restant du sucre.
- Laisser refroidir ce riz condé de préférence durant 24 heures.
- Ensuite mélangez les œufs dans le riz sans remuer trop fort.
- Mettez dans des moules à tarte (bord de 4 cm) une abaisse mince de pâte levée non sucrée (min. 20 % de beurre).
- La cuisson dure selon grandeur et épaisseur entre 20 et 28 minutes dans un four préchauffé à 240 à 250° (sans
  ventilation).
- Quand les tartes présentent leur « fleur » caractéristique, elles sont bonnes. À la sortie du four, démoulez-les
  sur claie ou sur une grille, sans les retourner.
- Après une ou deux heures, ce délice est prêt à consommer.
