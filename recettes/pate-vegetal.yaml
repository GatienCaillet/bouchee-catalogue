id: pate-vegetal
titre: Pâté végétal
portions: 4
temps:
  preparation: 37
  cuisson: 60
  repos: 0
ingredients:
- 250 g de graines de tournesol
- 125 g de farine de blé (ou de riz)
- texte: 125 g de levure
  ingredients:
  - levure
  categorie: true
- 1 oignon
- 3 cl de jus de citron
- 1 pomme de terre
- 12.5 cl d'huile végétale
- 37.5 cl d'eau
- sel, thym, basilic, sauge.
etapes:
- Mélanger les graines moulues, l'oignon émincé, la pomme de terre râpée et les autres ingrédients.
- Verser dans un plat Pyrex.
- Cuire 1 h. à 190°C.
- Quand la préparation est refroidie la démouler.
