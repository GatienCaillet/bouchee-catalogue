id: macarons-de-montmorillon
titre: Macarons de Montmorillon
portions: 4
temps:
  preparation: 22
  cuisson: 12
  repos: 0
ingredients:
- 40 g de sucre glace
- 40 g de sucre en poudre (la quantité peut être ajustée selon les goûts personnels)
- 60 g blancs d'œufs (2 blancs d'œufs)
- 100 g de poudre d'amande tamisée.
etapes:
- Mélanger le sucre glace et la poudre d'amande, passer à travers un tamis à poudre dans un autre bol et réserver
  pour une utilisation ultérieure.
- Ajouter lentement le sucre en poudre aux blancs d'œufs et battre avec un fouet électrique jusqu'à ce qu'il mousse,
  en faisant un glaçage à la meringue.
- Ajouter le mélange de sucre glace et de farine d'amande au glaçage meringué en deux portions, tout en remuant
  continuellement pour assurer un mélange homogène.
- Mettre le mélange final dans une poche à douille et pressez-la pour former une petite boule de pâte sur une plaque
  à pâtisserie recouverte de papier sulfurisé.
- Mettre la plaque de cuisson au four à 180°C pendant 12 minutes.
