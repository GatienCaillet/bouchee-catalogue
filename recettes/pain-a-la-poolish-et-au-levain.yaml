id: pain-a-la-poolish-et-au-levain
titre: Pain à la poolish et au levain
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- 5 g de levure sèche ou 10 g de levure de boulanger
- un verre d'eau
- 300 g de farine.
etapes:
- Délayer les quelques grammes de levure dans un verre d'eau.
- Dans un grand saladier mettre successivement la farine, le verre d'eau avec la levure.
- Compléter avec de l'eau tempérée (20 à 30 °C) de façon à obtenir 300 g d'eau.
- Bien mélanger le tout de façon à obtenir une pâte homogène.
- Laisser fermenter dans un endroit tempéré jusqu'à ce que la poolish ait à peu près doublé de volume. Cela peut
  prendre quelques heures, en fonction de la température et bien d'autres facteurs.
