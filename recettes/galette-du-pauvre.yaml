id: galette-du-pauvre
titre: Galette du pauvre
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- 1 kg de farine
- 1,5 l d'eau
- 30 g de sel
etapes:
- Verser la farine dans un grand saladier, par portions de 300 grammes environ. Parallèlement, verser l'eau et le
  sel. Mélanger jusqu'à obtenir une pâte homogène, liquide et sans grumeaux, de type pâte à crêpe.
