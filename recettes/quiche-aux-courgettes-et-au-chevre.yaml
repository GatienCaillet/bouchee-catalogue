id: quiche-aux-courgettes-et-au-chevre
titre: Quiche aux courgettes et au chèvre
portions: 4
temps:
  preparation: 20
  cuisson: 40
  repos: 0
ingredients:
- 1 pâte brisée
- 2 courgettes
- 150 g de fromage de chèvre
- 3 œufs
- 20 cl de crème fraîche
- 10 cl de lait
- 1 pincée de muscade
- sel, poivre
etapes:
- Préchauffer le four à 180 °C et garnir un moule à tarte de la pâte brisée.
- Couper les courgettes en rondelles et les faire revenir 8 minutes à la poêle ; couper le chèvre en rondelles.
- Battre les œufs avec la crème et le lait ; saler, poivrer et ajouter la muscade.
- Répartir la garniture sur la pâte et verser l'appareil par-dessus.
- Enfourner 35 à 40 minutes, jusqu'à ce que la quiche soit dorée et prise.
source:
  titre: Recette Bouchée
