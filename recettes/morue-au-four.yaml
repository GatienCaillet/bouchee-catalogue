id: morue-au-four
titre: Morue au four
portions: 4
temps:
  preparation: 22
  cuisson: 300
  repos: 0
ingredients:
- 500 g de morue
- 500 g de frites
- 500 g d'oignons
- 4 œufs
etapes:
- Dessaler la morue 48 heures avant de la consommer.
- Frire les pavés de morue et les oignons émincés
- Émietter la morue (enlever la peau et les arrêtes) dans un plat, mettre la morue, les frites, les oignons et les
  œufs battus
- Enfourner à 180°C 35 min
