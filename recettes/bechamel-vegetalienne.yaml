id: bechamel-vegetalienne
titre: Béchamel végétalienne
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- 2 verres de lait de soja ou de lait de riz.
- texte: 1 cuillère à soupe d'huile (mélange d'huiles pour la cuisson, de tournesol ou d'olive) ou de la margarine.
  ingredients:
  - huile
  - margarine
  categorie: true
- 2 cuillères à soupe de farine (de blé ou d'épeautre).
etapes:
- Faire chauffer l'huile ou la margarine dans une casserole.
- Verser la farine dès que l'huile est chaude.
- Rajouter le lait et remuer jusqu'à épaississement (feu doux).
- Saler et poivrer. Vous pouvez également rajouter une pincée de noix de muscade et du jus de citron.
