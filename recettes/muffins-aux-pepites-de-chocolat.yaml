id: muffins-aux-pepites-de-chocolat
titre: Muffins aux pépites de chocolat
portions: 4
temps:
  preparation: 15
  cuisson: 20
  repos: 0
ingredients:
- 250 g de farine
- 120 g de sucre
- 2 œufs
- 20 cl de lait
- 80 g de beurre
- 1 sachet de levure chimique
- 100 g de pépites de chocolat
etapes:
- Préchauffer le four à 180 °C et garnir un moule à muffins de caissettes.
- Mélanger les ingrédients secs d'un côté, les liquides de l'autre, réunir sans trop travailler la pâte et ajouter
  les pépites.
- Remplir les caissettes aux trois quarts.
- Enfourner 20 minutes.
- Laisser tiédir avant de démouler.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
