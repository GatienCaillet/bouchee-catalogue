id: riz-au-lait
titre: Riz au lait
portions: 4
temps:
  preparation: 22
  cuisson: 30
  repos: 0
ingredients:
- 150 g riz
- 500 ml lait
- 1 gousse de vanille
- eau
etapes:
- '* 150 g riz * 500 ml lait * 1 gousse de vanille * eau'
- Rincer abondamment le riz à l'eau tiède. Le mettre dans une casserole puis recouvrir d'eau chaude. Lorsque cette
  eau est absorbée, ajouter le lait après l'avoir fait bouillir avec la gousse de vanille. Porter à ébullition pendant
  30 minutes. Rajouter du sucre.
