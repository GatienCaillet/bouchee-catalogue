id: houmous-rose-a-la-betterave
titre: Houmous rose à la betterave
portions: 4
temps:
  preparation: 15
  cuisson: 30
  repos: 0
ingredients:
- 1 boîte de pois chiches (400 g)
- 1 betterave cuite
- 2 c. à soupe de tahini
- 1 citron
- 2 c. à soupe d'huile d'olive
- sel
etapes:
- Mixer tous les ingrédients jusqu'à obtenir une crème lisse.
decouverte:
  aliment: betterave
  niveau: 1
  pourquoi: Une petite betterave colore le houmous en rose ; le pois chiche et le citron dominent.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
  licence: CC BY-SA 4.0 (Bouchée)
  modifications: 'Recette rédigée pour Bouchée (base « parcours de découverte »), pas encore testée en cuisine :
    quantités et temps à confirmer.'
