id: bortsch-a-la-creme
titre: Bortsch à la crème
portions: 4
temps:
  preparation: 40
  cuisson: 150
  repos: 0
ingredients:
- 2,5 l d'eau
- 300 g de céleri branche
- 2 poireaux
- 300 g de chou rouge
- 200 g de champignons de couche
- 1 kg de macreuse de bœuf
- 500 g de betterave cuite
- 15 cl de crème fraîche
- 1/2 citron
- persil, sel, poivre.
etapes:
- Parer et émincer le céleri, laver et émincer les poireaux, le chou et les champignons, couper la viande en cubes.
- Verser l'eau dans une marmite. Mettre la viande et les légumes préparés, saler et poivrer. Porter à ébullition,
  écumer et baisser le feu.
- Couvrir et cuire 2 h .
- Peler la betterave et la couper en petits dés. La mettre dans la marmite 30 min avant la fin de la cuisson.
- Fouetter ensemble la crème et le jus de citron.
- Verser le bortsch dans une soupière, ajoutez 20 g de persil haché et remuer.
- Présenter la crème aigre bien froide en même temps.
