id: anchois-a-la-catalane
titre: Anchois à la catalane
portions: 4
temps:
  preparation: 25
  cuisson: 0
  repos: 0
ingredients:
- 12 anchois
- 4 œufs
- 2 cuillères à soupe d'huile d'olive
- texte: 1 cuillère à soupe de vinaigre
  ingredients:
  - vinaigre
  categorie: true
- quelques olives, poivre
etapes:
- Parer les anchois et lever les filets.
- Faire durcir les œufs (les plonger dix minute dans l'eau bouillante) les écaler, les couper en deux, séparer les
  blancs et les jaunes et les concasser séparément.
