id: bouillon-de-legumes
titre: Bouillon de légumes
portions: 4
temps:
  preparation: 37
  cuisson: 0
  repos: 0
ingredients:
- 50 g de margarine
- 2 oignons hachés
- 6 carottes hachées
- texte: 4 branches de céleri hachées
  ingredients:
  - celeri
  categorie: true
- 2 gousses d'ail écrasées
- 500 g de tomates hachées
- 2 cuillères à soupe de persil
- 10 grains de poivre, 1 cuillère à thé de thym, 2 feuilles de laurier
- 3L d'eau
etapes:
- Faire revenir les légumes (sauf les tomates) dans la margarine. Ajouter les tomates, les assaisonnements et l'eau.
  Laisser mijoter jusqu'à ce qu'il y ai réduction de moitié du liquide.
- Filtrer
