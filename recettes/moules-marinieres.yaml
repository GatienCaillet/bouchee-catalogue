id: moules-marinieres
titre: Moules marinières
portions: 4
temps:
  preparation: 15
  cuisson: 10
ingredients:
- 3 l de moules
- 3 échalotes
- 50 cl d'eau
etapes:
- Laver soigneusement les moules.
- Émincer les échalotes et les mettre dans une grande casserole avec les moules et l'eau.
- Porter à ébullition, puis cuire à feu doux.
- Retirer du feu dès que toutes les moules sont ouvertes, en moins de 10 minutes, et servir aussitôt.
