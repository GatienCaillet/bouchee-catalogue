id: tarte-au-comte
titre: Tarte au comté
portions: 4
temps:
  preparation: 34
  cuisson: 45
  repos: 0
ingredients:
- 3 œufs
- 100 g de lardons
- 1 pâte brisée
- 1 sauce béchamel
- 300 g de comté râpé
- 4 grosses pommes de terre
- 3 grosses cuillère à soupe de crème fraîche
- huile d'olive, sel, poivre, muscade
etapes:
- Préparer une pâte brisée et une sauce béchamel
- Ajouter à la sauce béchamel le comté râpé, la crème et les œufs.
- Saler, poivrer et ajouter une pincée de muscade.
- Étaler la pâte au rouleau, la piquer avec une fourchette, répartir les pommes de terre coupées en fines rondelles,
  les lardons revenu à la poêle, puis verser la préparation dessus.
- Cuire à four chaud 45 min à 240°C Thermostat 8.
