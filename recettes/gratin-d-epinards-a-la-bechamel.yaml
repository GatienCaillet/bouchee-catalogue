id: gratin-d-epinards-a-la-bechamel
titre: Gratin d'épinards à la béchamel
portions: 4
temps:
  preparation: 20
  cuisson: 35
  repos: 0
ingredients:
- 600 g d'épinards
- 40 g de beurre
- 40 g de farine
- 50 cl de lait
- 1 pincée de muscade
- 80 g d'emmental râpé
- sel, poivre
etapes:
- Laver les épinards et retirer les tiges dures.
- Cuire les épinards 10 minutes à l'eau bouillante salée, puis bien égoutter.
- 'Préparer la béchamel : faire fondre le beurre, ajouter la farine, puis verser le lait petit à petit en fouettant
  jusqu''à épaississement. Saler, poivrer, ajouter la muscade.'
- Disposer les épinards dans un plat à gratin beurré, napper de béchamel et parsemer d'emmental.
- Enfourner 25 minutes à 200 °C, jusqu'à ce que le dessus soit doré.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
