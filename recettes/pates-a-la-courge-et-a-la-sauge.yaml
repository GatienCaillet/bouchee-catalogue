id: pates-a-la-courge-et-a-la-sauge
titre: Pâtes à la courge et à la sauge
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de penne
- 500 g de courge butternut
- 40 g de beurre
- 6 feuilles de sauge
- 50 g de parmesan râpé
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Cuire la courge en dés à la vapeur 12 minutes, puis la faire revenir au beurre avec la sauge.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
