id: tomates-confites-aux-gambas
titre: Tomates confites aux gambas
portions: 4
temps:
  preparation: 31
  cuisson: 180
  repos: 0
ingredients:
- 8 tomates
- huile d'olive
- sucre glace
- 16 gambas
- poivre noir
- cerfeuil
- 1 baguette
etapes:
- Monder 8 tomates "olivettes", les couper en quatre, retirer les pépins.
- Les confire dans un plat, arrosées d'huile d'olive, salées, saupoudrées d'un peu de sucre glace, durant trois
  heures dans un four à 90 degrés.
- Les retourner à mi-cuisson, les arroser de temps en temps.
- Décortiquer 16 gambas, jeter la tête, incisez-les pour retirer le filament noir. Les saler et les poêler dans
  un peu d'huile d'olive.
- Sur une tranche de baguette (large), déposer deux quartiers de tomate, une gamba, un peu de poivre noir, un brin
  de cerfeuil.
