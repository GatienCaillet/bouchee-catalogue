id: gaspacho-andalou
titre: Gaspacho andalou
portions: 4
temps:
  preparation: 40
  cuisson: 0
  repos: 60
ingredients:
- 6 tomates
- 2 concombres
- 1 poivron vert
- 1 poivron rouge
- 1 oignon
- 2 gousses d'ail
- 6 tranches de pain
- 4 cuillères à soupe d'huile d'olive
- texte: 2 cuillères à soupe de vinaigre
  ingredients:
  - vinaigre
  categorie: true
- sel, poivre.
etapes:
- Laver, éplucher et couper les légumes et le pain en petits morceaux.
- Dans un récipient, réserver pour la garniture la valeur d'un tiers de concombre, le tiers de chaque poivron, et
  une tomate.
- Mixer tous les ingrédients afin d'obtenir une purée.
- Ajouter de l'eau et mettre au réfrigérateur pendant une heure.
- Couper en très petits dés les ingrédients réservés et les présenter séparément en saucières ou petits bols pour
  agrémenter le gaspacho.
