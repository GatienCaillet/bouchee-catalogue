id: epinards-a-la-creme-au-micro-ondes
titre: Épinards à la crème au micro-ondes
portions: 4
temps:
  preparation: 25
  cuisson: 9
  repos: 0
ingredients:
- 500 g d'épinards surgelés
- 10 cl de lait
- une cuillère à café de farine
- texte: 10 cl de crème
  ingredients:
  - creme
  categorie: true
- sel.
etapes:
- Placer les épinards surgelés dans une assiette creuse ou un plat allant au micro-ondes.
- Ajouter le lait.
- Assaisonner.
- Faire cuire au micro-ondes 3 minutes environ.
- Ajouter la farine et mélanger.
- Faire cuire au micro-ondes 3 minutes environ.
- Ajouter la crème fraîche.
- Faire cuire au micro-ondes 3 minutes environ.
- Mélanger et servir.
