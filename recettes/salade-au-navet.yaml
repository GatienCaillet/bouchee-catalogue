id: salade-au-navet
titre: Salade au navet
portions: 4
temps:
  preparation: 25
  cuisson: 0
  repos: 0
ingredients:
- 2 navet
- 2 pommes
- 1 citron
- 20 g de graines de courge
- texte: 15 cl d'huile de tournesol, vinaigre, sel.
  ingredients:
  - huile_de_tournesol
  - vinaigre
  - sel
  categorie: true
etapes:
- Nettoyer les navets et les pommes, les éplucher et les râper
- Disposer navet et les pommes dans les assiettes, arroser d'huile de tournesol, d'un filet de vinaigre
- Saler, parsemer de graines de courges grillées à sec concassées.
