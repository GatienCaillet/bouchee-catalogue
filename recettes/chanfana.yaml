id: chanfana
titre: Chanfana
portions: 6
temps:
  preparation: 28
  cuisson: 120
  repos: 1560
ingredients:
- 1 kg de viande de mouton ou agneau (gigot...)
- texte: du vin rouge pour couvrir la viande
  ingredients:
  - vin
  categorie: true
- 4 gousses d'ail
- 5 feuilles de laurier
- 10 cl d'huile d'olive
- sel, poivre
etapes:
- La veille, couper la viande en morceau. La disposer dans un plat creux, et la couvrir de vin rouge. Ajouter les
  gousses d'ail écrasées, le laurier et l'huile d'olive. Saler et poivrer. Laisser mariner pendant 24 H. Le lendemain,
  passer la marinade. Disposer la viande et les aromates dans un plat allant au four. Porter le vin rouge à ébullition.
  Le verser sur la viande et les aromates. Cuire au four (th 7/8) pendant 2 heures. Rectifier l'assaisonnement.
  Servir avec des pommes de terres cuites à la vapeur et des légumes de saison.
- 'Cuisson : Th. 7/8 - 2 h'
- 'Traditionnellement, la Chanfana est un plat à base de viande de chèvre (cabra). Elle est quelquefois remplacée
  par du mouton, mais jamais de l''agneau ni du chevreau. Vous trouverez diverses recettes sur le sîte (en portugais)
  : http://www.gastronomias.com'
- '(Chanfana à Moda de Coimbra : http://www.gastronomias.com/receitas/rec1076.htm)'
- Catégorie:Cuisine portugaise
