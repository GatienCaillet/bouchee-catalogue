id: salade-de-riz
titre: Salade de riz
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 350 g de riz
- 200 g de thon
- 3 tomates
- 100 g de maïs
- 4 œufs durs
- mayonnaise
etapes:
- Faire cuire le riz puis l'égoutter et le laisser refroidir.
- Couper les œufs durs et les tomates en quartier.
- Mélanger tous les ingrédients dans un saladier.
