id: claclo
titre: Claclo
portions: 8
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 6 bananes plantain moyennes
- 1 pot de farine tamisée (mesurer avec un pot de yaourt)
- Du sel
- 1 cuillère à soupe d'oignon découpé
- Du piment en poudre (facultatif)
- texte: De l'huile
  ingredients:
  - huile
  categorie: true
etapes:
- Enlevez la peau des bananes.
- Écrasez-les dans un mortier, un talier ou dans un mixer.
- Ajoutez un peu de sel, de piment en poudre, l'oignon découpé et mélangez bien le tout.
- Chauffez l'huile dans une poêle et avec la pâte obtenue, formez des noix avec vos doigts ou à l'aide d'une cuillère
  à soupe et laissez dorer de chaque côté.
- Aidez-vous d'une fourchette pour ne pas que les noix se collent et pour les retirer facilement de l'huile avec
  une écumoire. (pressez le claclo entre la fourchette et l'écumoire pour retirer le surplus d'huile).
- Mettez du papier absorbant dans votre passoire pour ne pas que votre claclo soit plein d'huile et régalez-vous!
