id: pizza-campagnarde
titre: Pizza campagnarde
portions: 4
temps:
  preparation: 25
  cuisson: 20
  repos: 0
ingredients:
- 1 pâte à pizza
- 400 g de concassé de tomates
- texte: 200 g de champignons
  ingredients:
  - champignon
  categorie: true
- texte: 2 tranches de jambon
  ingredients:
  - jambon
  categorie: true
- 100 g de comté
etapes:
- Laver et éplucher les champignons. Les couper dans le sens de la longueur. Les faire revenir 10 min dans une casserole
  pour leur faire perdre leur eau.
- Couper le jambon en carré et râper le comté.
- Dans un plat fariné, étaler la pâte. La recouvrir de concassé de tomates, de jambon, champignons ainsi que de
  comté.
- Cuire au four à 210°C 10 à 15 min.
