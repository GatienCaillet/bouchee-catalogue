id: gratin-de-courgettes-et-feta
titre: Gratin de courgettes et féta
portions: 4
temps:
  preparation: 19
  cuisson: 25
  repos: 0
ingredients:
- 500 g de courgettes
- 150 g de fêta
- 5 cl d'huile d'olive
etapes:
- Laver et éplucher les courgettes
- Cuire 15 min à l'huile à feu doux
- En disposer la moitié dans un plat allant au four, les recouvrir de fêta. Disposer une nouvelle couche de courgettes
  et terminer par une dernière couche de fêta.
- Gratiner 10 min à 170 °C
