id: pate-a-gateau-vegetalienne
titre: Pâte à gâteau végétalienne
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 250 g de farine
- 180 g de sucre
- 1 sachet de levure pour pâtisserie
- 135 ml d'huile de tournesol
- texte: 3 cuillères à soupe de vinaigre
  ingredients:
  - vinaigre
  categorie: true
- de l'eau froide
etapes:
- Mélangez bien dans un saladier, la farine, le sucre en poudre et le sachet de levure.
- Ajoutez l'huile, le vinaigre et mouillez d'eau jusqu'à obtention d'une pâte homogène.
