id: petits-pois-a-la-francaise
titre: Petits pois à la française
portions: 4
temps:
  preparation: 15
  cuisson: 30
  repos: 0
ingredients:
- 600 g de petits pois
- 1 laitue
- 6 oignons nouveaux
- 30 g de beurre
- 1 c. à café de sucre
- sel
etapes:
- Faire fondre les oignons au beurre, ajouter les petits pois, la laitue émincée, le sucre et 10 cl d'eau.
- Couvrir et cuire 20 minutes à feu doux.
decouverte:
  aliment: petit_pois
  niveau: 3
  pourquoi: Cuits doucement avec la laitue et un peu de sucre, ils sont tendres et sucrés.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
