id: salade-de-riz-aux-crevettes-et-a-l-ananas
titre: Salade de riz aux crevettes et à l'ananas
portions: 4
temps:
  preparation: 20
  cuisson: 20
  repos: 15
ingredients:
- 250 g de riz
- 250 g de crevettes cuites
- 200 g d'ananas
- 1 poivron rouge
- 4 c. à soupe d'huile d'olive
- 2 c. à soupe de vinaigre de vin
- sel, poivre
etapes:
- Cuire le riz et le laisser refroidir ; couper l'ananas et le poivron en dés.
- Préparer la vinaigrette en mélangeant l'huile, l'acidité, le sel et le poivre.
- Réunir tous les ingrédients dans un saladier, arroser de vinaigrette et mélanger délicatement.
- Laisser reposer 15 minutes au frais avant de servir.
source:
