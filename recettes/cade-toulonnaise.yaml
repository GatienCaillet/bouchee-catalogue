id: cade-toulonnaise
titre: Cade toulonnaise
portions: 4
temps:
  preparation: 22
  cuisson: 10
  repos: 0
ingredients:
- 250 g de farine de pois chiches
- 50 cl d'eau
- 2 cuillères à soupe d'huile d'olive
- sel, poivre
etapes:
- Mélanger tous les ingrédients au fouet. Étaler le mélange sur une plaque de cuisson graissée sur une épaisseur
  d'environ 1 cm. Préchauffer le four à 240°C. Cuire 10 min, puis mettre en position grill et attendre que la surface
  soit bien dorée. Percer les bulles qui se forment à la surface. Dès que la cade dore, la sortir du four avant
  qu'elle ne durcisse. La cade toulonnaise se déguste chaude, salée et poivrée.
