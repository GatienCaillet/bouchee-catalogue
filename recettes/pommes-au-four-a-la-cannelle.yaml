id: pommes-au-four-a-la-cannelle
titre: Pommes au four à la cannelle
portions: 4
temps:
  preparation: 15
  cuisson: 35
  repos: 0
ingredients:
- 4 pommes
- 40 g de beurre
- 4 c. à soupe de sucre roux
- 1 c. à café de cannelle
etapes:
- Préchauffer le four à 180 °C.
- Évider les pommes sans les percer jusqu'au fond.
- Les garnir de beurre, de sucre et de cannelle.
- Cuire 35 minutes en arrosant avec le jus.
