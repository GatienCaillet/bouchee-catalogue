id: fritade-de-courgettes
titre: Fritade de courgettes
portions: 4
temps:
  preparation: 25
  cuisson: 35
  repos: 0
ingredients:
- 200 g de courgettes
- 2 à 3 œufs
- 1 Oignon
- Sel, poivre
- Huile d'olive
etapes:
- Cuire les courgettes coupées en rondelles 20min à l'eau salée
- Couper l'oignon en quatre puis en tranches. Le faire revenir dans une grande quantité d'huile d'olive, cuire jusqu'à
  caramélisation
- Egoutter les courgettes, les verser dans les oignons, ajouter de l'huile.
- Mélanger, cuire à feu vif pendant 15 min en remuant régulièrement
- Mettre les œufs dans un saladier avec sel et poivre, les battre en omelette
- Verser la préparation sur les courgettes,mélanger
- Dès que le dessous a pris, retourner la fritade pour cuire l'autre côté. Une fois que l'autre côté a pris, terminer
  de cuire une ou deux minutes à feu doux.
