id: anchois-aux-pommes-reinettes
titre: Anchois aux pommes reinettes
portions: 6
temps:
  preparation: 22
  cuisson: 20
  repos: 0
ingredients:
- 5 belles pommes reinettes
- 15 filets d'anchois
- 50 g de beurre
- 1 citron
etapes:
- Laver et faire dessaler les anchois en les faisant tremper quinze minutes dans l'eau froide, les essuyer et retirer
  l'arête centrale.
- Éplucher les pommes, les couper en quartiers et les débiter en lamelles un peu épaisses.
- Faire chauffer le beurre dans une grande poêle ; quand il est à point y verser les pommes, les arroser avec le
  jus de citron
- Quand les pommes sont dorées, ajouter les filets d'anchois coupés en morceaux, laisser durant quelques minutes
  les pommes et les anchois s'imprégner mutuellement.
