id: cabillaud-en-croute-de-parmesan
titre: Cabillaud en croûte de parmesan
portions: 4
temps:
  preparation: 28
  cuisson: 10
  repos: 0
ingredients:
- 4 pavés de cabillaud
- 2 œufs
- 200 g de parmesan râpé
- 100 g de beurre
- 100 g de chapelure
- farine blanche, sel, poivre.
etapes:
- Préchauffez le four position gril.
- Farinez les pavés de cabillaud.
- Fouettez les œufs dans une assiette creuse. Mélangez 60 g de parmesan et la chapelure dans une autre assiette
  creuse.
- Passez les pavés de cabillaud d'abord dans l'œuf battu puis dans la chapelure au parmesan.
- Faites fondre 50 g de beurre dans une sauteuse. Faites-y dorer les pavés de cabillaud 5 min de chaque côté. Puis
  posez-les sur la plaque du four recouverte de papier aluminium.
- Mélangez le beurre restant avec le parmesan restant et étalez ce mélange sur les pavés de cabillaud, salez et
  poivrez.
- Enfournez et faites gratiner 5 min environ.
- Servez dès la sortie du four avec une jardinière de légumes.
