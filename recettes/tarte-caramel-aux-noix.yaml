id: tarte-caramel-aux-noix
titre: Tarte caramel aux noix
portions: 4
temps:
  preparation: 28
  cuisson: 45
  repos: 0
ingredients:
- 1 rouleau de pâte sablée
- 150 g de cerneaux de noix hâchés grossièrement
- 125 g de sucre en poudre
- 30 g beurre ramolli en morceaux
- 1 cuiller à soupe de crème épaisse
- 1 cuiller à soupe de miel
etapes:
- Faites préchauffer le four à 180°C (thermostat 6) pendant 20 minutes, puis beurrez le moule à tarte et disposez-y
  la pâte sablée, avant de mettre le moule au four durant 10 minutes.
- Dans une casserole, mélangez, le sucre, le miel et la crème épaisse, et faites chauffer à feu doux, pendant 10
  à 15 minutes le mélange, tout en remuant avec une spatule en bois, jusqu'à ce que le mélange soit caramélisé.
- Ajoutez le beurre en morceaux et les cerneaux de noix hâchés, puis ôtez la préparation du feu et laissez tiédir.
- Versez la préparation sur la pâte sablée pré-cuite et remettez la tarte au four durant 5 minutes, avant de la
  retirer et de la laisser refroidir.
