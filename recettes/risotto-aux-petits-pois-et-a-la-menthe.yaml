id: risotto-aux-petits-pois-et-a-la-menthe
titre: Risotto aux petits pois et à la menthe
portions: 4
temps:
  preparation: 10
  cuisson: 25
  repos: 0
ingredients:
- 300 g de riz arborio
- 1 oignon
- 2 c. à soupe d'huile d'olive
- 10 cl de vin blanc sec
- 1 l de bouillon de légumes
- 300 g de petits pois
- quelques feuilles de menthe
- 50 g de parmesan râpé
- 30 g de beurre
- sel, poivre
etapes:
- Faire chauffer le bouillon et le garder frémissant.
- Émincer l'oignon et le faire revenir dans l'huile d'olive. Ajouter le riz et le nacrer 2 minutes en remuant.
- Verser le vin blanc et laisser évaporer.
- Ajouter les petits pois 8 minutes avant la fin et la menthe ciselée au moment de servir.
- Ajouter le bouillon louche par louche, en remuant, chaque louche étant absorbée avant la suivante (environ 18
  minutes).
- Hors du feu, ajouter le beurre et le parmesan, mélanger, saler, poivrer et servir aussitôt.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
