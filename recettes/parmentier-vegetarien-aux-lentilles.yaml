id: parmentier-vegetarien-aux-lentilles
titre: Parmentier végétarien aux lentilles
portions: 4
temps:
  preparation: 15
  cuisson: 45
  repos: 0
ingredients:
- 250 g de lentilles vertes
- 1 kg de pommes de terre
- 2 carottes
- 1 oignon
- 20 cl de lait
- 30 g de beurre
- 50 g de comté râpé
- sel, poivre
etapes:
- Cuire les lentilles 25 minutes avec les carottes en dés et l'oignon.
- Cuire les pommes de terre et les écraser avec le lait et le beurre.
- Monter le parmentier, couvrir de comté et gratiner 20 minutes à 200 °C.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
