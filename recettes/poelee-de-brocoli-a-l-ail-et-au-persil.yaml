id: poelee-de-brocoli-a-l-ail-et-au-persil
titre: Poêlée de brocoli à l'ail et au persil
portions: 4
temps:
  preparation: 10
  cuisson: 15
  repos: 0
ingredients:
- 600 g de brocoli
- 2 c. à soupe d'huile d'olive
- 2 gousses d'ail
- 1/2 botte de persil
- sel, poivre
etapes:
- Détacher le brocoli en petits bouquets et les laver.
- Faire chauffer l'huile dans une grande poêle et y faire sauter le brocoli 10 à 15 minutes à feu vif, en remuant
  souvent.
- Hacher l'ail et le persil.
- Ajouter l'ail et le persil en fin de cuisson, saler, poivrer et cuire encore 2 minutes.
decouverte:
  aliment: brocoli
  niveau: 4
  pourquoi: 'En accompagnement, le brocoli est servi à part : on peut le goûter à son rythme.'
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
