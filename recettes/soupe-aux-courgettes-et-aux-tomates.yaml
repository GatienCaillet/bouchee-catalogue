id: soupe-aux-courgettes-et-aux-tomates
titre: Soupe aux courgettes et aux tomates
portions: 4
temps:
  preparation: 28
  cuisson: 30
  repos: 0
ingredients:
- 1 grosse courgette en dés
- 3 tomates en dés
- 1 oignon haché
- 1 gousse d'ail hachée
- Bouillon de légumes
- thym, sel, poivre, huile d'arachide.
etapes:
- Faire rissoler l'oignon dans l'huile. Ajouter la courgette et les tomates en dés. Verser le bouillon de légumes
  et l'ail écrasé. Assaisonner abondamment. Porter à ébullition dans l'autocuiseur puis laisser cuire à feu doux
  30 min.
