id: galette-au-beurre-et-au-sucre
titre: Galette au beurre et au sucre
portions: 4
temps:
  preparation: 25
  cuisson: 52
  repos: 0
ingredients:
- farine
- sucre
- beurre
- 3 œufs
- sel
etapes:
- Verser la farine tamisée, avec 1 pincée de sel, en tas sur une planche à pâtisserie ou le plan de travail. Faire
  une fontaine au milieu et casser 2 œufs, les ajouter ainsi que le sucre en poudre. Mélanger le sucre avec les
  œufs en incorporant progressivement de la farine.
- Couper en morceaux le beurre et ajouter dans la fontaine. Continuer à mélanger les éléments solides et liquides,
  puis travailler la pâte en la pétrissant de 2 à 3 minutes jusqu'à consistance homogène.
- Ramasser la pâte en boule, l'étaler avec les mains dans un moule à tarte beurré de 22 ou 24cm de diamètre. Lisser
  le dessus et le rayer avec les dents d'une fourchette.
- Casser le dernier œuf et en badigeonner la galette en se servant d'un pinceau à pâtisserie pour dorer également
  les bords. Faire cuire la galette dans le four à 200°C pendant 50 minutes environ. Laisser refroidir complètement
  avant de servir.
