id: bananes-et-patates-douces-en-feuilles-de-bananier
titre: Bananes et patates douces en feuilles de bananier
portions: 6
temps:
  preparation: 28
  cuisson: 65
  repos: 0
ingredients:
- 500 g de patates douces
- 5 bananes à cuire
- 20 cl de lait de noix de coco
- 180 g de sucre roux de canne
- 1 gousse de vanille
- 5 cl de jus d'ananas.
etapes:
- Mettez à chauffer les patates douces dans une casserole d'eau froide et laissez les cuire pendant 30 minutes comptées
  à partir du début de l'ébullition.
- Lavez les bananes avec leur peau et faites les cuire 15 minutes directement dans l'eau bouillante.
- Épluchez les bananes bouillies et les patates douces, et récupérez leur pulpe dans un saladier, écrasez-la à la
  fourchette et incorporez-y le sucre de canne, la moitié du lait de noix de coco, le jus d'ananas et l'intérieur
  de la gousse de vanille.
- Assouplissez les feuilles de bananier en les passant rapidement au-dessus d'une flamme, et coupez-les en rectangles
  d'au moins 12 sur 10 cm.
- Déposez une cuiller de la préparation au centre de chaque feuille découpée et refermez en maintenant les extrémités
  à l'aide des piques.
- Mettez les feuilles préparées au four à 170°c (thermostat 6-7) et laissez les cuire pendant 20 minutes.
- Servez-les avec le lait de noix de coco restant bien frais et accompagnées avec des rondelles de bananes caramélisées.
