id: veloute-d-artichauts-au-cumin
titre: Velouté d'artichauts au cumin
portions: 4
temps:
  preparation: 15
  cuisson: 30
  repos: 0
ingredients:
- 400 g de cœurs d'artichaut
- 1 oignon
- 2 c. à soupe d'huile d'olive
- 1 l de bouillon de légumes
- 1 c. à café de cumin en poudre
- 4 c. à soupe de yaourt nature
- sel, poivre
etapes:
- Égoutter les cœurs d'artichaut et les couper en quartiers.
- Émincer l'oignon et le faire revenir 3 minutes dans l'huile d'olive, dans une grande casserole.
- Ajouter les cœurs d'artichaut, mélanger, puis verser le bouillon.
- Porter à ébullition et laisser cuire 20 à 25 minutes à feu moyen, jusqu'à ce que les légumes soient tendres.
- Mixer finement avec le cumin, rectifier l'assaisonnement et servir avec une cuillerée de yaourt.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
