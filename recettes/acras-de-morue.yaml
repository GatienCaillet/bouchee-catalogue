id: acras-de-morue
titre: Acras de morue
portions: 4
temps:
  preparation: 37
  cuisson: 10
  repos: 30
ingredients:
- 200 g de morue salée
- 200 g de farine
- 2 œufs
- 2 oignons
- 2 cives (ou échalotes)
- 4 gousses d'ail cultivé
- 1 piment
- 150 ml d'eau.
- Persil.
etapes:
- Placer la morue dans une casserole d'eau froide ajouter éventuellement du thym, des feuilles de laurier et le
  jus d'un citron.
- Porter à ébullition puis laisser frémir pendant 10 minutes.
- Égoutter, laisser refroidir. Retirer toutes les arêtes et la peau en émiettant la morue.
- Hacher finement les oignons et les cives.
- Dans un saladier, mélanger le hachis d'oignons et de cives, l'ail, les œufs, la farine, l'eau et la levure. Émietter
  la morue et mélanger avec le reste des ingrédients. Ajouter le piment en fonction de votre goût.
- Pour obtenir une pâte plus onctueuse, vous pouvez mixer.
- Laisser reposer au moins 30 minutes.
- Faire chauffer de l'huile dans une poêle. Verser avec une petite cuillère la pâte sous forme de petits beignets.
  Laisser dorer sur les deux faces.
- Servir chaud.
