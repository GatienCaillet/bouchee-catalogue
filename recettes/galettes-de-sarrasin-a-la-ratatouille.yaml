id: galettes-de-sarrasin-a-la-ratatouille
titre: Galettes de sarrasin à la ratatouille
portions: 4
temps:
  preparation: 15
  cuisson: 35
  repos: 60
ingredients:
- 250 g de farine de sarrasin
- 1 œuf
- 50 cl d'eau
- 1 courgette
- 1 aubergine
- 1 poivron
- 2 tomates
- 3 c. à soupe d'huile d'olive
- sel
etapes:
- Préparer la pâte et la laisser reposer 1 heure.
- Cuire les légumes en petits dés 25 minutes dans l'huile.
- Cuire les galettes et les garnir de légumes.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
