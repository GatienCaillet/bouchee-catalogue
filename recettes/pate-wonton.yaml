id: pate-wonton
titre: Pâte wonton
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 90
ingredients:
- 250 g de farine
- 1 œuf
- 1 cuillère à café de sel
- 80 à 120 ml d'eau
etapes:
- Tamiser la farine et le sel, y creuser un puits.
- Battre l'œuf légèrement et verser dans le puits. Mélanger.
- Ajouter un peau d'eau froide, mouiller vos mains et pétrir jusqu'à obtenir une pâte lisse.
- Laisser la pâte reposer au réfrigérateur dans un récipient couvert pendant 30 minutes à une heure.
- Fariner le plan de travail et abaisser la pâte uniformément jusqu'à ce qu'elle devienne très fine. La pâte devrait
  être en partie transparente.
- Couper la pâte en bandes de 5 à 8 cm de large, fariner légèrement et empiler-les les uns sur les autres. Découper
  en carrés.
- Recouvrir les morceaux de pâte d'un torchon humide.
