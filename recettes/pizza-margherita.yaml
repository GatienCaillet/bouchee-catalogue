id: pizza-margherita
titre: Pizza Margherita
portions: 2
temps:
  preparation: 30
  cuisson: 10
  repos: 75
ingredients:
- 200 ml d'eau
- 350 g de farine
- 25 g de levure fraîche
- 2 c. à soupe d'huile d'olive
- 2 c. à café de sel
- texte: 2 c. à café de sucre (facultatif)
  facultatif: true
- 200 ml de sauce tomate
- 1 boule de mozzarella
- quelques feuilles de basilic
etapes:
- Mélanger la farine avec la levure émiettée, le sel et le sucre.
- Creuser un puits, y verser l'eau et l'huile, puis mélanger jusqu'à obtenir une pâte.
- Pétrir environ 15 minutes, puis laisser lever au moins une heure.
- Pétrir de nouveau et laisser reposer encore 15 minutes.
- Étaler la pâte sur 3 mm d'épaisseur, la couvrir de sauce tomate, de tranches de mozzarella et de basilic.
- Cuire 10 minutes en haut du four préchauffé à 250 °C.
