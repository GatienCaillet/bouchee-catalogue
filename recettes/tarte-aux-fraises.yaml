id: tarte-aux-fraises
titre: Tarte aux fraises
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- pâte brisée
- crème pâtissière (avec 2.5 dl de lait, 1 œuf, 30 g de farine, 50 g de sucre environ)
- 500 g de fraises
etapes:
- Foncer la pâte sablée sur un moule à tarte d'environ 28 cm et la cuire à blanc
- Préparer la crème pâtissière et la couler sur le fond de tarte cuit
- Laver les fraises, les couper en deux et les répartir sur la crème pâtissière
- Laisser refroidir avant de servir.
