id: polenta-savoyarde
titre: Polenta savoyarde
portions: 4
temps:
  preparation: 34
  cuisson: 30
  repos: 0
ingredients:
- 300 g de semoule de maïs
- 150 g de beaufort
- 100 g de lardons
- texte: 1 l de bouillon
  ingredients:
  - bouillon
  categorie: true
- 1/2 l de lait
- 30 g de beurre
- 3 échalotes
- sel, poivre
etapes:
- Chauffer le bouillon.
- Faire revenir la semoule, les échalotes et les lardons dans le beurre.
- Ajouter le beaufort coupé en lamelles, le lait et le bouillon. Cuire à feu doux 30 min en remuant constamment.
