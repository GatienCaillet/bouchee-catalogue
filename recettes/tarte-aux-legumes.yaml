id: tarte-aux-legumes
titre: Tarte aux légumes
portions: 4
temps:
  preparation: 34
  cuisson: 0
  repos: 0
ingredients:
- 1 ou 2 aubergines
- 1 ou 2 oignons
- 4 tomates
- texte: 150 g de champignons
  ingredients:
  - champignon
  categorie: true
- du fromage râpé
- du lait
- un jaune d'œuf
- éventuellement de la crème fraîche
etapes:
- Versez la farine dans un saladier. Ajoutez le beurre en morceaux. Malaxez le tout jusqu'à obtenir une pâte à peu
  près homogène. Incorporez l'œuf, puis ajoutez l'eau petit à petit en travaillant bien la pâte avec les mains,
  jusqu'à ce qu'elle devienne souple et lisse. Elle ne doit pas coller, et doit avoir une couleur assez jaune et
  être brillante.
