id: creme-de-coco-au-chocolat
titre: Crème de coco au chocolat
portions: 4
temps:
  preparation: 31
  cuisson: 0
  repos: 0
ingredients:
- 200 ml de lait de coco
- 40 g de sucre glace
- 3 c. à s. de maïzena
- 100 ml de lait de soja
- 150 g de chocolat noir en copeaux
- poudre de coco séchée
- quelques noisettes
etapes:
- Dans une jatte, fouetter du lait de coco, la maïzena et le sucre glace. Chauffer le reste du lait de coco et le
  lait de soja et y ajouter la préparation. Chauffer en tournant constamment jusqu'à épaississement. Couper le feu.
- Dans des coupes, déposer une couche de copeaux de chocolat. Verser par-dessus la crème de coco et laisser prendre.
  Ajouter encore une couche de copeaux et garnir le dessus de coco râpée séchée et de quelques noisettes.
