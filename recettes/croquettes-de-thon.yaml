id: croquettes-de-thon
titre: Croquettes de thon
portions: 4
temps:
  preparation: 20
  cuisson: 30
  repos: 0
ingredients:
- 2 boîtes de thon (280 g)
- 400 g de pommes de terre
- 1 œuf
- 50 g de chapelure
- 1/2 botte de persil
- 3 c. à soupe d'huile de tournesol
- sel, poivre
etapes:
- Cuire les pommes de terre et les écraser.
- Mélanger avec le thon émietté, l'œuf et le persil ; saler, poivrer.
- Former des croquettes, les rouler dans la chapelure et les dorer à la poêle.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
