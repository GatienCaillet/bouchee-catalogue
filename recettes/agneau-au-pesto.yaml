id: agneau-au-pesto
titre: Côtes d'agneau au pesto
portions: 4
temps:
  preparation: 10
  cuisson: 10
ingredients:
- 8 côtes d'agneau
- 2 c. à soupe de pesto
- 4 c. à soupe d'huile d'olive
- 2 c. à soupe de jus de citron
- quelques gouttes de tabasco
- sel
etapes:
- Préchauffer le gril du four à 240 °C.
- Mélanger le pesto, la moitié de l'huile d'olive, le jus de citron et le tabasco.
- Badigeonner les côtes avec le reste de l'huile et les faire dorer sous le gril 5 minutes par face ; saler en fin
  de cuisson.
- Badigeonner les côtes du mélange au pesto et servir le reste à part.
