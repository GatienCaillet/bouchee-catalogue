id: lait-de-poule
titre: Lait de poule
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- 6 jaunes d'œufs
- 30 g de sucre
- 20 cl d'eau de fleur d'oranger
- 90 cl de lait demi-écrémé.
etapes:
- Chauffer le lait dans une casserole jusqu'à ce qu'il soit suffisamment chambré.
- Mélanger dans un saladier les jaunes d'œufs, le sucre et l'eau de fleur d'oranger, en fouettant vivement jusqu'à
  ce que le mélange s'éclaircisse et s'homogénéise.
- Verser petit à petit le lait bouillant sur le mélange tout en continuant à fouetter.
- Servir très chaud.
