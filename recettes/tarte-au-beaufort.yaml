id: tarte-au-beaufort
titre: Tarte au beaufort
portions: 6
temps:
  preparation: 31
  cuisson: 25
  repos: 0
ingredients:
- 200 g de beaufort
- 30 cl de crème fraîche épaisse
- 2 œufs
- 100 g de beurre
- 200 g de farine
- poivre, sel
- lait.
etapes:
- Mettre la farine sur un plat avec une pincée de sel ; ajouter le beurre coupé en petits morceaux ; pétrir à la
  main jusqu'à obtention d'une pâte homogène.
- Faire un puits et y verser le lait petit à petit tout en continuant à pétrir. Faire une boule avec l'ensemble,
  puis étaler avec un rouleau à pâtisserie. Foncer une tourtière de 25-30 cm de diamètre.
- Mélanger la crème fraîche avec les deux œufs entiers dans un grand bol. Râper le Beaufort et l'ajouter au contenu
  du bol. Poivrer abondamment. Verser le contenu du bol dans la tourtière.
- Cuire à four moyen thermostat 6 pendant 25 minutes. Servir chaud, avec de la salade et un vin de Savoie.
