id: quiche-a-la-courge-et-au-chevre
titre: Quiche à la courge et au chèvre
portions: 4
temps:
  preparation: 20
  cuisson: 40
  repos: 0
ingredients:
- 1 pâte brisée
- 400 g de courge butternut
- 100 g de fromage de chèvre
- 3 œufs
- 20 cl de crème fraîche
- 10 cl de lait
- 1 pincée de muscade
- sel, poivre
etapes:
- Préchauffer le four à 180 °C et garnir un moule à tarte de la pâte brisée.
- Couper la courge en petits cubes, les cuire 10 minutes à la vapeur et émietter le chèvre.
- Battre les œufs avec la crème et le lait ; saler, poivrer et ajouter la muscade.
- Répartir la garniture sur la pâte et verser l'appareil par-dessus.
- Enfourner 35 à 40 minutes, jusqu'à ce que la quiche soit dorée et prise.
source:
  titre: Recette Bouchée
