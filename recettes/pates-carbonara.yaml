id: pates-carbonara
titre: Pâtes à la carbonara
portions: 4
temps:
  preparation: 10
  cuisson: 15
ingredients:
- 360 g de spaghetti
- 200 g de poitrine de porc (ou guanciale)
- 120 g de pecorino
- 4 œufs
- sel, poivre
etapes:
- Faire chauffer une grande casserole d'eau légèrement salée.
- Couper la poitrine en petits morceaux et la faire revenir à feu doux, sans matière grasse.
- Cuire les pâtes un peu moins longtemps que le temps indiqué.
- Battre les œufs avec le pecorino râpé et du poivre.
- Égoutter les pâtes en gardant un peu d'eau de cuisson, puis les mettre dans la poêle avec la viande et un peu
  de cette eau.
- Remuer une à deux minutes, puis, hors du feu, ajouter le mélange œufs-pecorino ; remuer et servir.
