id: poulet-a-la-gaston-gerard
titre: Poulet à la Gaston Gérard
portions: 4
temps:
  preparation: 34
  cuisson: 30
  repos: 0
ingredients:
- 1 poulet coupé en morceaux cru (1 kg-1 kg 500)
- 150 g de comté râpé
- 3 oignons
- 2 verres de vin blanc (idéalement Bourgogne Aligoté ou Bourgogne blanc)
- 50 cl de crème fraîche épaisse
- 40 g. de beurre
- 1 bonne c. à soupe de moutarde de Dijon
- 1 c. à café de paprika
etapes:
- Faire dorer les morceaux de poulet dans le beurre dans une cocotte, saler et poivrer. Une fois dorés réserver
  dans un plat à four.
- Dans la cocotte, faire dorer les oignons, ajouter le vin blanc. Laisser un peu réduire, puis ajouter la moutarde,
  le Comté (garder un peu de comté pour la fin de la recette) et le paprika. Bien remuer, et porter à ébullition.
- Ajouter la crème et verser sur le poulet dans le plat allant au four.
- Parsemer de comté râpé et mettre au four 30 minutes à 200 °C.
- Servir avec du riz ou des pommes de terre à l'eau.
