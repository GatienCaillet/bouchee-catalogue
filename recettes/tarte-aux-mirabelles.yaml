id: tarte-aux-mirabelles
titre: Tarte aux mirabelles
portions: 4
temps:
  preparation: 19
  cuisson: 25
  repos: 0
ingredients:
- 1 pâte brisée
- 300 g de mirabelles
- 50 g de sucre.
etapes:
- Étaler la pâte au fond d'un plat à tartes
- Garnir de mirabelles en rangs bien serrés
- Saupoudrer de sucre en poudre
- Enfourner la tarte à 180°C, cuire 25 min.
