id: poisson-au-guazzetto
titre: Poisson au guazzetto
portions: 4
temps:
  preparation: 25
  cuisson: 65
  repos: 0
ingredients:
- 2 gousses d'ail
- persil
- un jus de citron
- romarin
- sel et poivre
etapes:
- Dans une poêle de préférence oblongue, faire revenir une gousse d'ail et du persil hachés dans un peu d'huile
  d'olive extra-vierge. Avant même que l'ail n'ait doré, mettre le poisson (ou les praires, ou les gambas ou langoustines)
  dans la poêle, le faire revenir rapidement sur les deux côtés en salant et poivrant légèrement, avant d'ajouter
  un quart de verre de vin blanc sec et corsé (en Italie on utilise le plus souvent du Verdicchio, de la Vernaccia
  de San Gimignano, ou de l'Orvieto).
- Laisser cuire à feu doux un quart d'heure ou vingt minutes selon la grosseur du poisson ; couvrir pour que le
  guazzetto (le jus obtenu durant la cuisson) n'évapore pas trop (éventuellement rajouter un tout petit peu d'eau),
  ajouter un jus de citron juste avant de retirer du feu.
- Après avoir vidé et nettoyé le poisson avant de le cuire, on aura garni l'intérieur avec un brin de romarin, une
  gousse d'ail coupée en deux (dans le sens de la longueur), ou avec une branche de persil ou de basilic à la rigueur,
  sel et poivre.
- On procédera de même pour les crustacés, qu'on servira alors en hors-d'œuvre, et pour les praires ou palourdes
  (de petite taille), mais dans ce cas on n'utilisera pas de romarin, seulement l'ail et le persil.
- Si l'on désire utiliser ces dernières pour confectionner un plat de spaghetti alle vongole (pâtes aux praires),
  on s'abstiendra d'ajouter le jus de citron, mais on fera rapidement sauter les pâtes al dente (à peine cuites
  car elles finiront de cuire en revenant dans la poêle avec les praires).
- Ce plat, qui ne nécessite guère plus d'une demi-heure entre la préparation et la cuisson, est une base permettant
  d'accommoder différentes variétés tant de poissons que de fruits de mer. C'est un mets agréable à déguster durant
  la période estivale, à laquelle on donnera ainsi une saveur méditerranéenne.
- Catégorie:Cuisine italienne
