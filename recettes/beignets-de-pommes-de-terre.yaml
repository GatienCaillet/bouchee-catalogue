id: beignets-de-pommes-de-terre
titre: Beignets de pommes de terre
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- 1 kg de Pommes de terre
- 1 cuillère à soupe de Farine
- 3 œufs
- un peu de Poivre, sel, ail, ciboulette.
etapes:
- Râper finement les pommes de terre.
- Les égoutter, lier avec un peu de farine et ajouter les œufs préalablement battus.
- Assaisonner, ajouter la ciboulette ciselée.
- Frire.
