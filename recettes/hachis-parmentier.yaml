id: hachis-parmentier
titre: Hachis parmentier
portions: 4
temps:
  preparation: 30
  cuisson: 55
ingredients:
- 600 g de bœuf haché
- 1 œuf
- 2 c. à soupe de persil haché
- 1 kg de pommes de terre
- 25 cl de lait
- 1 oignon
- 1 gousse d'ail
- 100 g de beurre
- sel, poivre
- 1 pincée de noix de muscade
- 60 g de gruyère râpé
etapes:
- Préchauffer le four à 220 °C.
- Cuire la viande hachée à la poêle, puis la mélanger avec le persil et l'œuf.
- Cuire les pommes de terre 30 minutes à l'eau, les écraser en purée et ajouter le lait.
- Hacher l'oignon et l'ail, les faire fondre dans un peu de beurre.
- Ajouter à la purée l'oignon, l'ail, le reste du beurre en morceaux, du sel, du poivre et la muscade.
- Dans un plat, étaler la moitié de la purée, puis la viande, puis le reste de la purée ; couvrir de gruyère.
- Faire gratiner environ 25 minutes.
