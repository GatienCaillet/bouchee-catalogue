id: coca-de-llanda
titre: Coca de llanda
portions: 4
temps:
  preparation: 37
  cuisson: 35
  repos: 0
ingredients:
- 3 œufs
- 400 g de farine
- 250 ml de lait
- 200 g de sucre cristallisé
- 150 ml d'huile d'olive
- 2 oranges
- texte: 1 sachet de levure
  ingredients:
  - levure
  categorie: true
- sucre cristallisé pour la surface
- cannelle en poudre pour la surface
etapes:
- Huiler un tian ou une plaque à four rectangulaire. Laver les oranges et râper finement les zestes, puis les presser.
  On doit obtenir 150 ml de jus d'orange. Mélanger le jus, les zestes, les œufs, la farine, la levure, le lait,
  le sucre et l'huile d'olive. Verser au moule, dessiner des rayures avec du sucre cristallisé mélangé avec de la
  cannelle en poudre et cuire au four préchauffé à 180 ºC pendant 35 minutes.
