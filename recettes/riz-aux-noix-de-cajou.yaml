id: riz-aux-noix-de-cajou
titre: Riz aux noix de Cajou
portions: 4
temps:
  preparation: 31
  cuisson: 10
  repos: 0
ingredients:
- 500 g de riz cuit
- 100 g de noix de Cajou
- 1 oignon
- 1 grosse pomme rouge
- texte: 3 branches de céleri
  ingredients:
  - celeri
  categorie: true
- 1 cuillère à soupe d'huile de tournesol
- Sel et poivre.
etapes:
- Coupez l'oignon, la pomme et le céleri en menus morceaux. Faites-les revenir dans la poêle huilée. Ajoutez trois
  cuillères à soupe d'eau et laissez mijoter 10 min.
- Ajoutez le riz. Mélangez tous les ingrédients.
