id: gnocchi
titre: Gnocchi
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 2 kg de pommes de terre
- 400 g de farine
- 1 œuf
- huile d'olive
- sel
- eau.
etapes:
- Faire bouillir les pommes de terre avec la peau, puis les éplucher et les écraser au presse-purée. On peut aussi
  les faire cuire au four au lieu de les faire bouillir, ce qui donne une bouillie moins humide et donc moins collante
  lors du découpage des gnocchis.
- Mélanger à cette pâte la farine (1/5 du poids des pommes de terre), un œuf et un peu d'huile d'olive.
- Faire une grosse boule, puis façonner de petits cylindres d'environ 2 cm de long et les allonger côte à côte.
- Écraser ces cylindres avec une fourchette pour leur donner leur forme.
- Faire cuire dans de l'eau salée. La cuisson est terminée lorsque les gnocchis remontent à la surface.
