id: pate-a-raviole
titre: Pâte à raviole
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 60
ingredients:
- 1 kg de farine de blé
- 10 œufs
- 20 cl d'huile d'olive
- 10 g de sel
etapes:
- Verser la farine sur le plan de travail et creuser une fontaine au centre et verser les œufs battus en omelette.
- Ajouter l'huile d'olive, saler et mélanger le tout en intégrant la farine au fur et à mesure, puis travailler
  à la main jusqu'à formation d'une pâte lisse et ferme.
- Rouler la pâte en boule, l'envelopper dans du film alimentaire et réserver au frais durant une heure, avant toute
  utilisation.
