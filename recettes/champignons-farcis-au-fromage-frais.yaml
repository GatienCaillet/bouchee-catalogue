id: champignons-farcis-au-fromage-frais
titre: Champignons farcis au fromage frais
portions: 4
temps:
  preparation: 15
  cuisson: 30
  repos: 0
ingredients:
- 12 gros champignons de Paris
- 150 g de fromage frais
- 1/2 botte de persil
- 1 gousse d'ail
- sel, poivre
etapes:
- Retirer les pieds des champignons.
- Les garnir de fromage frais mélangé à l'ail et au persil.
- Cuire 20 minutes à 200 °C.
decouverte:
  aliment: champignon_de_paris
  niveau: 3
  pourquoi: Le champignon est entier, mais le fromage frais adoucit le tout.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
