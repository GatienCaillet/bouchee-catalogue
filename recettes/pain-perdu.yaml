id: pain-perdu
titre: Pain perdu
portions: 4
temps:
  preparation: 25
  cuisson: 0
  repos: 0
ingredients:
- quelques tranches de pain rassis
- un demi-bol de lait
- 2 ou 3 œufs
- beurre
- cassonade.
etapes:
- Verser le lait dans une assiette creuse. Battre les œufs dans une autre assiette creuse.
- Tremper une tranche de pain dans le lait, en le laissant bien imbiber. Puis passer la tranche de pain dans les
  œufs battus.
- Faire revenir la tranche de pain dans une poêle avec un peu de beurre.
- Servir avec de la cassonade.
