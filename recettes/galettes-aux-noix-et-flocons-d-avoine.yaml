id: galettes-aux-noix-et-flocons-d-avoine
titre: Galettes aux noix et flocons d’avoine
portions: 4
temps:
  preparation: 31
  cuisson: 20
  repos: 0
ingredients:
- 100 g de flocons d'avoine
- 50 g de noix pilées
- 1 gousse d'ail hachée
- 25 cl de bouillon de légumes
- 0,5 cuillère à thé de miso
- 1 cuillère à thé de sauce de soja
- noix de muscade, sel, poivre, chapelure, huile d'arachide.
etapes:
- Porter le bouillon à ébullition avec la sauce de soja, le miso et l'ail haché. Y verser les flocons, porter à
  ébullition puis laisser mijoter 20 min à petit feu.
- Laisser refroidir. Ajouter les noix à la préparation ainsi que les épices et suffisamment de chapelure pour former
  de petites galettes. Rissoler dans l'huile quelques min de chaque côté.
- Vous pouvez servir ces galettes avec une sauce à l'oignon et au curry et des pommes de terre nature ou des pommes
  frites.
