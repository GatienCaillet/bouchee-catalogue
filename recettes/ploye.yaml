id: ploye
titre: Ploye
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- 200 g de farine de sarrasin
- 100 g de farine blanche
- 15 g de poudre à pâte
- 5 g de sel
etapes:
- Mélanger les ingrédients secs, ajouter 20 cl d'eau froide mélanger
- Laisser reposer cinq min. Ajouter 10 cl d'eau bouillante, brasser (Si la pâte est trop épaisse, ajouter de l'eau
  froide)
- Cuire dans un poêlon
