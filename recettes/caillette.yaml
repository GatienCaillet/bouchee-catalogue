id: caillette
titre: Caillette
portions: 4
temps:
  preparation: 45
  cuisson: 50
  repos: 0
ingredients:
- 500 g de porc maigre
- 200 g de lard gras
- 500 g de foie de porc
- 1 crépine de porc
- 1 cuillerée de saindoux
- 2 œufs
- 500 g de feuilles de blettes
- 500 g de feuilles d'épinards
- 2 oignons
- 2 gousses d'ail
- persil
- thym
- laurier en poudre
- sel de table
- poivre.
etapes:
- Mettez de l'eau à bouillir dans un faitout, salez-la, quand elle arrive à ébullition jetez-y les blettes et les
  épinards. Laissez-les bouillir 7 à 8 minutes, puis égouttez-les et passez-les à l'eau froide pour les rafraîchir,
  pressez-les entre vos mains pour bien les égoutter, puis hachez-les. Hachez la viande maigre de porc, le foie
  de porc et le lard gras.
- Mettez le saindoux dans un sautoir à feu doux, quand il est fondu, ajoutez l'oignon haché, laissez dorer, puis
  ajoutez l'ail écrasé et le hachis de porc maigre, le foie et le lard gras, laissez dorer 3 à 4 minutes à feu vif,
  en mélangeant bien tous les éléments. Hachez un peu de persil, ajoutez-le dans le sautoir ainsi que le thym et
  le laurier en poudre, salez et poivrez, ajoutez enfin le hachis blettes-épinards, laissez cuire 5 à 6 minutes.
  Mélangez bien.
- Mettez la crépine de porc dans un récipient plein d'eau froide. Quand la farce est cuite, retirez-la du sautoir,
  battez les 2 œufs en omelette, ajoutez-les à la farce en mélangeant bien. Façonnez-la en 10 boulettes, chacune
  de la grosseur d'une pomme.
- Allumez le four.
- Retirez la crépine de l'eau froide, étalez-la sur votre plan de travail, coupez-la en 10 morceaux de taille suffisante
  pour envelopper les 10 boules de farce (caillettes), entourez chaque caillette d'un morceau de crépine. Disposez
  les caillettes bien serrées, les unes contre les autres dans un plat allant au four; glissez à four chaud; laissez
  cuire 35 minutes environ.
- Servez froid ou chaud.
