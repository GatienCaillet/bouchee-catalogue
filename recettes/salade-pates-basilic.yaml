id: salade-pates-basilic
titre: Salade de pâtes au basilic, sauce arachide
portions: 4
temps:
  preparation: 15
  cuisson: 5
ingredients:
- 350 g de tagliatelles fraîches
- 150 g de champignons de Paris
- 25 g de basilic
- 20 g de beurre de cacahuète
- 3 oignons verts
- 25 ml d'huile de sésame
- 25 ml de sauce soja
- 15 ml d'huile d'arachide
- 1 c. à café de sauce pimentée
etapes:
- Cuire les pâtes al dente, les refroidir, les arroser d'huile d'arachide et remuer.
- Mélanger l'huile de sésame, la sauce soja, le beurre de cacahuète et la sauce pimentée ; verser sur les pâtes
  et remuer.
- Ajouter les oignons verts tranchés, les champignons émincés et le basilic haché.
