id: pates-au-thon
titre: Pâtes au thon et à la tomate
portions: 2
temps:
  preparation: 10
  cuisson: 15
ingredients:
- 250 g de penne
- 1 oignon
- 1 boîte de thon (140 g)
- 1 piment de Cayenne
- 2 c. à soupe d'huile d'olive
- sel, poivre
- 100 ml de sauce tomate
- 30 g de parmesan
etapes:
- Couper l'oignon en fines lamelles et le faire fondre à feu doux dans l'huile d'olive.
- Quand il est transparent, ajouter le piment émietté puis le thon ; cuire 3 minutes.
- Ajouter la sauce tomate et laisser mijoter le temps de cuire les pâtes.
- Cuire les pâtes selon les indications du paquet et les égoutter.
- Mélanger les pâtes et la sauce, assaisonner, parsemer de parmesan et servir.
