id: omelette-aux-pommes-de-terre-et-a-l-oignon
titre: Omelette aux pommes de terre et à l'oignon
portions: 4
temps:
  preparation: 10
  cuisson: 10
  repos: 0
ingredients:
- 8 œufs
- 5 cl de lait
- 20 g de beurre
- 3 pommes de terre
- 1 oignon
- sel, poivre
etapes:
- Couper les pommes de terre en fines rondelles et l'oignon en lamelles ; les cuire 15 minutes à la poêle.
- Battre les œufs en omelette avec le lait ; saler et poivrer.
- Faire chauffer le beurre dans une grande poêle, ajouter la garniture puis verser les œufs.
- Cuire à feu moyen 5 à 8 minutes en ramenant les bords vers le centre, jusqu'à ce que l'omelette soit prise mais
  encore moelleuse.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
