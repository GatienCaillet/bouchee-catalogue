id: galettes-de-sarrasin-au-saumon-et-aux-poireaux
titre: Galettes de sarrasin au saumon et aux poireaux
portions: 4
temps:
  preparation: 15
  cuisson: 25
  repos: 60
ingredients:
- 250 g de farine de sarrasin
- 1 œuf
- 50 cl d'eau
- 2 poireaux
- 150 g de saumon fumé
- 10 cl de crème fraîche
- 20 g de beurre
- sel
etapes:
- Préparer la pâte et la laisser reposer 1 heure.
- Faire fondre les poireaux émincés au beurre, ajouter la crème.
- Cuire les galettes et les garnir de poireaux et de saumon.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
