id: potage-aux-lentilles-corail
titre: Potage aux lentilles corail
portions: 4
temps:
  preparation: 28
  cuisson: 30
  repos: 0
ingredients:
- 300 g de lentilles corail
- 2 l de bouillon de légumes
- 1 oignon
- 1 gousse d'ail
- 3 carottes
- sel, poivre, thym, huile d'olive
etapes:
- Rissoler l'oignon émincé, l'ail écrasé et les carottes en rondelles, leur ajouter les lentilles, le bouillon et
  l'assaisonnement. Porter à ébullition, cuire 30 min à la casserole à pression
- Servir chaud avec des croûtons de pain
