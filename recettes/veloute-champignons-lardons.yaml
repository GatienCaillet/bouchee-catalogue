id: veloute-champignons-lardons
titre: Velouté de champignons aux lardons
portions: 4
temps:
  preparation: 20
  cuisson: 25
ingredients:
- 1,2 l de bouillon de poulet
- 400 g de pommes de terre
- 200 g de champignons de Paris
- 100 g de lardons fumés
- 2 c. à soupe d'huile d'olive
- 1 oignon
- 2 gousses d'ail
- 1 brin de persil
- 10 cl de crème fraîche
- sel, poivre
etapes:
- Nettoyer les champignons.
- Faire sauter les lardons et quelques champignons dans un peu d'huile ; réserver.
- Couper en dés les pommes de terre, l'oignon et l'ail, les faire revenir dans une cocotte avec le reste de l'huile,
  puis ajouter les champignons.
- Verser le bouillon chaud et cuire 20 minutes ; ajouter le persil, mixer, saler et poivrer.
- Servir avec les lardons et les champignons réservés, et un peu de crème fraîche.
