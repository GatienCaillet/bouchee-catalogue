id: mousse-au-chocolat-legere
titre: Mousse au chocolat légère
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 120
ingredients:
- texte: 200 g de chocolat
  ingredients:
  - chocolat
  categorie: true
- 3 blancs d'œufs
- 2 cl de lait ou d'eau.
etapes:
- Fondre le chocolat avec le lait au bain-marie
- très fermes
- Mélanger un tiers des blancs en neige au chocolat
- Ajouter et mélanger le reste des blancs
- Verser dans un ou plusieurs récipients, mettre au réfrigérateur deux heures
