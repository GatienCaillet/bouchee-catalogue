id: quiche-aux-poivrons
titre: Quiche aux poivrons
portions: 4
temps:
  preparation: 20
  cuisson: 40
  repos: 0
ingredients:
- 1 pâte brisée
- 2 poivrons
- 1 oignon
- 3 œufs
- 20 cl de crème fraîche
- 10 cl de lait
- 1 pincée de muscade
- sel, poivre
etapes:
- Préchauffer le four à 180 °C et garnir un moule à tarte de la pâte brisée.
- Couper les poivrons en lanières, émincer l'oignon et faire revenir le tout 10 minutes.
- Battre les œufs avec la crème et le lait ; saler, poivrer et ajouter la muscade.
- Répartir la garniture sur la pâte et verser l'appareil par-dessus.
- Enfourner 35 à 40 minutes, jusqu'à ce que la quiche soit dorée et prise.
decouverte:
  aliment: poivron
  niveau: 2
  pourquoi: Fondus avec l'oignon et pris dans l'appareil, les poivrons sont discrets.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
