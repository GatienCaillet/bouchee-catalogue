id: gateau-de-riz
titre: Gâteau de riz
portions: 6
temps:
  preparation: 28
  cuisson: 74
  repos: 0
ingredients:
- 300 g de riz
- 3/4 l de lait demi-écrémé
- 1 gousse de vanille
- 3 œufs
- 150 g de sucre en poudre pour le gâteau
- 90 g de sucre en poudre pour le caramel
etapes:
- 'Recette pour 6 personnes : * 300 g de riz * 3/4 l de lait demi-écrémé * 1 gousse de vanille * 3 œufs * 150 g
  de sucre en poudre pour le gâteau * 90 g de sucre en poudre pour le caramel'
- Dans une casserole, faites blanchir le riz dans un grand volume d'eau bouillante pendant 4 min. Égouttez-le et
  rincez-le à l'eau claire. Mettez le lait dans une casserole. Fendez la gousse de vanille en deux. Grattez-en les
  grains et mélangez-les au lait avec la gousse de vanille. Versez le riz et faites cuire à feu doux pendant 30
  min. Surveillez les dernières minutes de cuisson. Le riz finit de bien cuire en absorbant le lait.
- Dans une jatte, mélangez les œufs et les 150 g de sucre. Ajoutez petit à petit le riz encore chaud. Préparez un
  caramel avec les 60 g de sucre en poudre. Nappez-en les bord d'un moule à charlotte ou à flan et versez le restant
  au fond du moule. Versez le riz dans le moule et faites cuire au four au bain-marie pendant 30 à 35 min à 180
  °C. Sortez du four et laissez tiédir au moins 10 min avant de démouler. Dégustez-le encore tiède ou froid.
- Catégorie:Recettes de cuisine à base de riz Gâteau de riz Riz
