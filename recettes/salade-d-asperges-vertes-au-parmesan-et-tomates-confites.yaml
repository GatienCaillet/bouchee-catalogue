id: salade-d-asperges-vertes-au-parmesan-et-tomates-confites
titre: Salade d'asperges vertes au parmesan et tomates confites
portions: 4
temps:
  preparation: 31
  cuisson: 10
  repos: 0
ingredients:
- 1 kg d'asperges vertes
- 250 g de tomates cerises
- 20 copeaux de parmesan
- 1 botte de cerfeuil
- 1 dl d'huile d'olive
- 6 cl de vinaigre de Xérès
- sel, poivre du moulin
etapes:
- Confire les tomates cerises durant 10 minutes à feu doux dans l'huile d'olive chaude,les retirer du feu.
- Tailler les asperges en lanières le plus finement possible, dans la longueur après avoir ôter les 4 derniers centimètres
  de la tige .
- Préparer la vinaigrette avec le vinaigre de Xérès et l'huile de cuisson des tomates, saler et poivrer.
- Disposer dans les assiettes les lanières d'asperges et les tomates confites. Parsemer de cerfeuil et de copeaux
  de parmesan, arroser de la vinaigrette.
