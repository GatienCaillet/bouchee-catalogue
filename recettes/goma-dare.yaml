id: goma-dare
titre: Goma-dare
portions: 4
temps:
  preparation: 25
  cuisson: 0
  repos: 0
ingredients:
- 2 c.s. de graines de sésame
- 4 c.s. de sauce de soja
- 2 c.s. mirin
- 1 c.s. de sucre
- 1/2 tasse de dashi
etapes:
- Griller les graines de sésame en surveillant constamment, puis les piler finement jusqu'à obtenir la consistence
  d'une pâte.
- Ajouter le reste des ingrédients et bien mélanger.
