id: huevos-moles
titre: Huevos moles
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- 6 jaunes d'œuf
- 125g de sucre
- 360ml d'eau
- 1 pincée de cannelle en poudre
etapes:
- 'Faire chauffer dans une petite casserole l''eau et le sucre, en remuant, jusqu''à obtenir un sirop ou caramel
  léger : Sa consistance doit former un fil de caramel si l''on met une goutte au bout du pouce, que l''on fait
  "une pince" en le touchant avec notre index puis que l''on separe les doigts.'
- À part, battre les jaunes d'œuf et la cannelle.
- Ajouter peu à peu le sirop, sans arrêter de battre.
- Cuire au bain marie en remuant jusqu'à que ça soit épais.
- Distribuer en verres à pied et laisser refroidir
- Catégorie:Cuisine espagnole Catégorie:Recettes végétariennes
