id: cookies-aux-pepites-de-chocolat-3
titre: Cookies aux pépites de chocolat
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 250 g de farine
- 1 œuf
- 100 g de sucre en poudre
- 100 g de beurre
- texte: 1 cuillère à café de levure
  ingredients:
  - levure
  categorie: true
- 100 g de pépites de chocolat.
etapes:
- Faire ramollir le beurre.
- Mélanger tous les ingrédients (l'ordre n'importe pas) dans un saladier.
- Pétrir à la main la pâte ainsi obtenu.
- Sur une feuille de papier sulfurisé, former vos cookies.
