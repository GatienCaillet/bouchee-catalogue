id: biscuit-aux-poires
titre: Biscuit aux poires
portions: 10
temps:
  preparation: 34
  cuisson: 60
  repos: 0
ingredients:
- 4 œufs
- 250 grammes de sucre
- 125 grammes de beurre doux
- 250 grammes de farine
- ½ cuillère à café de cannelle
- 1 paquet de levure chimique
- 1 sachet de sucre vanillé
- 3 à 4 poires
etapes:
- Dans un saladier, mélanger les œufs et le sucre, jusqu'à ce que le mélange soit liquide et mousseux.
- Ajouter le beurre en pommade
- Mélanger la farine, la cannelle et la levure.
- Ajouter le mélange farine-canelle-levure dans le saladier, petit à petit, et mélanger jusqu'à disparition des
  grumeaux.
- Beurrer un moule, puis y verser la pâte.
- Éplucher les poires, les évider et les couper en deux.
- Déposer les demi-poires dans le moule, par dessus la pâte, sur une seule couche et dans tout le moule.
- Sucrer la partie émergée des poires avec le sucre vanillé.
- Faire cuire une heure au moins à 155°C (thermostat 5).
