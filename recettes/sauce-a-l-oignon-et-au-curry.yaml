id: sauce-a-l-oignon-et-au-curry
titre: Sauce à l'oignon et au curry
portions: 4
temps:
  preparation: 28
  cuisson: 30
  repos: 0
ingredients:
- 3 oignons hachés
- 50 cl de bouillon de légumes
- 3 cuillères à soupe de farine
- 1 cuillère à soupe de curry
- huile d'olive.
- sel, poivre
etapes:
- Blondir les oignons dans l'huile pendant 30 min.
- Chauffer 2 cuillères à soupe d'huile dans une casserole, ajouter la farine et faire un roux.
- Incorporer petit à petit le bouillon, en remuant sans cesse. Laisser épaissir, ajouter le curry et l'assaisonnement.
  Mélanger les oignons à la sauce.
