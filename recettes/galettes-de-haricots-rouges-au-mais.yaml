id: galettes-de-haricots-rouges-au-mais
titre: Galettes de haricots rouges au maïs
portions: 4
temps:
  preparation: 22
  cuisson: 5
  repos: 0
ingredients:
- 200 g de haricots rouges cuits
- 150 g de maïs
- 1 oignon émincé
- huile d'arachide, chapelure, sel, poivre.
etapes:
- Mixer les haricots, leur mélanger l'oignon, le maïs et l'assaisonnement, ainsi que suffisamment de chapelure pour
  que l'on puisse former de petites galettes. Rissoler dans l'huile quelques minutes de chaque côté.
- Vous pouvez servir ces galettes avec une céréale nappée de coulis de poivrons rouges.
