id: boulettes-de-boeuf-a-la-sauce-tomate
titre: Boulettes de bœuf à la sauce tomate
portions: 4
temps:
  preparation: 20
  cuisson: 30
  repos: 0
ingredients:
- 500 g de bœuf haché
- 1 œuf
- 50 g de chapelure
- 1 oignon
- 800 g de tomates pelées
- 2 c. à soupe d'huile d'olive
- 1/2 botte de persil
- sel, poivre
etapes:
- Mélanger le bœuf, l'œuf, la chapelure, la moitié de l'oignon haché et le persil ; saler, poivrer.
- Former des boulettes et les faire dorer dans l'huile.
- Ajouter le reste de l'oignon et les tomates, et laisser mijoter 25 minutes.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
