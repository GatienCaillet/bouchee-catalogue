id: betteraves-roties-aux-herbes-de-provence
titre: Betteraves rôties aux herbes de Provence
portions: 4
temps:
  preparation: 10
  cuisson: 35
  repos: 0
ingredients:
- 600 g de betteraves
- 3 c. à soupe d'huile d'olive
- 1 c. à soupe d'herbes de Provence
- 2 gousses d'ail
- sel, poivre
etapes:
- Préchauffer le four à 210 °C.
- Éplucher les betteraves et les couper en cubes.
- Étaler les betteraves sur une plaque, arroser d'huile d'olive et ajouter les gousses d'ail entières.
- Parsemer d'herbes de Provence, saler, poivrer et bien mélanger.
- Enfourner 30 à 40 minutes en remuant à mi-cuisson, jusqu'à ce que les légumes soient dorés et tendres.
decouverte:
  aliment: betterave
  niveau: 4
  pourquoi: Rôtie, la betterave est servie seule, en accompagnement.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
