id: gratin-de-poireaux
titre: Gratin de poireaux
portions: 4
temps:
  preparation: 37
  cuisson: 15
  repos: 0
ingredients:
- 400 g de poireaux
- texte: 100 g champignons
  ingredients:
  - champignon
  categorie: true
- 200 g de lardons
- 100 g d'emmental
- 1 oignon
- 50 cl de lait
- 40 g de beurre
- 20 g de farine
- sel, poivre
etapes:
- Cuire les poireaux coupés en biseaux et les champignons émincées dans une casserole d'eau bouillante salée 10
  min
- Émincer les oignons et les faire rissoler dans 20 g de beurre. Ajouter les lardons lorsque les oignons commencent
  à changer de couleur.
- Faire une béchamel avec 20 g de beurre, la farine et le lait, saler
- Verser les légumes sur les lardons, puis la béchamel. Mélanger le tout, poivrer
- Verser dans des terrines individuelles et recouvrir d'emmental râpé
- Gratiner 5 min
