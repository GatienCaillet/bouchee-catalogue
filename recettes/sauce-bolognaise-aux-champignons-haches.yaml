id: sauce-bolognaise-aux-champignons-haches
titre: Sauce bolognaise aux champignons hachés
portions: 4
temps:
  preparation: 15
  cuisson: 30
  repos: 0
ingredients:
- 400 g de spaghettis
- 300 g de bœuf haché
- 150 g de champignons de Paris
- 1 oignon
- 800 g de tomates pelées
- 2 c. à soupe d'huile d'olive
- sel
etapes:
- Hacher très finement les champignons.
- Faire revenir l'oignon, le bœuf et les champignons, puis ajouter les tomates et mijoter 30 minutes.
decouverte:
  aliment: champignon_de_paris
  niveau: 1
  pourquoi: Hachés très fin, les champignons se confondent avec la viande.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
  licence: CC BY-SA 4.0 (Bouchée)
  modifications: 'Recette rédigée pour Bouchée (base « parcours de découverte »), pas encore testée en cuisine :
    quantités et temps à confirmer.'
