id: poulet-sauce-soja
titre: Poulet à la sauce soja
portions: 4
temps:
  preparation: 10
  cuisson: 40
ingredients:
- 4 cuisses de poulet
- 3 oignons verts
- 1 c. à soupe d'huile de tournesol
- 3 c. à soupe de sauce soja
- 3 c. à soupe de vin de riz chinois
- 1 morceau de gingembre frais (3 cm)
- 1 c. à soupe de sucre
- 50 cl d'eau
etapes:
- Faire dorer le poulet à la poêle dans l'huile, avec les oignons verts coupés en tronçons.
- Ajouter la sauce soja, le vin de riz, le gingembre émincé et le sucre, puis couvrir d'eau.
- Laisser mijoter à découvert et à feu doux jusqu'à ce que la plus grande partie de l'eau soit évaporée.
- Servir avec du riz.
