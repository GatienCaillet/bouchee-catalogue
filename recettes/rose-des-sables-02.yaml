id: rose-des-sables-02
titre: Rose des sables
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- 100 g de végétaline
- 100 g de chocolat pâtissier
- 100 g de sucre glace
- 100 g de Corn Flakes
etapes:
- Faire fondre la végétaline dans un saladier au micro-ondes
- Ajouter le chocolat en petit morceaux. Les morceaux doivent en principe fondre dans la végétaline. Aidez les à
  fondre en les cassant.
- Ajoutez le sucre glace.
- Ajoutez les corn flakes.
