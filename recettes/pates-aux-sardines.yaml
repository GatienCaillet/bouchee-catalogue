id: pates-aux-sardines
titre: Pâtes aux sardines
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de spaghettis
- 2 boîtes de sardines à l'huile
- 1 oignon
- 2 c. à soupe de chapelure
- 1 citron
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Faire revenir l'oignon, ajouter les sardines émiettées et le jus du citron ; parsemer de chapelure grillée.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
