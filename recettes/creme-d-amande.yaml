id: creme-d-amande
titre: Crème d'amande
portions: 4
temps:
  preparation: 22
  cuisson: 0
  repos: 0
ingredients:
- 120 g de sucre semoule.
- 120 g de beurre.
- 120 g d'amandes en poudre.
- 2 œufs entiers.
etapes:
- Mettre le beurre (tempéré) en parcelles dans une calotte et le crémer vigoureusement avec le sucre à l'aide d'un
  fouet.
- Ajouter les œufs, et fouetter en tournant vigoureusement durant leur incorporation, l'appareil doit être lisse.
- Incorporer la poudre d'amandes en une seule fois et mélanger l'ensemble à l'aide d'une spatule en bois.
