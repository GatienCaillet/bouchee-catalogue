id: spaghettis-au-pesto
titre: Spaghetti au pesto
portions: 4
temps:
  preparation: 5
  cuisson: 10
ingredients:
- 350 g de spaghetti
- 4 c. à soupe de pesto
- quelques feuilles de basilic
- sel, poivre
etapes:
- Cuire les spaghetti al dente dans une grande casserole d'eau salée.
- Les égoutter en gardant une louche d'eau de cuisson.
- Mélanger les pâtes avec le pesto, en ajoutant un peu d'eau de cuisson pour lier la sauce.
- Poivrer et décorer de feuilles de basilic.
