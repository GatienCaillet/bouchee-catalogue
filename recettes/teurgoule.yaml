id: teurgoule
titre: Teurgoule
portions: 6
temps:
  preparation: 40
  cuisson: 240
  repos: 0
ingredients:
- 100 g de riz rond
- 1 litre de lait cru entier
- 200 g de crème fleurette
- 90 g de sucre roux
- 1/2 cuillère à café de sucre vanillé
- 1/2 cuillère à café de cannelle en poudre
- 1 feuille de laurier
- 1 gousse de vanille
- 10 g de beurre
- 1 pincée de sel
etapes:
- Préchauffez le four à 150°C
- Faites bouillir le lait dans une casserole avec la gousse de vanille fendue en deux (en extraire les grains se
  trouvant à l'intérieur).
- Mélangez le riz rond, le sucre roux, le sucre vanillé, la cannelle, le sel et le beurre dans une terrine.
- Versez le lait bouillant et ajoutez la crème fleurette et la feuille de laurier.
- Mélangez bien à nouveau et glissez au four.
- 'Laissez cuire 2 heures à 140° et 2 heures à 120° puis éteignez le four en y laissant la terrine : le riz finira
  de cuire en absorbant tout le lait et une pellicule dorée se formera à la surface.'
- Servez à température ambiante
- Fallue Teurgoule Teurgoule
