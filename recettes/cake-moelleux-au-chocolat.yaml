id: cake-moelleux-au-chocolat
titre: Cake moelleux au chocolat
portions: 4
temps:
  preparation: 22
  cuisson: 8
  repos: 0
ingredients:
- texte: 600 g de chocolat
  ingredients:
  - chocolat
  categorie: true
- 400 g de beurre
- 120 g de sucre
- 4 œufs extra frais.
etapes:
- Préchauffer le four à 180°C.
- Mettre ensemble le chocolat et le beurre dans un grand bol. Faire fondre au bain marie.
- Pendant ce temps, beurrer un moule de 24 cm environ.
- Peser le sucre dans un bol de taille supérieure et y casser les œufs.
- Fouetter les œufs et le sucre au fouet électrique à vitesse maximale pendant plusieurs minutes jusqu'à ce que
  le mélange soit bien mousseux.
- Verser la moitié du chocolat/beurre fondus dans les œufs et mélanger à l'aide d'une spatule jusqu'à ce que le
  chocolat soit bien incorporé.
- Verser le reste du chocolat et bien mélanger.
- Verser le tout dans le moule et enfourner.
- Cuire 5-8 minutes.
- Sortir délicatement du four et laisser refroidir au frigidaire avant de démouler.
