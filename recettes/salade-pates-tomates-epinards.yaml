id: salade-pates-tomates-epinards
titre: Salade de pâtes aux tomates séchées et pousses d'épinards
portions: 4
temps:
  preparation: 15
  cuisson: 12
ingredients:
- 500 g de penne
- 1 oignon nouveau
- 60 g de tomates séchées
- 500 g de pousses d'épinards
- 4 c. à soupe de pignons de pin
- 1 c. à soupe d'origan frais
- 6 c. à soupe d'huile d'olive
- 1 c. à café de piment frais haché
- 1 gousse d'ail
- sel, poivre
etapes:
- Cuire les pâtes dans une grande casserole d'eau bouillante salée, les égoutter et les passer sous l'eau froide.
- Hacher finement l'oignon nouveau, couper les tomates séchées en lanières et hacher grossièrement les épinards.
- Faire griller les pignons quelques minutes à sec dans une poêle.
- Réunir dans un saladier les pâtes, l'oignon, les tomates, les épinards, les pignons et l'origan.
- Écraser l'ail et le secouer dans un bocal fermé avec l'huile, le piment, du sel et du poivre.
- Verser cette sauce sur la salade, bien mélanger et servir aussitôt.
decouverte:
  aliment: epinard
  niveau: 3
  pourquoi: Les pousses crues sont tendres et peu amères ; la sauce pimentée et les tomates séchées portent le goût
    du plat.
  conseil: 'Choisir de jeunes pousses : elles sont plus douces que les grandes feuilles.'
