id: sauce-aux-champignons2
titre: Sauce aux champignons2
portions: 4
temps:
  preparation: 22
  cuisson: 3
  repos: 0
ingredients:
- texte: 500 g champignons épluchés (il ne faut pas les laver mais juste les rincer et les essuyer)
  ingredients:
  - champignon
  categorie: true
- 25 cl crème fraîche (liquide, semi-liquide ...)
- beurre
- sel, poivre, un peu de noix de muscade.
etapes:
- Faire fondre le beurre, y ajouter les champignons coupés en lamelles et les faire revenir dans le beurre 3 à 4
  minutes.
- Mettre la crème liquide et laisser épaissir tout en remuant de temps en temps.
