id: tarte-a-la-noix-de-pecan
titre: Tarte à la noix de pécan
portions: 4
temps:
  preparation: 25
  cuisson: 50
  repos: 10
ingredients:
- 250 g de cerneaux de noix
- 3 œufs
- 125 g de sucre semoule
- 75 g de beurre
- texte: pâte à tarte pour un moule de 28 cm.
  ingredients:
  - pate_a_tarte
  categorie: true
etapes:
- Étaler la pâte dans un moule beurré, mettre au réfrigérateur 10 minutes.
- Préchauffer le four à 190°C (Th 5).
- 'Préparer la garniture :'
- Mélanger le beurre ramolli avec le sucre, bien battre.
- Ajouter les noix râpées puis les œufs un à un.
- Mélanger.
- Verser la préparation dans le moule.
- Décorer avec les cerneaux.
- Cuire 40 à 45 minutes.
- Attendre 10 minutes avant de démouler.
