id: maaqouda
titre: Maaqouda
portions: 2
temps:
  preparation: 37
  cuisson: 0
  repos: 0
ingredients:
- 250 g de pommes de terre
- 1 œuf
- 1 gousses d'ail ou 1 petit oignon
- cumin ou curry
- safran
- persil
- huile pour friture
- farine
- sel, poivre noir
etapes:
- Épluchez les pommes de terre, faites bouillir dans l'eau ; quand elles sont cuites, égouttez et écrasez-les avec
  une fourchette.
- Ajoutez un œuf, les herbes, les épices et l'ail ou les oignons hachés.
- Mélangez bien et faites des boules.
- Aplatissez-les, roulez-les dans la farine et faites les frire dans l'huile chaude.
