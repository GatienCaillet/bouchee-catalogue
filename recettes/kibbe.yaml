id: kibbe
titre: Kibbé
portions: 4
temps:
  preparation: 28
  cuisson: 137
  repos: 0
ingredients:
- 325 g de viande de bœuf hachée
- 125 g de boulgour
- 2 oignons
- 30 g de pignons de pin
- texte: 6 cl d'huile
  ingredients:
  - huile
  categorie: true
- texte: Sel et 4 épices ou poivre.
  ingredients:
  - sel
  - epice
  - poivre
  categorie: true
etapes:
- Tremper le boulgour dans une grande quantité d'eau 2 à 3 heures
- Mixer un oignon, 200 g de viande, saler, ajouter le 4 épices
- Presser le boulgour, ajouter la viande et mixer, réserver au frais
- Rissoler l'oignon haché avec les pignons dans l'huile 2 min, ajouter la viande, assaisonner cuire 10 min
- Former des boules avec la préparation au boulgour (à l'aide d'un doigt, faire de petites boulettes ovales creuses
  aux parois minces)
- Farcir et fermer en donnant une forme allongée aux deux extrémités
- Frire 5 min.
