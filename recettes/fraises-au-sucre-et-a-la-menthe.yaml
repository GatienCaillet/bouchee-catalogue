id: fraises-au-sucre-et-a-la-menthe
titre: Fraises au sucre et à la menthe
portions: 4
temps:
  preparation: 15
  cuisson: 0
  repos: 30
ingredients:
- 500 g de fraises
- 2 c. à soupe de sucre
- 1 citron
- quelques feuilles de menthe
etapes:
- Équeuter et couper les fraises.
- Les mélanger avec le sucre, le jus de citron et la menthe ciselée.
- Laisser macérer 30 minutes au frais.
source:
  titre: Recette Bouchée
