id: galettes-de-sarrasin-a-l-andouille-et-aux-pommes
titre: Galettes de sarrasin à l'andouille et aux pommes
portions: 4
temps:
  preparation: 15
  cuisson: 25
  repos: 60
ingredients:
- 250 g de farine de sarrasin
- 1 œuf
- 50 cl d'eau
- 150 g d'andouille
- 2 pommes
- 20 g de beurre
- sel
etapes:
- Préparer la pâte et la laisser reposer 1 heure.
- Faire dorer les pommes en lamelles au beurre.
- Cuire les galettes et les garnir d'andouille en rondelles et de pommes.
source:
  titre: Recette Bouchée
