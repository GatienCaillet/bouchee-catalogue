id: riz-au-chocolat
titre: Riz au chocolat
portions: 4
temps:
  preparation: 22
  cuisson: 10
  repos: 0
ingredients:
- texte: 150 g de chocolat
  ingredients:
  - chocolat
  categorie: true
- 100 g de riz
- 40 cl d'eau
- 20 cl de lait
etapes:
- Faire bouillir l'eau, ajouter le lait, porter à ébullition.
- Verser le riz.
- Cuire 10 min.
- Faire évaporer le mélange eau, lait.
- Ajouter le chocolat découpé en carrés, mélanger.
- Verser dans un récipient.
- Servir tiède ou froid.
