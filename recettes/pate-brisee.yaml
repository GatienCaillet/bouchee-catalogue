id: pate-brisee
titre: Pâte brisée
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 0
ingredients:
- 250 g de farine
- 125 g de beurre
- 100 g de sucre en poudre (pour la variante douce)
- 1 œuf, (si vous voulez)
- 2 cl d'eau, (augmentez l'eau si manque l'œuf)
- une pincée de sel.
etapes:
- Mettre la farine dans un récipient puis faire un puits
- Versez dans le puits 2 cl d'eau
- Mettre le beurre
- Mettre 100g de sucre en poudre (pour la variante douce) et une pincée de sel
- Puis pétrir de façon a former une boule
- Étaler la pâte sur du papier sulfurisé puis mettre le papier sur le plat et mettre au four de façon à ce que la
  pâte soit dure
- Puis rajouter vos ingrédients et laissez cuire.
