id: tarte-aux-pignons-de-pin
titre: Tarte aux pignons de pin
portions: 4
temps:
  preparation: 37
  cuisson: 55
  repos: 0
ingredients:
- 1 rouleau de pâte sablée
- 30 cl de lait entier
- 20 cl de crème fleurette
- 2 cuil. à soupe de sucre vanillé
- le zeste d'un citron non traité
- 4 jaunes d'œufs
- 120 g de sucre
- 40 g de farine
- 100 g de pignons de pin
etapes:
- Préchauffez le four à 180 °C (th. 6). Étalez votre pâte dans une tourtière chemisée de papier sulfurisé.
- Versez le lait, la crème, le sucre vanillé et le zeste de citron dans une casserole. Portez le tout à ébullition.
- Pendant ce temps, fouettez les jaunes d'œufs avec le sucre. Ajoutez progressivement la farine. Versez sur cet
  appareil le mélange de lait et de crème bouillant. Battez quelques instants.
- Remettez le tout dans la casserole à feu doux jusqu'à ébullition, puis laissez cuire pendant quelques minutes.
  Après quoi, retirez du feu et laissez tiédir légèrement.
- Répartissez cette crème dans le fond de tarte et parsemez de pignons de pin.
- Enfournez pour 50 min mais vérifiez régulièrement que les pignons de pin ne brûlent pas.
