id: mousse-aux-fruits
titre: Mousse aux fruits
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- 330 ml de crème fraîche
- texte: 200 g de fruits rouges
  ingredients:
  - fruit_rouge
  categorie: true
- 2 cuillérées à soupe de sucre glace
etapes:
- Battre la crème en chantilly, serrer avec une cuillerée de sucre.
- Laver les fruits, les égoutter puis les mixer. Ajouter le sucre.
- Passer le coulis obtenu au travers d'un chinois et mélanger délicatement à la mousse avec une spatule.
- Réserver au frais.
