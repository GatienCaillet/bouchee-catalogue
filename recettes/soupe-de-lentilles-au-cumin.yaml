id: soupe-de-lentilles-au-cumin
titre: Soupe de lentilles au cumin
portions: 4
temps:
  preparation: 20
  cuisson: 25
  repos: 0
ingredients:
- 250 g de lentilles corail
- 1 oignon
- 2 carottes
- 1 c. à café de cumin en poudre
- 1,2 l de bouillon de légumes
- 1 citron
- 2 c. à soupe d'huile d'olive
- sel
etapes:
- Émincer l'oignon et couper les carottes en rondelles.
- Les faire revenir dans l'huile avec le cumin.
- Ajouter les lentilles rincées et le bouillon, et cuire 20 minutes.
- Mixer et servir avec un filet de jus de citron.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
