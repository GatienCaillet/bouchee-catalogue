id: cake-a-la-farine-de-chataignes
titre: Cake à la farine de châtaignes
portions: 4
temps:
  preparation: 28
  cuisson: 60
  repos: 0
ingredients:
- 225 g de farine de châtaigne
- 150 g de beurre fondu
- 15 cl de crème entière
- 150 g de sucre en poudre
- 3 œufs
- 1 demi-sachet de levure chimique (environ 5 g).
etapes:
- Fouetter les œufs et le sucre dans une grande jatte. Le mélange doit légèrement pâlir.
- Ajouter la crème et le beurre fondu.
- Tamiser la farine et la levure. Bien mélanger.
- Verser la pâte dans un moule rectangulaire de 24 cm garni de papier sulfurisé.
- Cuire environ 1 h à 180 °C. Lorsque le cake est cuit, une aiguille à tricoter plantée au milieu du cake en ressort
  sèche.
