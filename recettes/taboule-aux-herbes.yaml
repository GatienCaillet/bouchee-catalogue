id: taboule-aux-herbes
titre: Taboulé aux herbes
portions: 4
temps:
  preparation: 25
  repos: 15
ingredients:
- 130 g de boulgour
- 185 ml d'eau
- 150 g de persil plat
- 4 oignons nouveaux
- 3 tomates
- 8 cl de jus de citron
- 6 cl d'huile d'olive
- 30 g de ciboulette
- 75 g de basilic
- 10 g de menthe
- sel
etapes:
- Verser l'eau sur le boulgour et laisser reposer 15 minutes, jusqu'à ce qu'elle soit absorbée.
- Retirer les tiges du persil, laver et sécher les herbes, puis les hacher finement.
- Hacher les oignons et les tomates.
- Réunir le boulgour, les herbes, les oignons, les tomates, le jus de citron, l'huile et le sel ; bien mélanger.
- Garder au frais jusqu'au moment de servir.
