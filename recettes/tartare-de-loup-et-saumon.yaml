id: tartare-de-loup-et-saumon
titre: Tartare de loup et saumon
portions: 4
temps:
  preparation: 37
  cuisson: 0
  repos: 120
ingredients:
- 200 g de saumon fumé coupé en petits dés
- 2 citrons
- 5 échalotes hachées
- 1 jaune d'œuf
- texte: 2 cuillères à soupe d'huile
  ingredients:
  - huile
  categorie: true
- texte: 1 cuillère à café de moutarde
  ingredients:
  - moutarde
  categorie: true
- texte: 2 cuillères à café de vinaigre
  ingredients:
  - vinaigre
  categorie: true
- 1 cuillère à soupe de câpres hachés
- sel et poivre du moulin
etapes:
- Dans un saladier, mélangez les petits dés du loup et du saumon, et préservez le tartare au frais dans le réfrigérateur.
- Dans un bol, mélangez le jaune d'œuf, l'huile, le vinaigre, le jus des citrons, salez et poivrez.
- Incorporez dans le mélange du bol, les échalotes et les câpres hachés, mélangez bien et laissez reposer au réfrigérateur
  pendant au moins 2 heures, en vérifiant de temps en temps l'assaisonnement.
- Servez très frais le tartare.
