id: fraises-romanof
titre: Fraises Romanof
portions: 4
temps:
  preparation: 31
  cuisson: 0
  repos: 120
ingredients:
- 500 g de fraises
- 2 cuillerées à soupe de sucre
- 2 cuillerées à soupe de curaçao
- une orange
- 1/4 de litre de crème chantilly
- un peu de sucre vanillé
- glace à la vanille.
etapes:
- Laver et égoutter les fraises.
- Les mettre dans un grand saladier.
- Mélanger le curaçao, le sucre et le jus de l'orange.
- Verser le mélange sur les fraises.
- Laisser reposer deux heures au frigo.
- Mélanger la chantilly au sucre vanillé.
- Dans une coupe à glace, déposer une boule de glace à la vanille, ajouter les fraises par dessus puis recouvrez
  de chantilly.
