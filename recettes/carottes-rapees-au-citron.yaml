id: carottes-rapees-au-citron
titre: Carottes râpées au citron
portions: 4
temps:
  preparation: 15
  cuisson: 0
  repos: 0
ingredients:
- 600 g de carottes
- 1 citron
- 3 c. à soupe d'huile d'olive
- 1/2 botte de persil
- sel
etapes:
- Râper finement les carottes.
- Les assaisonner avec le jus du citron, l'huile, le sel et le persil ciselé.
source:
  titre: Recette Bouchée
