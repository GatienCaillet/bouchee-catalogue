id: brochettes-de-saumon-au-citron
titre: Brochettes de saumon au citron
portions: 4
temps:
  preparation: 15
  cuisson: 6
  repos: 0
ingredients:
- 600 g de pavé de saumon
- 2 citrons
- 2 c. à soupe d'huile d'olive
- 1/2 botte d'aneth
- sel, poivre
etapes:
- Couper le saumon en cubes et les mélanger à l'huile, au zeste d'un citron et à l'aneth.
- Enfiler sur des brochettes avec des quartiers de citron et griller 6 minutes.
source:
