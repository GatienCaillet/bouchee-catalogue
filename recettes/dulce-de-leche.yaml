id: dulce-de-leche
titre: Dulce de leche
portions: 4
temps:
  preparation: 19
  cuisson: 135
  repos: 0
ingredients:
- 1 litre de lait
- 400 g de sucre
- 1 gousse de vanille
etapes:
- Faire chauffer le lait avec le sucre et la vanille. Retirer la gousse après 15 minutes. Remuer de temps en temps,
  jusqu'à ce que le lait épaississe et prenne une couleur caramel (environ 2 heures 30). Verser en pots.
