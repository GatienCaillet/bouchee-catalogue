id: oreilles-d-aman
titre: Oreilles d'Aman
portions: 10
temps:
  preparation: 43
  cuisson: 10
  repos: 0
ingredients:
- 500 g de farine
- 2 œufs entiers + 1 jaune
- 2 cuillères à café de levure chimique
- 125 grammes de sucre
- sucre vanillé
- texte: 1 cuillère à soupe d'huile
  ingredients:
  - huile
  categorie: true
- 1 pincée de sel
- 250 grammes de margarine
- texte: 200 grammes de confiture
  ingredients:
  - confiture
  categorie: true
- 100 grammes de raisins secs
- 100 grammes de noisettes ou d'amandes moulues.
etapes:
- Faire une fontaine avec la farine.
- Y mettre les œufs entiers et le jaune, la levure, le sel, les sucres, l'huile, la margarine et un fond de verre
  d'eau.
- Pétrir.
- Mélanger la farce.
- Étaler la pâte au rouleau, comme pour une tarte.
- Découper des ronds à l'emporte-pièce, avec un moule ou un verre.
- Y mettre un peu de farce puis souder les bouts en triangle.
- Mettre sur une tôle et cuire à four moyen, à 200°C (thermostat 6-7) pendant 10 à 15 minutes.
