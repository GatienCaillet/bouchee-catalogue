id: tarte-a-la-tomate
titre: Tarte à la tomate et à la moutarde
portions: 6
temps:
  preparation: 15
  cuisson: 25
ingredients:
- 1 pâte brisée
- 4 tomates
- 4 c. à soupe de moutarde de Dijon
- 100 g d'emmental râpé
etapes:
- Préchauffer le four à 180 °C et disposer la pâte dans un moule.
- Étaler une couche généreuse de moutarde sur la pâte, puis le fromage râpé.
- Couper les tomates en fines tranches et les disposer bien serrées sur le fromage.
- Cuire environ 25 minutes.
