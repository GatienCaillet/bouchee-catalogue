id: epinards-a-la-creme
titre: Épinards à la crème et aux champignons
portions: 2
temps:
  preparation: 15
  cuisson: 15
ingredients:
- 400 g d'épinards frais
- 200 g de champignons de Paris
- 30 g de fromage blanc
- 20 cl de lait
- 1 c. à soupe d'huile d'olive
- sel, poivre
etapes:
- Plonger les épinards 5 minutes dans l'eau bouillante salée, les égoutter, les rafraîchir dans de l'eau glacée
  et les presser.
- Les remettre dans la casserole avec le lait et cuire 5 minutes ; rectifier l'assaisonnement.
- Émincer les champignons et les faire sauter à l'huile d'olive ; saler et poivrer.
- Ajouter les épinards aux champignons, mélanger et laisser réduire.
- Hors du feu, incorporer le fromage blanc et servir en accompagnement.
decouverte:
  aliment: epinard
  niveau: 4
  pourquoi: Le lait et le fromage blanc adoucissent l'amertume ; les champignons apportent un goût familier.
  conseil: Bien presser les épinards après l'eau glacée pour éviter le côté aqueux.
