id: poelee-d-aubergines-a-l-ail-et-au-persil
titre: Poêlée d'aubergines à l'ail et au persil
portions: 4
temps:
  preparation: 10
  cuisson: 15
  repos: 0
ingredients:
- 3 aubergines
- 2 c. à soupe d'huile d'olive
- 2 gousses d'ail
- 1/2 botte de persil
- sel, poivre
etapes:
- Laver les aubergines et les couper en cubes.
- Faire chauffer l'huile dans une grande poêle et y faire sauter les aubergines 10 à 15 minutes à feu vif, en remuant
  souvent.
- Hacher l'ail et le persil.
- Ajouter l'ail et le persil en fin de cuisson, saler, poivrer et cuire encore 2 minutes.
decouverte:
  aliment: aubergine
  niveau: 4
  pourquoi: En accompagnement, l'aubergine poêlée reste fondante.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
