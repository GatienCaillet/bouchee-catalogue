id: saute-de-porc-aux-carottes-et-aux-courgettes-sauce-soja
titre: Sauté de porc aux carottes et aux courgettes, sauce soja
portions: 4
temps:
  preparation: 15
  cuisson: 12
  repos: 0
ingredients:
- 500 g de filet mignon de porc
- 2 carottes
- 2 courgettes
- 2 gousses d'ail
- 1 morceau de gingembre frais
- 3 c. à soupe de sauce soja
- 1 c. à café de fécule de maïs
- 2 c. à soupe d'huile de colza
- 1 c. à soupe de graines de sésame
etapes:
- Couper le porc en lanières ou en morceaux, et les légumes en morceaux de même taille.
- Hacher l'ail et le gingembre. Délayer la fécule dans la sauce soja avec 5 cl d'eau.
- Faire sauter le porc 3 à 5 minutes à feu vif dans l'huile, au wok ou dans une grande poêle, puis le réserver.
- Faire sauter les légumes 5 minutes avec l'ail et le gingembre, en les gardant croquants.
- Remettre le porc, verser la sauce et mélanger jusqu'à ce qu'elle nappe. Parsemer de sésame et servir avec du riz.
