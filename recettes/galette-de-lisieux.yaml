id: galette-de-lisieux
titre: Galette de Lisieux
portions: 4
temps:
  preparation: 28
  cuisson: 25
  repos: 0
ingredients:
- 1 dl de crème fraîche
- 1 dl de babeurre
- 1 cuillerée à café de sel
- 1 cuillerée à café de levure sèche
- 2 cuillerées à soupe de sucre semoule
- un peu de farine
etapes:
- Tout mélanger dans un saladier et mélangez jusqu'à obtention d'une pâte un peu molle ne collant pas.
- On taille ensuite à l'aide d'un verre dans cette pâte allongée au rouleau sur 1,5 cm d'épaisseur des galettes
  qui seront déposées sur une plaque beurrée avant d'être mises à four moyen de 25 à 30 minutes.
