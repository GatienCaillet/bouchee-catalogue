id: oeufs-poches
titre: Œufs pochés
portions: 4
temps:
  preparation: 22
  cuisson: 4
  repos: 0
ingredients:
- des œufs
- 1 litre d'eau
- texte: 25 cl de vin
  ingredients:
  - vin
  categorie: true
- texte: une cuillère de vinaigre.
  ingredients:
  - vinaigre
  categorie: true
etapes:
- Porter à frémissement l'eau, le vin et le vinaigre dans une grande casserole.
- Casser chaque œuf séparément dans une jatte.
- Déposer délicatement un œuf dans l'eau frémissante et laisser pocher 3-4 minutes. Afin d'éviter de trop nombreux
  filaments de blanc d'œuf, on peut faire tourbillonner le liquide dans la casserole en décrivant des cercles avec
  une cuillère en bois. Cela fera en sorte que l'œuf restera bien compact au centre du liquide. On peut également
  déposer l'œuf dans une louche qu'on plongera dans l'eau bouillante.
- Retirer l'œuf et l'égoutter sur du papier absorbant.
- Répéter l'opération pour chaque œuf séparément.
