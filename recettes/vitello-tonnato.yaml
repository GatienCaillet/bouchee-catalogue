id: vitello-tonnato
titre: Vitello tonnato
portions: 6
temps:
  preparation: 43
  cuisson: 0
  repos: 1440
ingredients:
- 1 rôti de veau
- quelques feuilles de laurier, de sauge
- 3 clous de girofle
- des câpres, des anchois
- 3 œufs durs
- 300 g de thon à l'huile
- un jus de citron
- huile d'olive
- texte: une bouteille de vin blanc sec
  ingredients:
  - vin
  categorie: true
- sel
- poivre
etapes:
- Faire mariner pendant 24 heures la viande dans le vin avec le laurier, les clous de girofle et la sauge.
- Cuire la viande couverte par la marinade (compléter avec de l'eau). Ajouter les anchois. Laisser réduire jusqu'à
  environ un demi-litre.
- Mélanger et passer le bouillon avec les œufs, l'huile, le thon, le jus de citron de façon à créer une sorte de
  mayonnaise. Réserver au réfrigérateur.
- En napper la viande froide, découpée en fines tranches sur des assiettes de présentation.
- Décorer avec des câpres. On peut ajouter un brin de coriandre ou de persil pour la couleur, voire une demi-rondelle
  de citron ou d'orange, avec une demi-olive noire dénoyautée.
