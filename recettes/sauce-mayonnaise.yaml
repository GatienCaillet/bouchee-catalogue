id: sauce-mayonnaise
titre: Sauce mayonnaise
portions: 4
temps:
  preparation: 25
  cuisson: 0
  repos: 15
ingredients:
- texte: 50 cl d'huile
  ingredients:
  - huile
  categorie: true
- 1 jaune d'œuf
- texte: 12 g de moutarde
  ingredients:
  - moutarde
  categorie: true
- texte: 5 cl de vinaigre
  ingredients:
  - vinaigre
  categorie: true
- sel, poivre
etapes:
- Avec un fouet, mélangez le jaune d'œuf et la moutarde.
- Laissez reposer 15 minutes.
- Ajoutez sel et poivre puis détendre avec le vinaigre.
- Ajoutez quelques gouttes d'huile et fouetter rapidement.
- Quand la mayonnaise commence à prendre, ajouter petit à petit le reste de l'huile en filet.
