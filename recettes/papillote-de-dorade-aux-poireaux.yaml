id: papillote-de-dorade-aux-poireaux
titre: Papillote de dorade aux poireaux
portions: 4
temps:
  preparation: 15
  cuisson: 20
  repos: 0
ingredients:
- 4 filets de dorade
- 2 poireaux
- 10 cl de crème liquide
- sel, poivre
etapes:
- Préchauffer le four à 200 °C.
- Émincer les poireaux et les faire fondre 8 minutes à la poêle.
- Découper 4 grandes feuilles de papier cuisson. Répartir la moitié de la garniture au centre, poser le poisson,
  puis le reste de la garniture.
- Saler, poivrer, arroser d'huile ou de crème, puis fermer hermétiquement les papillotes.
- Enfourner 15 à 20 minutes selon l'épaisseur du poisson et servir dans la papillote.
