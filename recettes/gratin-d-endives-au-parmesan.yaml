id: gratin-d-endives-au-parmesan
titre: Gratin d'endives au parmesan
portions: 4
temps:
  preparation: 15
  cuisson: 35
  repos: 0
ingredients:
- 6 endives
- 20 cl de crème fraîche
- 2 œufs
- 50 g de parmesan râpé
- 1 gousse d'ail
- sel, poivre
etapes:
- Retirer le cône amer à la base des endives et les couper en deux.
- Cuire les endives 10 minutes à la vapeur ou à l'eau bouillante salée, puis bien égoutter.
- Frotter un plat à gratin avec la gousse d'ail coupée en deux.
- Battre les œufs avec la crème, saler et poivrer.
- Disposer les endives dans le plat, verser la crème aux œufs et parsemer de parmesan.
- Enfourner 25 minutes à 190 °C.
source:
