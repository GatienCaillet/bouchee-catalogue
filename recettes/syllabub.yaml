id: syllabub
titre: Syllabub
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 30
ingredients:
- un zeste de citron non traité
- deux cuillères à soupe de sucre
- une c.s. de jus de citron
- une c.s. de cognac
- deux c.s. de Xérès
- 2 dl de crème entière bien froide.
etapes:
- Mélanger le zeste, le sucre, le jus de citron et les alcools dans une terrine et laisser macérer pendant 30 minutes
- Filtrer le mélange.
- Battre la crème en incorporant le mélange petit à petit
- Tenir au frais jusqu'au moment de servir.
