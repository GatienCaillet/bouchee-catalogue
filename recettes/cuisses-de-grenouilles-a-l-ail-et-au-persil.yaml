id: cuisses-de-grenouilles-a-l-ail-et-au-persil
titre: Cuisses de grenouilles à l'ail et au persil
portions: 4
temps:
  preparation: 31
  cuisson: 0
  repos: 0
ingredients:
- cuisses de grenouilles
- Beurre
- Ail
- Persil
- Farine
- sel
- Poivre
etapes:
- Rouler les cuisses de grenouilles dans la farine.
- Mettre les cuisses à cuire dans du beurre à feu doux
- Saler.
- Ajouter le persil,l'ail préalablement hachés. Poivrez au service pour ne pas faire chauffer le poivre.
