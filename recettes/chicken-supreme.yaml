id: chicken-supreme
titre: Chicken supreme
portions: 4
temps:
  preparation: 25
  cuisson: 45
  repos: 0
ingredients:
- ¼ de tasse de beurre fondu.
- ½ tasse de miel.
- texte: ¼ de tasse de moutarde.
  ingredients:
  - moutarde
  categorie: true
- 1 cuiller à café de curry en poudre.
- 4-5 blancs de poulet (ou de dinde, dans ce cas c'est un turkey supreme).
etapes:
- Dans une poêle, mélanger tous les ingrédients sauf la volaille.
- Ajouter la volaille à la préparation pour qu'elle en soit recouverte. Faire cuire à feu moyen 45 minutes en arrosant
  régulièrement et en tournant la volaille à mi-cuisson.
- Servir avec une salade et des pommes de terre sautées.
