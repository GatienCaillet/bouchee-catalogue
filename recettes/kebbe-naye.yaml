id: kebbe-naye
titre: Kebbé nayé
portions: 4
temps:
  preparation: 28
  cuisson: 20
  repos: 0
ingredients:
- 2 cuillerées à soupe de boulgour (blé concassé)
- 250 g de mouton haché (ou de bœuf haché extra-maigre)
- 1 petit oignon, haché très finement
- Sel et poivre
- 1 oignon, tranché finement
- huile d'olive
etapes:
- Couvrir d'eau le blé concassé et laisser gonfler vingt minutes. Mélanger la viande hachée avec l'oignon haché
  et le blé concassé. Saler et poivrer.
- Disposer au centre d'une assiette de grandeur moyenne et aplatir à la fourchette en suivant la forme de l'assiette.
  Décorer de fines tranches d'oignon. Au moment de servir, arroser d'un filet d'huile d'olive.
