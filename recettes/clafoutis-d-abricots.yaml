id: clafoutis-d-abricots
titre: Clafoutis d'abricots
portions: 4
temps:
  preparation: 15
  cuisson: 40
  repos: 0
ingredients:
- 800 g d'abricots
- 3 œufs
- 80 g de sucre
- 60 g de farine
- 30 cl de lait
- 20 g de beurre
- 1 sachet de sucre vanillé
etapes:
- Préchauffer le four à 180 °C et beurrer un plat.
- Dénoyauter les abricots et les couper en deux.
- Disposer les abricots dans le plat.
- Fouetter les œufs avec le sucre et le sucre vanillé, ajouter la farine puis le lait petit à petit.
- Verser sur les abricots et enfourner 40 minutes.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
