id: cookies-flocons-d-avoine-et-raisins-secs
titre: Cookies flocons d'avoine et raisins secs
portions: 4
temps:
  preparation: 37
  cuisson: 0
  repos: 0
ingredients:
- 125 g de beurre (1/2 tasse)
- 1/4 de tasse de sucre
- 1/2 tasse de mélasse
- 2 œufs
- 3/4 de tasse de farine
- 1 cuillère à café de sel (moins si vous utilisez du beurre salé)
- 1 cuillere à café de bicarbonate de soude
- 2 tasses de flocons d'avoine
- 1/2 tasse de raisins secs
etapes:
- Si vous ne trouvez pas de mélasse, utilisez 3/4 de tasse de vergeoise ou de cassonade, ou 1 tasse de sucre blanc
  et 3/4 de tasse de sucre brun très foncé et au goût très marqué, genre cassonade de Madagascar ou demerara.
