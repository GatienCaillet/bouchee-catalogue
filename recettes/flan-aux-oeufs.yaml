id: flan-aux-oeufs
titre: Flan aux œufs
portions: 4
temps:
  preparation: 22
  cuisson: 300
  repos: 125
ingredients:
- 4 à 6 œufs (suivant le calibre)
- 6 décilitres de lait
- 100 grammes de sucre en poudre
- 1 sachet de sucre vanillé (ou une gousse de vanille)
etapes:
- Faire bouillir le lait additionné du sucre vanillé
- Mélanger les œufs et le sucre dans un autre récipient
- Une fois le lait bouilli, le verser doucement sur le mélange œufs/sucre en remuant jusqu'à obtenir un mélange
  homogène
- Si possible, tamiser le mélange et laisser reposer 5 minutes
- Verser le mélange dans un plat ou des ramequins pouvant passer au micro-onde et au four
- Placer le plat au micro-onde pendant 13 à 20 minutes, suivant la puissance, jusqu'à ce que l'ensemble paraisse
  consistant
- Placer ensuite le plat au four en position grill pendant quelques minutes pour donner au flan sa dorure.
- Recouvrir le plat et le laisser reposer pendant au moins 2 heures au réfrigérateur (ne pas placer le plat au réfrigérateur
  tant qu'il est encore chaud !)
- Déguster dans les 24 heures
