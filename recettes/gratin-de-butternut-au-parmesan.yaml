id: gratin-de-butternut-au-parmesan
titre: Gratin de butternut au parmesan
portions: 4
temps:
  preparation: 15
  cuisson: 35
  repos: 0
ingredients:
- 1 courge butternut
- 20 cl de crème fraîche
- 2 œufs
- 50 g de parmesan râpé
- 1 gousse d'ail
- sel, poivre
etapes:
- Peler la courge, retirer les graines et la couper en cubes.
- Cuire la courge 10 minutes à la vapeur ou à l'eau bouillante salée, puis bien égoutter.
- Frotter un plat à gratin avec la gousse d'ail coupée en deux.
- Battre les œufs avec la crème, saler et poivrer.
- Disposer la courge dans le plat, verser la crème aux œufs et parsemer de parmesan.
- Enfourner 25 minutes à 190 °C.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
