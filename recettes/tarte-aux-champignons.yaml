id: tarte-aux-champignons
titre: Tarte aux champignons
portions: 4
temps:
  preparation: 28
  cuisson: 30
  repos: 0
ingredients:
- 1 pâte feuilletée
- texte: 600 g de champignons
  ingredients:
  - champignon
  categorie: true
- 2 œufs
- 1/4 l de lait
- Beurre
- sel, poivre
etapes:
- Émincer les champignons, les cuire au beurre, assaisonner.
- Disposer les champignons sur la pâte feuilletée.
- Mélanger les œufs, le lait, assaisonner et verser ce mélange sur le champignons.
- Cuire au four à 250°C 30 min.
