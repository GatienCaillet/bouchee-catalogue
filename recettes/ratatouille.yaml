id: ratatouille
titre: Ratatouille
portions: 4
temps:
  preparation: 30
  cuisson: 40
ingredients:
- 3 aubergines
- 2 courgettes
- 2 poivrons
- 400 g de tomates
- 2 gousses d'ail
- 3 oignons
- 6 c. à soupe d'huile d'olive
- 1 feuille de laurier
- 1 branche de thym
- sel
etapes:
- Couper les aubergines en dés de 2 cm, les saler pour les faire dégorger, puis les rincer.
- Les faire revenir dans de l'huile d'olive et réserver ; faire de même avec les courgettes, dans une huile propre.
- Faire fondre les oignons 10 minutes dans un peu d'huile, ajouter les poivrons en lamelles et laisser fondre.
- Ajouter les courgettes, les aubergines, puis les tomates pelées, épépinées et coupées en quartiers.
- Rectifier l'assaisonnement, ajouter le laurier, le thym et l'ail en chemise ; cuire 20 minutes.
