id: galaktoboureko
titre: Galaktoboúreko
portions: 4
temps:
  preparation: 37
  cuisson: 80
  repos: 0
ingredients:
- 450 g de pâte filo
- 650 g de sucre
- 6 œufs
- 150 g de semoule de blé
- 1 l de lait
- le jus d'un citron
- 2 gousses de vanille
- 2 g de sel
- 125 ml d'eau
etapes:
- 'Verser dans une casserole : 150 g de sucre, les œufs, ajouter et mélanger la semoule fine, le lait, 1/2 jus de
  citron, les gousses de vanille et le sel.'
- Battre en portant à ébullition. Dès que le mélange commence tout juste à bouillir, baisser le feu, remuer 10 min.
- Retirer du feu, beurrer les feuilles filo.
- Dans un plat beurré, déposer la moitié des feuilles de filo une à une, versez le mélange refroidi, recouvrir du
  reste de feuilles de filo.
- Verser un peu d'eau sur le dessus. Cuire 1 heure au four à 180 °C.
- 'Préparer le sirop à verser sur le Galaktoboúreko avant de le servir : mélanger l''eau, le sucre, et le jus de
  citron.'
- Porter à ébullition et cuire 10 min.
