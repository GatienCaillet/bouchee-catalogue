id: pates-aux-aubergines-et-a-la-tomate
titre: Pâtes aux aubergines et à la tomate
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de penne
- 2 aubergines
- 400 g de tomates pelées
- 4 c. à soupe d'huile d'olive
- 1 boule de mozzarella
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Faire dorer les aubergines en dés dans l'huile, ajouter les tomates et cuire 15 minutes ; ajouter la mozzarella
  en dés.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
decouverte:
  aliment: aubergine
  niveau: 2
  pourquoi: Les dés d'aubergine se fondent dans la sauce tomate.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
