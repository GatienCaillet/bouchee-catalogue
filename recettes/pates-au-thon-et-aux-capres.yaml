id: pates-au-thon-et-aux-capres
titre: Pâtes au thon et aux câpres
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de penne
- 2 boîtes de thon (280 g)
- 2 c. à soupe de câpres
- 400 g de tomates pelées
- 2 c. à soupe d'huile d'olive
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Faire chauffer les tomates dans l'huile 10 minutes, puis ajouter le thon émietté et les câpres.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
  licence: CC BY-SA 4.0 (Bouchée)
