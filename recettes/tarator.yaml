etapes:
- '* Un concombre * 500g de yaourt * Eau * Ail * Noix * Aneth * Sel * Huile * Vinaigre'
- Couper ou raper le concombre en petits morceaux. Diluer les 500g de yaourt dans environ 30 cl d'eau. Râper l'ail,
  les noix et l'aneth, et mélanger le tout. Rajouter le sel, l'huile et le vinaigre selon votre goût.
