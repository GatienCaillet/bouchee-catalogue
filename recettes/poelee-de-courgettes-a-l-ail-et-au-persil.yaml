id: poelee-de-courgettes-a-l-ail-et-au-persil
titre: Poêlée de courgettes à l'ail et au persil
portions: 4
temps:
  preparation: 10
  cuisson: 15
  repos: 0
ingredients:
- 800 g de courgettes
- 2 c. à soupe d'huile d'olive
- 2 gousses d'ail
- 1/2 botte de persil
- sel, poivre
etapes:
- Laver les courgettes et les couper en rondelles.
- Faire chauffer l'huile dans une grande poêle et y faire sauter les courgettes 10 à 15 minutes à feu vif, en remuant
  souvent.
- Hacher l'ail et le persil.
- Ajouter l'ail et le persil en fin de cuisson, saler, poivrer et cuire encore 2 minutes.
decouverte:
  aliment: courgette
  niveau: 4
  pourquoi: En accompagnement, la courgette poêlée garde un goût doux.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
