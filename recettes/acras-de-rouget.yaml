id: acras-de-rouget
titre: Acras de rouget
portions: 4
temps:
  preparation: 34
  cuisson: 0
  repos: 120
ingredients:
- 400 g de filet de rouget barbet effeuillé
- 100 g de pommes de terre
- 120 g de farine
- 1 œuf
- 4 cuillers à soupe de lait
- 1 gousse d'ail écrasée
- 1 oignon émincé et haché
- piment de Cayenne, sel et poivre du moulin, huile de friture
etapes:
- Mélangez 100 g de farine avec l'œuf, puis ajoutez peu à peu le lait pour obtenir une pâte molle, salez, poivrez,
  et laissez reposer pendant au moins deux heures.
- Épluchez et faites cuire la pomme de terre dans de l'eau salée bouillante, puis égouttez-les avant de les écraser
  à la fourchette.
- Mélangez le poisson effeuillé, l'oignon, l'ail et le piment de cayenne, avant d'incorporer le tout à la pâte.
- Farinez-vous les mains et formez des petites boules avec la préparation.
- Plongez les boules dans l'huile bouillante de la friteuse, et retirez-les dès qu'elles sont bien dorées.
- Servez bien chaud avec une sauce tomate tiède ou froide.
