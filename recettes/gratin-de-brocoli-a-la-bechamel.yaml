id: gratin-de-brocoli-a-la-bechamel
titre: Gratin de brocoli à la béchamel
portions: 4
temps:
  preparation: 20
  cuisson: 35
  repos: 0
ingredients:
- 600 g de brocoli
- 40 g de beurre
- 40 g de farine
- 50 cl de lait
- 1 pincée de muscade
- 80 g d'emmental râpé
- sel, poivre
etapes:
- Détacher le brocoli en petits bouquets et les laver.
- Cuire le brocoli 10 minutes à l'eau bouillante salée, puis bien égoutter.
- 'Préparer la béchamel : faire fondre le beurre, ajouter la farine, puis verser le lait petit à petit en fouettant
  jusqu''à épaississement. Saler, poivrer, ajouter la muscade.'
- Disposer le brocoli dans un plat à gratin beurré, napper de béchamel et parsemer d'emmental.
- Enfourner 25 minutes à 200 °C, jusqu'à ce que le dessus soit doré.
decouverte:
  aliment: brocoli
  niveau: 5
  pourquoi: Le brocoli est la vedette du plat, simplement gratiné.
source:
  titre: Recette Bouchée
