id: salade-nicoise
titre: Salade niçoise
portions: 6
temps:
  preparation: 30
  cuisson: 10
ingredients:
- 10 tomates
- 1 concombre
- 200 g de fèves fraîches
- 6 petits artichauts
- 2 poivrons verts
- 6 oignons nouveaux
- 6 feuilles de basilic
- 1 gousse d'ail
- 3 œufs durs
- 12 filets d'anchois
- 100 g d'olives noires
- 6 c. à soupe d'huile d'olive
- sel, poivre
etapes:
- Couper les tomates en quartiers et les saler légèrement ; couper les œufs en quartiers.
- Couper les filets d'anchois en morceaux et trancher finement le concombre épluché.
- Émincer finement les poivrons, les oignons, les artichauts et les fèves.
- Frotter le saladier avec l'ail coupé en deux et y mettre tous les ingrédients, sauf les tomates.
- Égoutter les tomates, les saler encore un peu et les ajouter.
- Préparer une sauce avec l'huile d'olive, le basilic haché, du sel et du poivre ; servir bien frais.
