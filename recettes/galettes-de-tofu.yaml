id: galettes-de-tofu
titre: Galettes de tofu
portions: 4
temps:
  preparation: 25
  cuisson: 10
  repos: 0
ingredients:
- 250 g de tofu
- 1 oignon haché
- 1 gousse d'ail écrasée
- 1 bouquet de persil
- sel, poivre, huile d'arachide.
etapes:
- Mixer le tofu, l'ail, l'oignon et le persil, de manière à obtenir une pâte souple. Assaisonner selon le goût.
  Former de petites galettes rondes, de 1cm d'épaisseur. Faire chauffer l'huile dans une poêle et dorer les galettes
  10 min de chaque côté.
