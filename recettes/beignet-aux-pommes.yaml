id: beignet-aux-pommes
titre: Beignet aux pommes
portions: 4
temps:
  preparation: 37
  cuisson: 0
  repos: 60
ingredients:
- 125 g de farine
- texte: 2 cuillères à soupe d'huile
  ingredients:
  - huile
  categorie: true
- de l'huile de friture
- 1 verre d'eau
- ½ sachet de levure chimique
- de la cannelle en poudre
- 1 blanc d'œuf
- 500 g de pommes
- 50 g de sucre en poudre
etapes:
- 'Préparez la pâte :'
- Dans un verre d'eau, diluez la levure.
- Dans une jatte, mélangez la farine avec l'huile et le verre d'eau contenant la levure.
- Faites une pâte liquide.
- Couvrez la jatte avec une serviette et laissez-la reposer dans un endroit sec pendant 1 heure.
- 'Préparez les pommes :'
- Pelez les pommes et retirez le cœur et les pépins.
- Découpez les pommes en tranches épaisses.
- Poudrez les tranches de sucre (et éventuellement de cannelle) et laissez macérer le temps que la pâte finisse
  de reposer.
- 'Faites les beignets :'
- Montez le blanc d'œuf en neige.
- Incorporez le blanc à la pâte très délicatement avec une fourchette avant de l'utiliser.
- Faites chauffer l'huile très chaude.
- Trempez les pommes dans la pâte pour bien les enrober avant de les plonger dans l'huile de friture très chaude.
  Retournez les beignets plusieurs fois pour qu'ils soient bien dorés et croquants. N'en mettez pas trop à la fois
  sinon la température du bain de friture retombera et la cuisson ne s'effectuera pas dans de bonnes conditions.
- Égouttez les beignets sur du papier absorbant, poudrez-les de sucre et servez tiède ou chaud.
