id: salade-de-pommes-et-pois-chiches2
titre: Salade de pommes et pois chiches2
portions: 4
temps:
  preparation: 25
  cuisson: 0
  repos: 0
ingredients:
- 500 ml de pois chiches cuits
- 2 pommes coupées en petits morceaux
- 3 oignons finement hachés
- texte: 125 ml de céleri haché
  ingredients:
  - celeri
  categorie: true
- 15 ml de jus de citron, 15 ml d'huile d'olive, ciboulette et basilic hachés, sel et poivre, au goût
etapes:
- 'Dans un saladier, mélanger : pois chiches, pommes coupées, oignons et céleri. Dans un récipient à vinaigrette,
  bien mélanger : jus de citron, huile d''olive, ciboulette, basilic, sel et poivre. Verser sur les pois chiches.'
- Laisser macérer quelques temps au réfrigérateur avant de servir.
