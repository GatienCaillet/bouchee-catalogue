id: glace-a-la-banane
titre: Glace à la banane
portions: 4
temps:
  preparation: 22
  cuisson: 50
  repos: 0
ingredients:
- 4 bananes
- 100 g de sucre
- 350 ml de lait
- 100 g de crème fraîche épaisse
etapes:
- Placer les ingrédients dans un mixeur
- Mixer jusqu'à obtenir un appareil ayant la consistance d'une crème
- Verser dans une sorbetière
- Turbiner au congélateur 50 min
