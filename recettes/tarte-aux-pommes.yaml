id: tarte-aux-pommes
titre: Tarte aux pommes
portions: 4
temps:
  preparation: 22
  cuisson: 25
  repos: 10
ingredients:
- pâte brisée
- 1,5 kg de pommes
- 200 g de sucre
- 1 paquet de sucre vanillé
etapes:
- Étaler la pâte dans un moule à tarte beurré et fariné, mettre au réfrigérateur 10 min
- Mettre les pommes (en réserver six pour la garniture) pelées et coupées en quartier dans une casserole, ajouter
  150 g de sucre et le sucre vanillé, couvrir et laisser réduire à feu doux, laisser refroidir
- Peler six pommes de même grosseur, les épépiner et les couper en tranches fines, piquer le fond de tarte et le
  tartiner avec la compote
- Disposer les pommes sur le fond en les faisant se chevaucher, saupoudrer de sucre
- Cuire au four à 180 °C durant 25 à 30 minutes
