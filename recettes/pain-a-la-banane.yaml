id: pain-a-la-banane
titre: Pain à la banane
portions: 4
temps:
  preparation: 37
  cuisson: 60
  repos: 0
ingredients:
- 200g de sucre
- 110g de beurre
- 3 bananes
- 2 œufs
- 250g de farine
- texte: 1 cuillère à café de levure
  ingredients:
  - levure
  categorie: true
- 100ml de lait
- 1 cuillère à café de sel
- Extrait de vanille.
etapes:
- Préchauffer le four à 175°C
- Graisser un moule à pain
- Mélanger l'ensemble des ingrédients dans un saladier. Bien mélanger
- Verser le mélange dans le moule
- Enfourner pendant 60 minutes. Vous pouvez insérer un couteau/cure-dent au centre du pain, si ce dernier ressort
  propre, vous pouvez arrêter sortir le pain.
