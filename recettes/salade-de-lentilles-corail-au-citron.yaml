id: salade-de-lentilles-corail-au-citron
titre: Salade de lentilles corail au citron
portions: 4
temps:
  preparation: 15
  cuisson: 8
  repos: 0
ingredients:
- 250 g de lentilles corail
- 1 oignon rouge
- 1 citron
- 1/2 botte de coriandre fraîche
- 4 c. à soupe d'huile d'olive
- 1 c. à café de cumin en poudre
- sel
etapes:
- Cuire les lentilles 8 minutes en les gardant fermes, puis les refroidir.
- Mélanger avec l'oignon émincé, la coriandre, le jus du citron, l'huile et le cumin.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
