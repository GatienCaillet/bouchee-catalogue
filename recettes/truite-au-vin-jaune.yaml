id: truite-au-vin-jaune
titre: Truite au vin jaune
portions: 4
temps:
  preparation: 28
  cuisson: 16
  repos: 0
ingredients:
- De belles truites
- 1 verre de vin jaune du Jura
- De la crème fraîche
- De l'huile d'olive
- Une échalote, sel, poivre, persil
- texte: Une petite cuillère de moutarde.
  ingredients:
  - moutarde
  categorie: true
etapes:
- Laver les truites
- Faire griller et dorer tout doucement les truites à feu doux, des deux côtés, à l'huile d'olive, saler, poivrer
  (10 min par face environ)
- Une fois grillée et dorées, les mettre dans un plat pour les servir
- Mettre dans la poêle une noix de beurre, une échalote hachée très fine, puis ajouter le verre de Vin Jaune bien
  remuer et faire réduire pendant 5 minutes à feu doux. Mélanger 2 cuillères à soupe de crème fraîche et laisser
  cuire 1 minutes
- Servez avec les truites et un peu de persil
- Accompagner de pomme de terre cuite à l'eau, ou de flan de courgettes...
- Accompagner de la bouteille de Vin Jaune du Jura
- Bon appétit, et bonne soif ...
