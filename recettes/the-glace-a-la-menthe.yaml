id: the-glace-a-la-menthe
titre: Thé glacé à la menthe
portions: 4
temps:
  preparation: 22
  cuisson: 10
  repos: 0
ingredients:
- 2 cuillerées à café de thé vert
- 30 g de menthe
- 20 g de sucre roux
- 1 litre d'eau
etapes:
- Mettre la menthe et le thé dans une casserole
- Compléter avec l'eau, porter à ébullition
- Laisser refroidir 10 minutes
- Mettre le sucre dans la boisson et remuer
- Prendre une bouteille, la recouvrir d'un entonnoir, lui-même recouvert par une passoire
- Filtrer le mélange dans la passoire de telle façon qu'il arrive dans la bouteille (tenter de faire chuter le mélange
  de haut, pour oxygéner le thé et faire mousser le sucre)
- Mettre au frais
