id: mousse-onctueuse-au-chocolat
titre: Mousse onctueuse au chocolat
portions: 4
temps:
  preparation: 28
  cuisson: 0
  repos: 120
ingredients:
- 3 blancs d'œufs
- 2 jaunes d'œufs
- 70 g de sucre
- 30 g de beurre
- 5 cl de café fort
- quelques gouttes de vanille liquide.
etapes:
- Faites fondre au bain marie, le chocolat et le beurre.
- Séparez les blancs des jaunes et commencez de monter les blancs en neige. Une fois mousseux, incorporez le sucre
  pour les serrer et continuez de fouetter jusqu'à l'obtention de blancs très fermes.
- Ajoutez les 2 jaunes au chocolat fondu puis le café. Mélangez bien le tout pour homogénéiser la préparation.
- Versez 1/3 des blancs dans le chocolat, assez vivement pour assouplir la préparation et les 2/3 restant délicatement
  à la maryse.
- Remplir les ramequins et garder au frais au moins 2heures avant de déguster. Régalez vous !
