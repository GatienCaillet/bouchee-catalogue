id: banane-au-chocolat
titre: Banane au chocolat
portions: 4
temps:
  preparation: 19
  cuisson: 2
  repos: 0
ingredients:
- 1 banane
- 3 carreaux de chocolat
- quelques pignons de pin ou noisettes
etapes:
- Couper la banane en rondelles, la placer dans un ramequin avec le chocolat.
- Faire chauffer 2 minutes au four micro-ondes.
- Saupoudrer de pignons ou noisettes.
