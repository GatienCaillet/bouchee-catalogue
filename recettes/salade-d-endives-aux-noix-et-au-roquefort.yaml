id: salade-d-endives-aux-noix-et-au-roquefort
titre: Salade d'endives aux noix et au roquefort
portions: 4
temps:
  preparation: 20
  cuisson: 0
  repos: 15
ingredients:
- 6 endives
- 50 g de cerneaux de noix
- 100 g de roquefort
- 1 poire
- 4 c. à soupe d'huile d'olive
- 2 c. à soupe de vinaigre de vin
- sel, poivre
etapes:
- Émincer les endives, couper la poire en lamelles et émietter le roquefort.
- Préparer la vinaigrette en mélangeant l'huile, l'acidité, le sel et le poivre.
- Réunir tous les ingrédients dans un saladier, arroser de vinaigrette et mélanger délicatement.
- Laisser reposer 15 minutes au frais avant de servir.
source:
  titre: Recette Bouchée
