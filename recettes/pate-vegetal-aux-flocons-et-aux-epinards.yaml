id: pate-vegetal-aux-flocons-et-aux-epinards
titre: Pâté végétal aux flocons et aux épinards
portions: 4
temps:
  preparation: 37
  cuisson: 30
  repos: 0
ingredients:
- 250 g de flocons d'avoine
- 4dL de lait de soja
- 700 g d'épinards
- 2 oignons
- 2 cuillères à soupe de levure diététique
- noix de muscade
- piment de Cayenne (facultatif)
- 2 cuillères à soupe de margarine végétale
- sel marin
etapes:
- Faites gonfler les flocons dans le lait de soja.
- Lavez et égouttez les épinards. Mettez-les dans une cocotte à fond épais et faites-les fondre ainsi en remuant
  de temps en temps.
- Hachez puis faire revenir les oignons dans la graisse végétale.
- Coupez grossièrement les épinards et mélangez-les aux flocons. Ajoutez la levure, les oignons, une càt rase de
  noix de muscade râpée, une pointe de piment et du sel.
- Préchauffez le four (th.6).
- Placez la préparation dans une grande cocotte et faites-la cuire sur feu doux pendant une dizaine de min. Travaillez
  de façon à obtenir une boule compacte qui se décolle facilement des parois de la cocotte.
- Goûtez et rectifiez l'assaisonnement.
- Huilez légèrement un moule à cake et remplissez-le de la préparation.
- Faites cuire à four chaud (th.6) pendant 30 min.
- Laissez refroidir le pâté avant de le servir en tranches accompagné d'une mayonnaise végétale.
- Vous pouvez remplacer les épinards par de la salade cuite.
