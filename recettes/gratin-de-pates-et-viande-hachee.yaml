id: gratin-de-pates-et-viande-hachee
titre: Gratin de pâtes et viande hachée
portions: 4
temps:
  preparation: 43
  cuisson: 30
  repos: 0
ingredients:
- 250 g de tagliatelles
- 250 g de bœuf haché
- 100 g de fromage râpé
- 50 g de lard maigre
- 40 g de persil haché
- 4 tomates
- 2 œufs
- 25 cl de lait
- 12 g de beurre
- 1 oignon
- texte: 2 de romarin, huile, sel, poivre
  ingredients:
  - romarin
  - huile
  - sel
  - poivre
  categorie: true
etapes:
- Cuire les pâtes, les égoutter et les refroidir à l'eau froide
- Émincer l'oignon, couper le lard en dés, faire revenir dans un peu d'huile. Ajouter la viande hachée, puis les
  herbes aromatiques
- Beurrer un moule, y déposer la moitié des pâtes. Recouvrir avec la viande hachée, puis de rondelles de tomates
  et finir avec le reste de pâtes
- Mélanger le lait, les œufs et assaisonner. Arroser le gratin avec ce mélange
- Saupoudrer de fromage râpé. Cuire 30 min au four à 175 °C
