id: compote-de-mangue-a-la-vanille
titre: Compote de mangue à la vanille
portions: 4
temps:
  preparation: 15
  cuisson: 20
  repos: 0
ingredients:
- 2 mangues
- 40 g de sucre
- 1 gousse de vanille
- 10 cl d'eau
etapes:
- Peler les mangues et couper la chair en cubes.
- Mettre la mangue dans une casserole avec l'eau, le sucre et la gousse de vanille fendue.
- Couvrir et cuire 20 minutes à feu doux en remuant de temps en temps.
- Retirer la vanille, écraser à la fourchette ou mixer selon la texture voulue, et laisser refroidir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
