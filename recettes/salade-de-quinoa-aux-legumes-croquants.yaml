id: salade-de-quinoa-aux-legumes-croquants
titre: Salade de quinoa aux légumes croquants
portions: 4
temps:
  preparation: 20
  cuisson: 20
  repos: 15
ingredients:
- 200 g de quinoa
- 1 concombre
- 1 poivron rouge
- 2 carottes
- 1/2 botte de menthe
- 4 c. à soupe d'huile d'olive
- 2 c. à soupe de vinaigre de vin
- sel, poivre
etapes:
- Cuire le quinoa 12 minutes ; couper les légumes en petits dés.
- Préparer la vinaigrette en mélangeant l'huile, l'acidité, le sel et le poivre.
- Réunir tous les ingrédients dans un saladier, arroser de vinaigrette et mélanger délicatement.
- Laisser reposer 15 minutes au frais avant de servir.
source:
