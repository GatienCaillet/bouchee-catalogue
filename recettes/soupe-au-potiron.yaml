id: soupe-au-potiron
titre: Soupe au potiron
portions: 4
temps:
  preparation: 15
  cuisson: 30
ingredients:
- 1 kg de potiron
- 1 oignon
- 1 gousse d'ail
- 1 l de bouillon de légumes
- 1 c. à soupe d'huile d'arachide
- sel, poivre
etapes:
- Hacher l'oignon et le faire revenir dans l'huile.
- Ajouter le potiron coupé en dés, le bouillon, l'ail écrasé, du sel et du poivre.
- Cuire 30 minutes, ou 15 minutes à l'autocuiseur, puis mixer.
