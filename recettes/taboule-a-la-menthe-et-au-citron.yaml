id: taboule-a-la-menthe-et-au-citron
titre: Taboulé à la menthe et au citron
portions: 4
temps:
  preparation: 20
  cuisson: 0
  repos: 15
ingredients:
- 200 g de semoule de blé
- 4 tomates
- 1 concombre
- 1 botte de persil
- 1/2 botte de menthe
- 2 citrons
- 4 c. à soupe d'huile d'olive
- 1 c. à soupe de jus de citron
- sel, poivre
etapes:
- Faire gonfler la semoule dans 20 cl d'eau bouillante ; couper les légumes en petits dés et ciseler les herbes.
- Préparer la vinaigrette en mélangeant l'huile, l'acidité, le sel et le poivre.
- Réunir tous les ingrédients dans un saladier, arroser de vinaigrette et mélanger délicatement.
- Laisser reposer 15 minutes au frais avant de servir.
source:
