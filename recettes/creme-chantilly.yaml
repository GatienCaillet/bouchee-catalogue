id: creme-chantilly
titre: Crème Chantilly
portions: 4
temps:
  preparation: 19
  cuisson: 0
  repos: 0
ingredients:
- 100 g de crème fraîche
- 25 g de sucre
- 1 cuillère à soupe de lait.
etapes:
- Mélanger le lait et la crème pour obtenir un lait épais.
- Ajouter le sucre. Battre à la main avec un fouet pour obtenir une mousse ferme.
