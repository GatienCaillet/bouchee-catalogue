id: quiche-lorraine
titre: Quiche lorraine
portions: 6
temps:
  preparation: 15
  cuisson: 60
ingredients:
- 1 pâte brisée
- 200 g de lardons fumés
- 50 cl de crème fraîche
- 10 cl de crème liquide
- 4 œufs
- sel, poivre, noix de muscade
etapes:
- Sortir la pâte à l'avance pour qu'elle soit à température ambiante, puis la disposer dans un moule.
- La cuire à blanc 15 à 20 minutes à 180 °C, lestée de poids pour qu'elle ne gonfle pas.
- Faire blanchir les lardons à la poêle, les égoutter et les répartir sur le fond de tarte.
- Battre les œufs, ajouter les deux crèmes, la muscade et le poivre ; saler peu, les lardons le sont déjà.
- Verser l'appareil sur les lardons et cuire environ 40 minutes à 180 °C.
