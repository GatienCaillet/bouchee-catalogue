id: puree-de-chou-fleur-et-pommes-de-terre
titre: Purée de chou-fleur et pommes de terre
portions: 4
temps:
  preparation: 15
  cuisson: 25
  repos: 0
ingredients:
- 1 chou-fleur
- 400 g de pommes de terre
- 30 g de beurre
- 10 cl de lait
- sel, poivre
etapes:
- Détacher le chou-fleur en petits bouquets et les laver.
- Éplucher les pommes de terre et les couper en morceaux.
- Cuire le chou-fleur et les pommes de terre 20 à 25 minutes à l'eau bouillante salée.
- Égoutter, puis écraser au presse-purée avec le beurre et le lait chaud.
- Saler, poivrer et servir aussitôt.
decouverte:
  aliment: chou_fleur
  niveau: 4
  pourquoi: Une purée où le chou-fleur pèse autant que la pomme de terre.
source:
  titre: Recette Bouchée
