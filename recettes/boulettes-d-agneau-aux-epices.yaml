id: boulettes-d-agneau-aux-epices
titre: Boulettes d'agneau aux épices
portions: 4
temps:
  preparation: 20
  cuisson: 12
  repos: 0
ingredients:
- 500 g d'agneau haché
- 1 oignon
- 1 c. à café de cumin en poudre
- 1 c. à café de coriandre en poudre
- 1/2 botte de menthe
- 2 c. à soupe d'huile d'olive
- sel, poivre
etapes:
- Mélanger l'agneau, l'oignon râpé, les épices et la menthe ciselée.
- Former des boulettes allongées.
- Les cuire 10 à 12 minutes à la poêle dans l'huile, en les retournant.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
