id: spaghettis-aux-palourdes
titre: Spaghettis aux palourdes
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de spaghettis
- 1 kg de palourdes
- 3 gousses d'ail
- 10 cl de vin blanc sec
- 4 c. à soupe d'huile d'olive
- 1/2 botte de persil
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Faire ouvrir les palourdes avec l'ail, l'huile et le vin blanc à couvert, puis ajouter le persil.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
  licence: CC BY-SA 4.0 (Bouchée)
  modifications: 'Recette rédigée pour Bouchée (base « pâtes »), pas encore testée en cuisine : quantités et temps
    à confirmer.'
