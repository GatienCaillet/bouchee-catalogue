id: pates-aux-courgettes-et-au-citron
titre: Pâtes aux courgettes et au citron
portions: 4
temps:
  preparation: 10
  cuisson: 20
  repos: 0
ingredients:
- 400 g de penne
- 3 courgettes
- 1 citron
- 2 c. à soupe d'huile d'olive
- 50 g de parmesan râpé
- sel, poivre
etapes:
- Porter une grande casserole d'eau salée à ébullition.
- Faire sauter les courgettes en dés dans l'huile 8 minutes, ajouter le zeste et le jus du citron.
- Cuire les pâtes selon les indications du paquet, les égoutter en gardant un peu d'eau de cuisson.
- Mélanger les pâtes à la sauce, détendre si besoin avec l'eau de cuisson, poivrer et servir.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
