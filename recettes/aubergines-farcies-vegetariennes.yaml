id: aubergines-farcies-vegetariennes
titre: Aubergines farcies végétariennes
portions: 4
temps:
  preparation: 40
  cuisson: 55
  repos: 0
ingredients:
- 2 grandes aubergines
- 250 g de tomates pelées et coupées
- 15 cl de bouillon végétal
- 15 cl d'huile d'olive
- 2 oignons finement hachés
- 2 gousses d'ail écrasées
- le jus d'un citron
- 1 cuiller à café de sucre brun
- 3 cuillers à café de pignons
- thym, romarin, origan, sel et poivre du moulin.
etapes:
- Après avoir coupé les aubergines, en deux dans le sens de la longueur, retirez la chair en laissant environ 1
  cm d'épaisseur dans les coques.
- Saupoudrez l'intérieur des coques un peu de sel et les placer à l'envers sur un plat pour éliminer le jus.
- Chauffez la moitié de l'huile dans une sauteuse. Mettez à frire les oignons et l'ail jusqu'à blondir, puis ajoutez
  les tomates coupées, et laissez cuire pendant environ 15 minutes à feu moyen jusqu'à ce que le mélange soit ferme.
- Lavez et séchez les coques d'aubergines et les farcir avec le mélange obtenu, puis disposez-les dans un plat allant
  au four.
- Mélangez l'huile restante avec les 150 ml de bouillon végétal, les herbes et les condiments, puis arrosez les
  aubergines et mettez les à cuire au four à 180°C pendant 40 minutes (elles doivent rester tendres).
