id: hareng-marine
titre: Hareng mariné
portions: 4
temps:
  preparation: 40
  cuisson: 0
  repos: 0
ingredients:
- 4 harengs frais
- texte: 4 verres de vinaigre
  ingredients:
  - vinaigre
  categorie: true
- 1 verre de vin blanc
- 1 verre d'eau
- 1 branche de thym
- 1 oignon
- 1 carotte
- Gros sel
- Poivre du moulin
- texte: Une cuillère d'huile
  ingredients:
  - huile
  categorie: true
etapes:
- Peler et laver les légumes
- Couper la tête des harengs
- Gratter les écailles
- Vider et laver les harengs
- Placer les harengs dans une cocotte
- Verser dans la cocotte les verres de vinaigre, de vin et d'eau
- Ajouter à l'eau le thym, l'oignon et la carotte
- Saler et poivrer
