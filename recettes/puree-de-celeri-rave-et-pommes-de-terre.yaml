id: puree-de-celeri-rave-et-pommes-de-terre
titre: Purée de céleri-rave et pommes de terre
portions: 4
temps:
  preparation: 15
  cuisson: 25
  repos: 0
ingredients:
- 1 céleri-rave
- 400 g de pommes de terre
- 30 g de beurre
- 10 cl de lait
- sel, poivre
etapes:
- Peler le céleri-rave et le couper en cubes.
- Éplucher les pommes de terre et les couper en morceaux.
- Cuire le céleri et les pommes de terre 20 à 25 minutes à l'eau bouillante salée.
- Égoutter, puis écraser au presse-purée avec le beurre et le lait chaud.
- Saler, poivrer et servir aussitôt.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
