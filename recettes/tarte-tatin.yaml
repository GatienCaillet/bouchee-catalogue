id: tarte-tatin
titre: Tarte Tatin
portions: 4
temps:
  preparation: 25
  cuisson: 35
  repos: 0
ingredients:
- 1 pâte brisée
- 6 belles pommes
- 60 g de beurre
- 50 g de sucre en poudre
- 100 g de sucre en morceaux
etapes:
- 1 moule à manqué.
- Mettre le sucre en morceau et le beurre dans le moule à manqué. Poser celui-ci sur le feu pour faire fondre le
  sucre en morceau jusqu' au caramel. Lorsque le caramel commence à brunir, enlever le moule du feu et poser le
  sur l'eau pour arrêter la cuisson.
- Peler les pommes, les épépiner et les couper en 4. Les disposer au fond du moule de telle sorte qu'elles se chevauchent
  tout en laissant un espace entre les pommes et le bord du moule.
- Saupoudrer de sucre en poudre et arroser de jus de citron. Parsemer de petits morceaux de beurre.
- Faire cuire un peu sur le feu. Il faut que le jus des pommes et le caramel se mélange. C'est le truc qui permet
  d'obtenir un goût très particulier.
- Étaler la pâte. La piquer avec une fourchette pour éviter qu'elle ne gonfle pendant la cuisson.
- Poser la pâte sur les pommes et faire un ourlet sur les bords. Aménager une petite cheminée au centre de la pâte
  pour évacuer l'air chaud pendant la cuisson.
- Enfourner pendant 30 minutes à 210°C.
- Attendre 5 à 10 minutes avant de démouler la tarte. Se déguste tiède avec de la crème fouettée ou une boule de
  glace à la vanille. Mais les Lichonneux de la tarte Tatin recommandent de la déguster sans glace, ni crème fouettée.
