id: carottes-roties-aux-herbes-de-provence
titre: Carottes rôties aux herbes de Provence
portions: 4
temps:
  preparation: 10
  cuisson: 35
  repos: 0
ingredients:
- 800 g de carottes
- 3 c. à soupe d'huile d'olive
- 1 c. à soupe d'herbes de Provence
- 2 gousses d'ail
- sel, poivre
etapes:
- Préchauffer le four à 210 °C.
- Éplucher les carottes et les couper en rondelles.
- Étaler les carottes sur une plaque, arroser d'huile d'olive et ajouter les gousses d'ail entières.
- Parsemer d'herbes de Provence, saler, poivrer et bien mélanger.
- Enfourner 30 à 40 minutes en remuant à mi-cuisson, jusqu'à ce que les légumes soient dorés et tendres.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
  auteurs: Bouchée
  licence: CC BY-SA 4.0 (Bouchée)
