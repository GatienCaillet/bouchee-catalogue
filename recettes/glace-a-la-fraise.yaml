id: glace-a-la-fraise
titre: Glace à la fraise
portions: 4
temps:
  preparation: 19
  cuisson: 2
  repos: 1470
ingredients:
- 1 kg de fraises
- 200 g de sucre (glace ou ordinaire)
- 200 g de crème fraîche épaisse (40 %)
etapes:
- Laver et équeuter les fraises
- Dans un mixeur
- Ajouter les fraises et 150 g de sucre
- Mixer jusqu'à obtenir un milk-shake
- Dans un récipient
- Verser 200 g de crème fraîche
- Ajouter 50 g de sucre
- Faire monter au batteur mixeur à main durant 2 min
- Mélanger les deux préparations
- Verser dans la sorbetière, mettre au congélateur et turbiner. Quand la sorbetière est placée au fond du congélateur,
  en contact direct avec la paroi, la glace durcit rapidement.
- Quand les pales de la sorbetière se sont relevées, verser la glace onctueuse dans un récipient. Vous pouvez alors
  servir la glace ou la replacer au congélateur.
- 'Conseils de conservation : pour préserver l''aspect onctueux de la glace, il est préférable de ne pas stocker
  le récipient en contact direct avec la paroi du congélateur. Par exemple, vous pouvez poser le récipient sur un
  emballage vide en carton, un très bon isolant. Lorsque la glace est restée plus de 24 heures au congélateur, elle
  durcit au froid. Pour retrouver l''aspect onctueux, il est alors préférable de placer la glace au réfrigérateur
  30 min avant de servir.'
