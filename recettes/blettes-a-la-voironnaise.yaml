id: blettes-a-la-voironnaise
titre: Blettes à la voironnaise
portions: 4
temps:
  preparation: 28
  cuisson: 35
  repos: 0
ingredients:
- 1 kg de côte de blette
- '1 jus de viande (ex: 30 cl de bouillon de bœuf)'
- 80 g de beurre
- 50 g de gruyère râpé
- 2 œufs
- Poivre et sel.
etapes:
- Préparer les côtes de bettes; retirer la verdure, les éplucher et couper les côtes en tronçons de 5 cm de long
  maximum
- Faire cuire dans l'eau salée les côtes de bettes pendant 25 minutes
- Égoutter
- Préparer le bouillon; le verser dans une casserole et le faire réduire afin de n'avoir plus que 4 cuillères à
  soupe du liquide
- Dans un poêle, déposer le beurre, y jeter ensuite les bettes et les faire revenir pendant 10 minutes à feu doux
- Ajouter le jus de viande, parsemer de gruyère rapé
- Casser les œufs, et les battre dans un bol. Les verser sur les côtes
- Assaisonner
- Servir bien chaud.
