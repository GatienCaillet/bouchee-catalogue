id: pate-vegetal-au-pain-et-aux-olives
titre: Pâté végétal au pain et aux olives
portions: 4
temps:
  preparation: 34
  cuisson: 40
  repos: 0
ingredients:
- 350 g de pain complet rassis
- 10 olives noires
- 2 bulbes de fenouil
- 2 gousses d'ail
- 2 oignons
- Huile d'olive
- 2 cuillères à soupe de Levure diététique
- Gros sel marin
etapes:
- Faites tremper le pain dans de l'eau.
- Pendant ce temps, épluchez puis hachez les oignons. Préparez les fenouils et coupez-les en 3 ou 4 morceaux.
- Dans une cocotte, faire revenir les oignons dans un peu d'huile d'olive et ajoutez les fenouils. Couvrez puis
  laissez cuire à feu doux.
- Dénoyautez les olives et coupez-les en rondelles. Dans un mortier, écrasez soigneusement l'ail avec une pincée
  de gros sel.
- Essorez le pain en le pressant dans un linge puis émiettez-le.
- Dans une grande cocotte, mélangez le pain, les olives, l'ail, la levure diététique et 3 càs d'huile d'olive.
- Lorsque les fenouils sont bien tendres, coupez-les en petits morceaux. Incorporez les oignons et les fenouils
  à la préparation.
- Préchauffez le four (th.6-7).
- Posez la cocotte sur feu doux et travaillez vigoureusement la préparation avec une cuillère en bois.
- L'ensemble doit former une boule compacte.
- Goûtez et rectifiez l'assaisonnement.
- Versez la préparation dans un moule à cake légèrement graissé.
- Faites cuire à four chaud pendant 40 min (th.6-7).
- Démoulez et laissez refroidir.
- Servez ce pâté végétal avec une salade de crudités ou un coulis de tomate.
