id: salade-de-lentilles-aux-carottes-et-au-persil
titre: Salade de lentilles aux carottes et au persil
portions: 4
temps:
  preparation: 20
  cuisson: 20
  repos: 15
ingredients:
- 250 g de lentilles vertes
- 2 carottes
- 1 échalote
- 1/2 botte de persil
- 4 c. à soupe d'huile d'olive
- 2 c. à soupe de vinaigre de vin
- sel, poivre
etapes:
- Cuire les lentilles 25 minutes à l'eau non salée ; râper les carottes, ciseler l'échalote et le persil.
- Préparer la vinaigrette en mélangeant l'huile, l'acidité, le sel et le poivre.
- Réunir tous les ingrédients dans un saladier, arroser de vinaigrette et mélanger délicatement.
- Laisser reposer 15 minutes au frais avant de servir.
source:
