id: riz-cantonais
titre: Riz cantonais
portions: 4
temps:
  preparation: 20
  cuisson: 30
ingredients:
- 200 g de riz basmati
- 40 cl d'eau
- 200 g d'échine de porc
- 2 tranches de jambon cru
- 1/2 poivron rouge
- 100 g de petits pois
- 1 c. à soupe d'huile de tournesol
- 2 c. à soupe de sauce soja
- 3 œufs
etapes:
- Mettre le riz dans une casserole, le couvrir d'eau bouillante salée et porter à frémissement à couvert.
- Quand il ne reste presque plus d'eau, couvrir hermétiquement et laisser cuire encore 10 minutes à feu très doux.
- Couper le porc, le jambon et le poivron en petits dés, puis les faire revenir à la poêle dans l'huile avec les
  petits pois.
- Arroser de sauce soja et incorporer le riz cuit.
- Cuire les œufs battus en omelette très fine, la découper en morceaux et l'ajouter au riz. Servir.
