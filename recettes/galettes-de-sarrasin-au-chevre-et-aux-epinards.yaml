id: galettes-de-sarrasin-au-chevre-et-aux-epinards
titre: Galettes de sarrasin au chèvre et aux épinards
portions: 4
temps:
  preparation: 15
  cuisson: 20
  repos: 60
ingredients:
- 250 g de farine de sarrasin
- 1 œuf
- 50 cl d'eau
- 200 g d'épinards
- 150 g de fromage de chèvre
- 20 g de beurre
- sel
etapes:
- Mélanger la farine, l'œuf, l'eau et le sel, et laisser reposer 1 heure.
- Faire tomber les épinards à la poêle.
- Cuire les galettes, les garnir d'épinards et de chèvre, et les replier.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
