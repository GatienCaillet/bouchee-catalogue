id: lasagnes-epinards-ricotta
titre: Lasagnes à la bolognaise, couche épinards-ricotta
portions: 4
temps:
  preparation: 30
  cuisson: 35
ingredients:
- 1 oignon
- 500 g de bœuf haché
- 600 g de coulis de tomate
- 12 plaques de lasagnes
- 250 g de ricotta
- 150 g de pousses d'épinards
- 1 boule de mozzarella
- 1 noix de beurre
- sel, poivre, 1 morceau de sucre
etapes:
- Émincer l'oignon et le faire dorer dans une sauteuse.
- Ajouter le bœuf haché et le faire revenir jusqu'à ce qu'il soit bien saisi.
- Verser le coulis de tomate, saler, ajouter le sucre et laisser mijoter 10 minutes.
- Faire tomber les épinards à la poêle sans matière grasse, les presser pour retirer l'eau, les hacher et les mêler
  à la ricotta.
- 'Beurrer le plat. Monter les lasagnes : plaques, bolognaise, plaques, une fine couche d''épinards à la ricotta,
  plaques, bolognaise.'
- Terminer par une couche de plaques nappée de sauce et couverte de mozzarella émiettée.
- Cuire 35 minutes au four préchauffé à 180 °C.
decouverte:
  aliment: epinard
  niveau: 2
  pourquoi: 'Une fine couche, au milieu des lasagnes : la ricotta adoucit le goût des épinards et la bolognaise
    domine.'
  conseil: Bien presser les épinards après cuisson pour éviter le côté aqueux.
