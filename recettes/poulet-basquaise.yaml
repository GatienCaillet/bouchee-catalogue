id: poulet-basquaise
titre: Poulet basquaise
portions: 4
temps:
  preparation: 30
  cuisson: 60
ingredients:
- 1 poulet (1,5 kg)
- 1 poivron rouge
- 1 poivron vert
- 6 tomates
- 2 oignons
- 4 gousses d'ail
- 3 c. à soupe d'huile d'olive
- sel
- 1 pincée de piment d'Espelette
etapes:
- Découper le poulet en morceaux.
- Plonger les tomates quelques secondes dans l'eau bouillante, puis les peler et les couper.
- Faire dorer le poulet dans une sauteuse avec l'huile d'olive, puis le réserver.
- Faire revenir dans la sauteuse les oignons émincés, les poivrons en lanières, les tomates et l'ail haché.
- Saler, ajouter le piment d'Espelette, remettre le poulet, les blancs sur le dessus.
- Couvrir et laisser mijoter une heure. Servir avec du riz.
