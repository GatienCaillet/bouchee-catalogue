id: beurre-monte
titre: Beurre monté
portions: 4
temps:
  preparation: 16
  cuisson: 0
  repos: 0
ingredients:
- du beurre froid
- un peu d'eau
etapes:
- Pour réaliser un beurre monté, faites bouillir une très petite quantité d'eau (15-60 mL, 1 à 4 cuillères).
- Une fois que l'eau s'est mise à bouillir, baissez le feu et commencez à incorporer le beurre froid dans l'eau
  chaude à l'aide d'un fouet, un à deux morceaux à la fois. *Ajoutez plus de beurre quand les morceaux ont fondus.
- Lorsque l'on commence à obtenir une émulsion, davantage de beurre peut être ajouté à la fois.
- Continuez à ajouter du beurre en fouettant jusqu'à obtenir la quantité désirée de beurre monté.
