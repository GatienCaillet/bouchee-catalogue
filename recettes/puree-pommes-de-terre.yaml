id: puree-pommes-de-terre
titre: Purée de pommes de terre
portions: 2
temps:
  preparation: 10
  cuisson: 35
ingredients:
- 500 g de pommes de terre
- 20 cl de lait
- 10 g de beurre
- sel
etapes:
- Éplucher les pommes de terre et les couper en morceaux.
- Les cuire 35 minutes à l'eau.
- Les égoutter, les écraser, puis ajouter le lait chaud, le beurre et le sel.
