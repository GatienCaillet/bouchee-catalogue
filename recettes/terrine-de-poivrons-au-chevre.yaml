id: terrine-de-poivrons-au-chevre
titre: Terrine de poivrons au chèvre
portions: 4
temps:
  preparation: 43
  cuisson: 60
  repos: 120
ingredients:
- 3 poivrons (vert, rouge, jaune)
- 1 oignon
- ½ botte de ciboulette
- 1 cuillère à soupe de fécule de maïs
- 300 g de fromage de chèvre frais
- 4 œufs
- 15 cl de lait
- 3 cuillères à soupe d'huile d'olive
- quelques copeaux de parmesan
- ciboulette
- sel, poivre.
etapes:
- Préchauffer le four à 180 °C. Epépiner les poivrons, les couper en dés. Peler et émincer l'oignon. Dans une poêle,
  faire suer 10 min ces légumes dans 2 cuillères à soupe d'huile. Saler, poivrer.
- Mélanger le chèvre frais avec le lait, les œufs, la fécule de maïs et 1 pincée de sel dans un récipient. Dans
  une terrine huilée, verser des couches de la préparation, intercalées avec des couches de légumes. Enfourner la
  terrine pour 50 min.
- Laisser refroidir, puis placer au réfrigérateur 2 h. Démouler, parsemer éventuellement de parmesan et décorer
  de ciboulette
- Accompagner la terrine d'un coulis de tomates frais.
