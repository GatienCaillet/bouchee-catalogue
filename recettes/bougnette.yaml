id: bougnette
titre: Bougnette
portions: 4
temps:
  preparation: 37
  cuisson: 0
  repos: 180
ingredients:
- 1 kg de farine
- 8 œufs
- zeste de 3 citrons
- 1 cube de levain (en boulangerie)
- sel
- 250 g de beurre
- 180 ml d'eau de fleur d'oranger
- 2 L d'huile de friture
- 1 kg de sucre fin pour saupoudrage
etapes:
- Mélanger le tout (farine, sel, œufs, beurre ramolli, levain, eau de fleur d'oranger, zestes de citron). Si la
  pâte est un peu sèche, rajouter du beurre, si elle colle trop, ajouter de la farine. Bien travailler la pâte,
  puis laisser reposer deux à trois heures dans un endroit tiède, posée dans un linge et à l'abri des courants d'air.
  La pâte doit doubler de volume.
- Étaler ensuite très finement des morceaux de pâte que l'on coupera en morceaux de la taille d'une main.
- Faire cuire l'une après l'autre les bougnettes en les plongeant une par une dans l'huile très chaude. La bougnette
  se boursoufle. Quand elle est dorée du premier côté, la retourner avec une fourchette pour faire cuire l'autre
  face. Dès qu'elle est dorée des deux côtés, la déposer sur un plat et la sucrer généreusement sans attendre.
- Laisser refroidir et servir à température ambiante.
