id: concombres-a-la-cretoise
titre: Concombres à la cretoise
portions: 6
temps:
  preparation: 37
  cuisson: 30
  repos: 0
ingredients:
- 3 concombres
- 250 g de féta
- 200 g de petites olives noires.
- 1 yaourt brassé
- 2 c à soupe de crème fraîche
- 1/2 citron
- 1 cuillerée à soupe d'huile d'olive
- sel
- poivre du moulin.
etapes:
- Pelez les concombres, ouvrez-les en deux dans le sens de la longueur enlevez les pépins à l'aide d'une cuillère
  à café.
- Détaillez la chair en dés.
- Mettez-les dans une passoire, saupoudrez de sel.
- Laissez-les dégorger 30 minutes.
- Épongez-les sur du papier absorbant.
- 'Coupez la féta en petits cubes. La sauce: mettez dans un bol le jus du demi citron, le yaourt, la crème fraîche
  et l''huile d''olive.'
- Fouettez. Disposez, sur un plat de service creux, les dés de concombre, les cubes de féta.
- Arrosez de sauce au yaourt.
- Mélangez. Saupoudrez de poivre et légèrement de sel. Décorez avec les olives noires.
- Servez très frais. Vous pouvez agrémenter cette salade de fines herbes et ajouter des petites tomates cerises.
