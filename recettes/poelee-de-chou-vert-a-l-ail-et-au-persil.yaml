id: poelee-de-chou-vert-a-l-ail-et-au-persil
titre: Poêlée de chou vert à l'ail et au persil
portions: 4
temps:
  preparation: 10
  cuisson: 15
  repos: 0
ingredients:
- 1 chou vert
- 2 c. à soupe d'huile d'olive
- 2 gousses d'ail
- 1/2 botte de persil
- sel, poivre
etapes:
- Retirer les grosses côtes du chou et l'émincer finement.
- Faire chauffer l'huile dans une grande poêle et y faire sauter le chou 10 à 15 minutes à feu vif, en remuant souvent.
- Hacher l'ail et le persil.
- Ajouter l'ail et le persil en fin de cuisson, saler, poivrer et cuire encore 2 minutes.
source:
  titre: Recette Bouchée
  url: https://github.com/GatienCaillet/bouchee-catalogue
