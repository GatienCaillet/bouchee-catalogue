id: croque-monsieur
titre: Croque-monsieur
portions: 4
temps:
  preparation: 10
  cuisson: 5
ingredients:
- 8 tranches de pain de mie
- 4 tranches d'emmental
- 2 tranches de jambon blanc
- 30 g de beurre demi-sel
- 50 g de gruyère râpé
etapes:
- Couper le jambon à la taille des tranches de pain.
- Beurrer un côté de chaque tranche de pain.
- Garnir le côté non beurré de quatre tranches avec le jambon et l'emmental, puis refermer avec les autres tranches,
  côté beurré à l'extérieur.
- Parsemer de gruyère et cuire 5 minutes dans un appareil à croque-monsieur ou sous le gril du four.
