id: fondant-aux-marrons
titre: Fondant aux marrons
portions: 6
temps:
  preparation: 22
  cuisson: 45
  repos: 0
ingredients:
- 500 grammes de crème de marrons
- 100 grammes de chocolat noir
- 100 grammes de beurre (en prévoir un peu plus pour le moule)
- 3 œufs.
etapes:
- Faire fondre le beurre et le chocolat au . Pendant ce temps, préparer les œufs dans un bol, les battre en omelette.
  Une fois le chocolat et le beurre fondus, lisser le mélange et le retirer du feu.
- Y incorporer la crème de marrons, petit à petit, remuer jusqu'à obtenir un mélange bien homogène. Mélanger ensuite
  les œufs à la préparation en les ajoutant progressivement.
- Une fois le mélange bien homogène, le placer dans le moule bien beurré et enfourner pendant 45 minutes à 150°C.
