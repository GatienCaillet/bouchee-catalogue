# Herbes aromatiques, épices et moutardes.
# Les mélanges du commerce (curry, ras el hanout, herbes de Provence) suivent la règle de l'union.
famille: herbes-epices
ingredients:
  - {id: herbe_aromatique, nom: herbe aromatique, alias_fr: [herbes aromatiques, fines herbes, herbes fraîches], alias_en: [herbs, fresh herbs]}
  - {id: basilic, nom: basilic, parent: herbe_aromatique, alias_fr: [feuilles de basilic, basilic frais], alias_en: [basil, fresh basil]}
  - {id: persil, nom: persil, parent: herbe_aromatique, alias_fr: [persil plat, persil frisé], alias_en: [parsley, flat-leaf parsley]}
  - {id: coriandre_feuille, nom: coriandre fraîche, parent: herbe_aromatique, alias_fr: [feuilles de coriandre, coriandre ciselée], alias_en: [cilantro, fresh coriander, coriander leaves], sensoriel: {odeur_forte: true}}
  - {id: ciboulette, nom: ciboulette, parent: herbe_aromatique, alias_en: [chives]}
  - {id: menthe, nom: menthe, parent: herbe_aromatique, alias_fr: [menthe fraîche, feuilles de menthe], alias_en: [mint, fresh mint]}
  - {id: thym, nom: thym, parent: herbe_aromatique, alias_fr: [brin de thym, branche de thym], alias_en: [thyme]}
  - {id: romarin, nom: romarin, parent: herbe_aromatique, alias_fr: [brin de romarin, branche de romarin], alias_en: [rosemary]}
  - {id: laurier, nom: laurier, parent: herbe_aromatique, alias_fr: [feuille de laurier, feuilles de laurier], alias_en: [bay leaf, bay leaves]}
  - {id: estragon, nom: estragon, parent: herbe_aromatique, alias_en: [tarragon]}
  - {id: aneth, nom: aneth, parent: herbe_aromatique, alias_en: [dill]}
  - {id: sauge, nom: sauge, parent: herbe_aromatique, alias_en: [sage]}
  - {id: origan, nom: origan, parent: herbe_aromatique, alias_fr: [marjolaine], alias_en: [oregano, marjoram]}
  - {id: cerfeuil, nom: cerfeuil, parent: herbe_aromatique, alias_en: [chervil]}
  - {id: sarriette, nom: sarriette, parent: herbe_aromatique, alias_en: [savory]}
  - id: herbes_de_provence
    nom: herbes de Provence
    parent: herbe_aromatique
    alias_en: [herbes de provence, provence herbs]
    composants: [thym, romarin, origan, sarriette, basilic]
    composition_variable: true
  - id: bouquet_garni
    nom: bouquet garni
    parent: herbe_aromatique
    alias_en: [bouquet garni herbs]
    composants: [thym, laurier, persil, celeri_branche, poireau]
    composition_variable: true
    note: Le bouquet garni classique peut contenir une branche de céleri ou un vert de poireau.

  - {id: epice, nom: épice, alias_fr: [épices, mélange d'épices], alias_en: [spice, spices, spice mix]}
  - {id: poivre, nom: poivre, parent: epice, alias_fr: [poivre noir, poivre blanc, poivre du moulin, poivre en grains, poivre moulu], alias_en: [black pepper, white pepper, ground pepper]}
  - {id: cumin, nom: cumin, parent: epice, alias_fr: [cumin en poudre, graines de cumin], alias_en: [cumin, ground cumin]}
  - {id: curcuma, nom: curcuma, parent: epice, alias_en: [turmeric]}
  - {id: paprika, nom: paprika, parent: epice, alias_fr: [paprika fumé, paprika doux], alias_en: [smoked paprika, sweet paprika]}
  - {id: piment_d_espelette, nom: piment d'Espelette, parent: epice, alias_en: [espelette pepper], sensoriel: {piquant: 1}}
  - {id: piment_de_cayenne, nom: piment de Cayenne, parent: epice, alias_fr: [cayenne, piment en poudre, flocons de piment], alias_en: [cayenne pepper, chili powder, chilli flakes], sensoriel: {piquant: 3}}
  - {id: cannelle, nom: cannelle, parent: epice, alias_fr: [bâton de cannelle, cannelle en poudre], alias_en: [cinnamon]}
  - {id: muscade, nom: noix muscade, parent: epice, alias_fr: [muscade, noix de muscade], alias_en: [nutmeg], note: "Malgré son nom, n'est pas un fruit à coque au sens réglementaire."}
  - {id: gingembre, nom: gingembre, parent: epice, alias_fr: [gingembre frais, gingembre en poudre], alias_en: [ginger, fresh ginger], sensoriel: {piquant: 2}}
  - {id: clou_de_girofle, nom: clou de girofle, parent: epice, alias_fr: [clous de girofle], alias_en: [clove, cloves]}
  - {id: cardamome, nom: cardamome, parent: epice, alias_en: [cardamom]}
  - {id: coriandre_graine, nom: coriandre en grains, parent: epice, alias_fr: [graines de coriandre, coriandre moulue, coriandre en poudre], alias_en: [coriander seeds, ground coriander]}
  - {id: fenugrec, nom: fenugrec, parent: epice, alias_en: [fenugreek], sensoriel: {amer: 1}}
  - {id: carvi, nom: carvi, parent: epice, alias_en: [caraway]}
  - {id: badiane, nom: badiane, parent: epice, alias_fr: [anis étoilé], alias_en: [star anise]}
  - {id: vanille, nom: vanille, parent: epice, alias_fr: [gousse de vanille, extrait de vanille, sucre vanillé], alias_en: [vanilla, vanilla pod, vanilla extract]}
  - {id: safran, nom: safran, parent: epice, alias_en: [saffron]}
  - id: curry
    nom: curry en poudre
    parent: epice
    alias_fr: [curry, poudre de curry, curry doux, curry fort]
    alias_en: [curry powder]
    composants: [curcuma, coriandre_graine, cumin, fenugrec, piment_de_cayenne, gingembre, poivre, graine_de_moutarde, graine_de_celeri, farine_de_ble]
    composition_variable: true
    sensoriel: {piquant: 1}
    note: Certains currys contiennent graines de moutarde, céleri ou farine de blé.
  - id: ras_el_hanout
    nom: ras el hanout
    parent: epice
    alias_en: [ras el hanout spice]
    composants: [cumin, coriandre_graine, cannelle, gingembre, curcuma, poivre, piment_de_cayenne, muscade, cardamome, clou_de_girofle]
    composition_variable: true

  - {id: moutarde, nom: moutarde, allergenes: [moutarde], alias_en: [mustard]}
  - {id: graine_de_moutarde, nom: graine de moutarde, parent: moutarde, alias_fr: [graines de moutarde], alias_en: [mustard seeds]}
  - id: moutarde_de_dijon
    nom: moutarde de Dijon
    parent: moutarde
    alias_fr: [moutarde forte, moutarde à l'ancienne, moutarde en grains, moutarde douce]
    alias_en: [dijon mustard, wholegrain mustard]
    composants: [graine_de_moutarde, vinaigre_de_vin, sel]
    allergenes: [sulfites]
    composition_variable: true
    sensoriel: {piquant: 2}
    note: La moutarde de Dijon contient le plus souvent du disulfite de potassium.
