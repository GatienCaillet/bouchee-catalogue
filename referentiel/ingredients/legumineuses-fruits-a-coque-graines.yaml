# Légumineuses, fruits à coque et graines.
# Arachide, soja et lupin sont des légumineuses ; chacune porte son propre allergène.
# Fruits à coque : les huit de la liste réglementaire seulement. Le pignon est une graine,
# sans allergène réglementaire (mais le pesto du commerce peut contenir des noix de cajou).
famille: legumineuses-fruits-a-coque-graines
ingredients:
  - {id: legumineuse, nom: légumineuse, alias_fr: [légumineuses, légumes secs], alias_en: [pulses, dried legumes]}
