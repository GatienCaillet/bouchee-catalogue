  - {id: pois_chiche, nom: pois chiche, parent: legumineuse, alias_fr: [pois chiches], alias_en: [chickpea, chickpeas, garbanzo beans], ciqual: 20516}
  - {id: haricot_sec, nom: haricot sec, parent: legumineuse, alias_fr: [haricots blancs, haricots rouges, haricots noirs, lingots, flageolets, cocos], alias_en: [white beans, kidney beans, black beans, cannellini beans], sensoriel: {textures: [farineux]}, ciqual: 20501}
  - {id: feve, nom: fève, parent: legumineuse, alias_fr: [fèves], alias_en: [broad beans, fava beans], ciqual: 20517}
  - {id: petit_pois, nom: petit pois, parent: legumineuse, alias_fr: [petits pois, pois cassés], alias_en: [peas, green peas, split peas], ciqual: 20072}
  - {id: haricot_vert, nom: haricot vert, parent: legumineuse, alias_fr: [haricots verts, haricots beurre, mange-tout], alias_en: [green beans, french beans, string beans], ciqual: 20061}

  - {id: soja, nom: soja, parent: legumineuse, allergenes: [soja], alias_fr: [graines de soja, fèves de soja], alias_en: [soy, soya, soybeans], ciqual: 20901}
  - {id: farine_de_soja, nom: farine de soja, parent: soja, alias_en: [soy flour], ciqual: 20900}
  - {id: tofu, nom: tofu, parent: soja, alias_fr: [tofu ferme, tofu soyeux, tofu fumé], alias_en: [bean curd, silken tofu], sensoriel: {textures: [spongieux]}, ciqual: 20904}
