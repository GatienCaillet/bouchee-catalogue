  - {id: lecithine_de_soja, nom: lécithine de soja, parent: soja, alias_en: [soy lecithin], ciqual: 42200}

  - {id: arachide, nom: arachide, parent: legumineuse, allergenes: [arachides], alias_fr: [cacahuète, cacahuètes, cacahouète, cacahouètes, arachides], alias_en: [peanut, peanuts, groundnut], ciqual: 15001}
  - id: beurre_de_cacahuete
    nom: beurre de cacahuète
    ciqual: 15202
    parent: arachide
    alias_fr: [beurre de cacahouète, pâte d'arachide, beurre d'arachide]
